<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mod · docs</title>
<style>
  :root {
    --bg:#0a0d0b; --fg:#d9e4dd; --muted:#77857d; --accent:#10b981;
    --border:#1b241f; --code:#0e1310; --heading:#f0f6f2;
    --thumb:#152019;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         -webkit-font-smoothing:antialiased; }
  .wrap { display:flex; min-height:100vh; }

  /* ── sidebar ── */
  aside { width:264px; flex:none; border-right:1px solid var(--border);
          padding:26px 18px 18px; position:sticky; top:0; height:100vh; overflow:auto;
          display:flex; flex-direction:column; gap:4px; }
  .brand { font-weight:700; letter-spacing:.05em; color:var(--accent); margin:0; font-size:16px; }
  .brand small { display:block; color:var(--muted); font-weight:400; letter-spacing:.02em; margin-top:2px; }

  /* mode switch — one control, whole site */
  .mode { margin:20px 0 14px; }
  .mode .seg { position:relative; display:grid; grid-template-columns:1fr 1fr;
               border:1px solid var(--border); border-radius:999px; padding:3px;
               background:#ffffff06; }
  .mode .thumb { position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px);
                 border-radius:999px; background:linear-gradient(180deg,#1b2b22,#14221b);
                 box-shadow:0 1px 6px #0009, inset 0 1px 0 #ffffff12;
                 transition:transform .28s cubic-bezier(.32,.72,.28,1); }
  .mode .seg.eng .thumb { transform:translateX(100%); }
  .mode button { position:relative; z-index:1; background:none; border:0; cursor:pointer;
                 padding:7px 0; font:600 11.5px/1 inherit; letter-spacing:.14em;
                 color:var(--muted); transition:color .28s; border-radius:999px; }
  .mode button.on { color:var(--accent); }
  .mode .hint { display:block; margin:8px 2px 0; color:var(--muted); font-size:11.5px;
                letter-spacing:.02em; min-height:1.4em; transition:opacity .25s; }

  nav { display:flex; flex-direction:column; gap:1px; }
  nav a { display:block; padding:6px 12px; color:var(--fg); text-decoration:none;
          border-radius:7px; font-size:13.5px; text-transform:capitalize;
          transition:background .15s,color .15s; }
  nav a:hover { background:#ffffff0a; }
  nav a.active { background:color-mix(in srgb,var(--accent) 13%,transparent); color:var(--accent); }

  /* ── content ── */
  main { flex:1; padding:44px 56px 80px; max-width:820px; }
  #content { transition:opacity .18s ease; }
  #content.fade { opacity:0; }
  main img { max-width:100%; }
  h1,h2,h3 { color:var(--heading); line-height:1.25; letter-spacing:-.01em; }
  h1 { font-size:30px; border-bottom:1px solid var(--border); padding-bottom:.35em; margin-top:.2em; }
  h2 { margin-top:1.8em; }
  a { color:var(--accent); }
  pre { background:var(--code); border:1px solid var(--border); border-radius:10px;
        padding:14px 16px; overflow:auto; }
  code { background:#ffffff10; padding:.12em .4em; border-radius:4px; font-size:.92em; }
  pre code { background:none; padding:0; }
  table { border-collapse:collapse; display:block; overflow-x:auto; }
  th,td { border:1px solid var(--border); padding:6px 10px; }
  blockquote { border-left:3px solid var(--accent); margin:0; padding:.2em 1em; color:var(--muted); }
  .muted { color:var(--muted); }

  /* subtle badge when a page only exists in engineer form */
  .only-eng { display:inline-flex; align-items:center; gap:6px; margin:0 0 14px;
              padding:5px 12px; border:1px solid var(--border); border-radius:999px;
              color:var(--muted); font-size:11.5px; letter-spacing:.06em; }
  .only-eng::before { content:""; width:6px; height:6px; border-radius:50%;
                      background:var(--accent); opacity:.6; }

  @media (max-width:760px) {
    .wrap { flex-direction:column; }
    aside { width:100%; height:auto; position:static; border-right:0;
            border-bottom:1px solid var(--border); }
    main { padding:26px 20px 60px; }
  }

  /* ── ask-the-docs chatbot ── */
  #askBtn { position:fixed; right:22px; bottom:22px; z-index:40;
            display:inline-flex; align-items:center; gap:8px;
            padding:11px 16px; border:1px solid var(--border); border-radius:999px;
            background:linear-gradient(180deg,#132018,#0e1712); color:var(--accent);
            font:600 12.5px/1 inherit; letter-spacing:.06em; cursor:pointer;
            box-shadow:0 4px 16px #0008; transition:transform .18s, border-color .18s; }
  #askBtn:hover { transform:translateY(-1px); border-color:var(--accent); }
  #askBtn::before { content:""; width:7px; height:7px; border-radius:50%;
                    background:var(--accent); box-shadow:0 0 8px var(--accent); }
  #ask { position:fixed; right:22px; bottom:22px; z-index:41; width:min(400px,calc(100vw - 32px));
         height:min(560px,calc(100vh - 44px)); display:none; flex-direction:column;
         background:#0b110d; border:1px solid var(--border); border-radius:16px;
         box-shadow:0 12px 40px #000b; overflow:hidden; }
  #ask.open { display:flex; }
  .ask-hd { display:flex; align-items:center; justify-content:space-between;
            padding:13px 15px; border-bottom:1px solid var(--border); }
  .ask-hd b { color:var(--heading); font-size:13.5px; letter-spacing:.02em; }
  .ask-hd small { color:var(--muted); font-size:10.5px; letter-spacing:.06em; display:block; margin-top:2px; }
  .ask-x { background:none; border:0; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; padding:2px 6px; }
  .ask-x:hover { color:var(--fg); }
  .ask-log { flex:1; overflow:auto; padding:16px 15px; display:flex; flex-direction:column; gap:14px; }
  .ask-empty { color:var(--muted); font-size:13px; }
  .ask-empty ul { margin:10px 0 0; padding-left:18px; }
  .ask-empty li { cursor:pointer; color:var(--accent); }
  .msg { font-size:13.5px; line-height:1.6; }
  .msg.you { align-self:flex-end; max-width:85%; background:color-mix(in srgb,var(--accent) 14%,transparent);
             border:1px solid var(--border); padding:8px 12px; border-radius:12px 12px 3px 12px; color:var(--heading); }
  .msg.bot { align-self:flex-start; max-width:100%; }
  .msg.bot p:first-child { margin-top:0; }
  .msg.bot pre { font-size:12px; }
  .msg .srcs { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .msg .srcs a { font-size:10.5px; letter-spacing:.04em; text-decoration:none; text-transform:capitalize;
                 border:1px solid var(--border); border-radius:999px; padding:3px 9px; color:var(--muted); }
  .msg .srcs a:hover { border-color:var(--accent); color:var(--accent); }
  .msg.err { color:#f6a; }
  .ask-in { display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); }
  .ask-in input { flex:1; background:var(--code); border:1px solid var(--border); border-radius:9px;
                  padding:9px 11px; color:var(--fg); font:inherit; font-size:13px; }
  .ask-in input:focus { outline:none; border-color:var(--accent); }
  .ask-in button { border:0; border-radius:9px; padding:0 15px; background:var(--accent); color:#04140d;
                   font:600 12.5px/1 inherit; cursor:pointer; }
  .ask-in button:disabled { opacity:.5; cursor:default; }
  .dots::after { content:"…"; animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <p class="brand">mod<br><small>protocol docs</small></p>
    <div class="mode">
      <div class="seg" id="seg">
        <div class="thumb"></div>
        <button data-m="simple">HUMAN</button>
        <button data-m="tech">ENGINEER</button>
      </div>
      <span class="hint" id="modeHint"></span>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main><div id="content"><p class="muted">Loading…</p></div></main>
</div>

<button id="askBtn" onclick="askOpen(true)">Ask the docs</button>
<section id="ask" aria-label="Ask the docs">
  <div class="ask-hd">
    <div><b>Ask the docs</b><small>grounded in these pages · Liquid LFM</small></div>
    <button class="ask-x" onclick="askOpen(false)" aria-label="close">×</button>
  </div>
  <div class="ask-log" id="askLog">
    <div class="ask-empty" id="askEmpty">Ask anything about the mod protocol. Try:
      <ul>
        <li onclick="askSend('How do I create a new module?')">How do I create a new module?</li>
        <li onclick="askSend('What is a skill?')">What is a skill?</li>
        <li onclick="askSend('How does a module expose an MCP server?')">How does a module expose an MCP server?</li>
      </ul>
    </div>
  </div>
  <form class="ask-in" onsubmit="event.preventDefault();askSend()">
    <input id="askIn" placeholder="Ask a question…" autocomplete="off" />
    <button id="askGo" type="submit">Ask</button>
  </form>
</section>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const BASE = "/docs";
const order = ["README","getting-started","protocol","cli","api","modules","orbit","servers","storage","keys","skills","contracts","frontend","utils","whitepaper"];
const label = n => n === "README" ? "Overview" : n.replace(/-/g," ");
const HINTS = { simple: "plain language — no jargon", tech: "the full technical detail" };

// One site-wide reading mode, chosen by each reader, remembered per browser.
const mode = () => { try { return localStorage.getItem("docs.mode") || "simple"; } catch(e) { return "simple"; } };
const setMode = v => { try { localStorage.setItem("docs.mode", v); } catch(e){} };

let PAGES = [];           // [{name, simple}]
let current = "README";

function paintMode() {
  const m = mode();
  document.getElementById("seg").classList.toggle("eng", m === "tech");
  document.querySelectorAll(".mode button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  document.getElementById("modeHint").textContent = HINTS[m];
}

async function loadPages() {
  try { PAGES = await (await fetch(BASE + "/_pages")).json(); } catch(e){}
  PAGES.sort((a,b) => { const ia=order.indexOf(a.name), ib=order.indexOf(b.name);
    return (ia<0?99:ia) - (ib<0?99:ib) || a.name.localeCompare(b.name); });
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  for (const p of PAGES) {
    const a = document.createElement("a");
    a.textContent = label(p.name); a.href = BASE + "/" + p.name; a.dataset.page = p.name;
    a.onclick = e => { e.preventDefault(); show(p.name, true); };
    nav.appendChild(a);
  }
  const start = (location.pathname.replace(BASE,"").replace(/^\//,"").replace(/\.md$/,"")) || "README";
  show(PAGES.some(p => p.name === start) ? start : (PAGES[0]?.name || "README"), false);
}

async function show(page, push) {
  current = page;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.page === page));
  const box = document.getElementById("content");
  box.classList.add("fade");
  const wantSimple = mode() === "simple";
  try {
    const r = await fetch(BASE + "/_page/" + page + (wantSimple ? "?v=simple" : ""));
    const md = await r.text();
    const got = r.headers.get("x-docs-variant") || (wantSimple ? "simple" : "tech");
    setTimeout(() => {
      box.innerHTML = window.marked ? marked.parse(md) : "<pre>" + md.replace(/[&<]/g,c=>({"&":"&amp;","<":"&lt;"}[c])) + "</pre>";
      if (wantSimple && got === "tech") {
        const b = document.createElement("span");
        b.className = "only-eng"; b.textContent = "engineer edition — no plain-language version yet";
        box.prepend(b);
      }
      box.classList.remove("fade");
    }, 120);
  } catch(e) {
    box.innerHTML = "<p class='muted'>Could not load “"+page+"”.</p>";
    box.classList.remove("fade");
  }
  if (push) history.pushState({}, "", BASE + "/" + page);
  window.scrollTo(0,0);
}

document.querySelectorAll(".mode button").forEach(b => b.onclick = () => {
  if (b.dataset.m === mode()) return;
  setMode(b.dataset.m);
  paintMode();
  show(current, false);   // same page, other voice
});

window.onpopstate = () => show((location.pathname.replace(BASE,"").replace(/^\//,"").replace(/\.md$/,"")) || "README", false);
paintMode();
loadPages();

// ── ask-the-docs chatbot ──
// The web panel and any MCP agent hit the same tool: POST tools/call docs_ask to
// /docs/mcp. No second endpoint, no drift from the CLI's m docs/ask.
let asking = false;
const askOpen = on => {
  document.getElementById("ask").classList.toggle("open", on);
  document.getElementById("askBtn").style.display = on ? "none" : "";
  if (on) setTimeout(() => document.getElementById("askIn").focus(), 50);
};
function askAppend(cls, html) {
  const empty = document.getElementById("askEmpty");
  if (empty) empty.remove();
  const log = document.getElementById("askLog");
  const el = document.createElement("div");
  el.className = "msg " + cls; el.innerHTML = html;
  log.appendChild(el); log.scrollTop = log.scrollHeight;
  return el;
}
async function askSend(preset) {
  if (asking) return;
  const input = document.getElementById("askIn");
  const q = (preset || input.value).trim();
  if (!q) return;
  input.value = "";
  askAppend("you", q.replace(/[&<]/g, c => ({ "&": "&amp;", "<": "&lt;" }[c])));
  const go = document.getElementById("askGo"); go.disabled = asking = true;
  const pending = askAppend("bot", "<span class='dots'>thinking</span>");
  try {
    const r = await fetch(BASE + "/mcp", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method: "tools/call",
        params: { name: "docs_ask", arguments: { question: q } } }),
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error.message || "request failed");
    const out = j.result?.structuredContent
      || JSON.parse(j.result?.content?.[0]?.text || "{}");
    if (!out.ok) throw new Error(out.error || "no answer");
    const ans = window.marked ? marked.parse(out.answer || "") : (out.answer || "");
    const srcs = (out.sources || []).map(s =>
      `<a href="${BASE}/${s}" onclick="event.preventDefault();askOpen(false);show('${s}',true)">${label(s)}</a>`).join("");
    pending.innerHTML = ans + (srcs ? `<div class="srcs">${srcs}</div>` : "");
  } catch (e) {
    pending.className = "msg err";
    pending.textContent = "Couldn't answer: " + e.message;
  } finally {
    document.getElementById("askLog").scrollTop = 1e9;
    go.disabled = asking = false; input.focus();
  }
}
</script>
</body>
</html>
