<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mod · docs</title>
<style>
  :root { --bg:#0b0e0c; --panel:#11161300; --fg:#d6e2da; --muted:#7d8c84;
          --accent:#10b981; --border:#1d2622; --code:#0f1411; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { display:flex; min-height:100vh; }
  aside { width:250px; flex:none; border-right:1px solid var(--border); padding:18px 14px; position:sticky; top:0; height:100vh; overflow:auto; }
  .brand { font-weight:700; letter-spacing:.04em; color:var(--accent); margin:0 0 4px; font-size:15px; }
  .brand small { color:var(--muted); font-weight:400; }
  nav a { display:block; padding:6px 10px; color:var(--fg); text-decoration:none; border-radius:6px; font-size:13.5px; text-transform:capitalize; }
  nav a:hover { background:#ffffff0a; }
  nav a.active { background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); }
  main { flex:1; padding:34px 44px; max-width:880px; }
  main img { max-width:100%; }
  h1,h2,h3 { color:#eef5f1; line-height:1.25; }
  h1 { border-bottom:1px solid var(--border); padding-bottom:.3em; }
  a { color:var(--accent); }
  pre { background:var(--code); border:1px solid var(--border); border-radius:8px; padding:14px 16px; overflow:auto; }
  code { background:#ffffff10; padding:.12em .4em; border-radius:4px; font-size:.92em; }
  pre code { background:none; padding:0; }
  table { border-collapse:collapse; } th,td { border:1px solid var(--border); padding:6px 10px; }
  blockquote { border-left:3px solid var(--accent); margin:0; padding:.2em 1em; color:var(--muted); }
  .muted { color:var(--muted); }
  .wp-toggle { display:flex; align-items:center; gap:10px; margin:0 0 18px; }
  .wp-toggle .seg { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
  .wp-toggle button { background:none; border:0; color:var(--muted); font:12.5px/1 inherit; padding:7px 14px; cursor:pointer; letter-spacing:.03em; }
  .wp-toggle button.on { background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); }
  .wp-toggle .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <p class="brand">mod<br><small>protocol docs</small></p>
    <nav id="nav"></nav>
  </aside>
  <main id="content"><p class="muted">Loading…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const BASE = "/docs";
const order = ["README","getting-started","protocol","cli","api","modules","orbit","servers","storage","keys","skills","contracts","frontend","utils","simple-whitepaper","whitepaper"];
const label = n => n === "README" ? "Overview" : n.replace(/-/g," ");

// The two whitepaper variants share one nav entry + an on-page Simple/Full toggle.
const WP_FULL = "whitepaper", WP_SIMPLE = "simple-whitepaper";
const isWp = p => p === WP_FULL || p === WP_SIMPLE;
const wpPref = () => { try { return localStorage.getItem("docs.wp") || "simple"; } catch(e) { return "simple"; } };
const setWpPref = v => { try { localStorage.setItem("docs.wp", v); } catch(e){} };

async function loadPages() {
  let pages = [];
  try { pages = await (await fetch(BASE + "/_pages")).json(); } catch(e){}
  pages.sort((a,b) => { const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib) || a.localeCompare(b); });
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  for (const p of pages) {
    if (p === WP_SIMPLE) continue;
    const a = document.createElement("a");
    a.textContent = label(p); a.href = BASE + "/" + p; a.dataset.page = p;
    a.onclick = e => { e.preventDefault(); show(p === WP_FULL && wpPref() === "simple" ? WP_SIMPLE : p, true); };
    nav.appendChild(a);
  }
  const start = (location.pathname.replace(BASE,"").replace(/^\//,"").replace(/\.md$/,"")) || "README";
  show(pages.includes(start) ? start : (pages[0]||"README"), false);
}

async function show(page, push) {
  document.querySelectorAll("#nav a").forEach(a =>
    a.classList.toggle("active", a.dataset.page === page || (a.dataset.page === WP_FULL && isWp(page))));
  const main = document.getElementById("content");
  try {
    const md = await (await fetch(BASE + "/_page/" + page)).text();
    main.innerHTML = window.marked ? marked.parse(md) : "<pre>" + md.replace(/[&<]/g,c=>({"&":"&amp;","<":"&lt;"}[c])) + "</pre>";
    if (isWp(page)) wpToggle(main, page);
  } catch(e) { main.innerHTML = "<p class='muted'>Could not load “"+page+"”.</p>"; }
  if (push) history.pushState({}, "", BASE + "/" + page);
  window.scrollTo(0,0);
}

function wpToggle(main, page) {
  const simple = page === WP_SIMPLE;
  const bar = document.createElement("div");
  bar.className = "wp-toggle";
  bar.innerHTML =
    '<span class="seg">' +
      '<button data-v="simple" class="' + (simple ? "on" : "") + '">SIMPLE</button>' +
      '<button data-v="full" class="' + (simple ? "" : "on") + '">FULL</button>' +
    '</span>' +
    '<span class="hint">' + (simple ? "the human version — no jargon" : "the technical version") + '</span>';
  bar.querySelectorAll("button").forEach(b => b.onclick = () => {
    setWpPref(b.dataset.v);
    show(b.dataset.v === "simple" ? WP_SIMPLE : WP_FULL, true);
  });
  main.prepend(bar);
}
window.onpopstate = () => show((location.pathname.replace(BASE,"").replace(/^\//,"").replace(/\.md$/,"")) || "README", false);
loadPages();
</script>
</body>
</html>
