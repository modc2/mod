[package]
name = "mod-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mod-api"
path = "src/main.rs"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization — preserve_order so the catalog reflects config.json key order.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Error handling + logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# State
parking_lot = "0.12"

# HTTP client — queries the chain module's hub API for the on-chain registry
# and the configurable embeddings provider for semantic search. rustls-tls lets
# it reach a hosted HTTPS provider (e.g. OpenAI) without pulling in native
# OpenSSL; the chain hub stays plain HTTP on localhost.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
k256 = { version = "0.13.4", features = ["ecdsa"] }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
hex = "0.4.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
