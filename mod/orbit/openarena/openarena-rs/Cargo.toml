[package]
name = "openarena-rs"
version = "0.2.0"
edition = "2021"
description = "Agent arena — MCP server, sandboxed judge and Elo leaderboard for the openarena mod"

[[bin]]
name = "openarena-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
opt-level = 2
strip = true
