[package]
name = "defi-api"
version = "1.0.0"
edition = "2021"
description = "Modular DeFi composer — block catalog, graph validation, solc compilation, deployment planning, and an MCP server"

[[bin]]
name = "defi-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
dirs = "5.0"

[profile.release]
opt-level = 2
strip = true

[workspace]
