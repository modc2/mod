<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x — rust mcp backend</title>
<style>
:root{
  --bg:#000; --panel:rgba(255,255,255,.04); --line:rgba(255,255,255,.1);
  --text:#e7e9ea; --dim:#71767b; --acc:#1d9bf0; --acc2:#00ba7c; --err:#f4212e;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,'Inter',system-ui,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(700px 400px at 12% -5%,rgba(29,155,240,.16),transparent 60%),
             radial-gradient(600px 380px at 96% 0%,rgba(0,186,124,.07),transparent 55%)}
.wrap{max-width:980px;margin:0 auto;padding:36px 20px 60px;position:relative}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
h1{font-size:22px;letter-spacing:.5px}
h1 b{color:var(--acc)}
.tag{font:11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.sub{color:var(--dim);margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;backdrop-filter:blur(8px)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);margin-bottom:12px}
.full{grid-column:1/-1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-family:var(--mono);font-size:12px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)}
.ok{color:var(--acc2)} .no{color:var(--err)}
.tool{padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.tool:last-child{border-bottom:0}
.tool .n{font-family:var(--mono);font-size:12.5px;color:var(--acc)}
.tool .d{color:var(--dim);font-size:12px}
input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:99px;color:var(--text);padding:10px 14px;font:12.5px var(--mono);outline:none}
input:focus{border-color:var(--acc)}
.row{display:flex;gap:8px;margin-top:8px}
button{background:var(--acc);border:0;border-radius:99px;color:#fff;padding:9px 20px;font-weight:700;cursor:pointer;font-size:13px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
button:disabled{opacity:.5;cursor:default}
pre{margin-top:12px;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:12px;padding:12px;
  font:11.5px/1.5 var(--mono);color:#c9d3e0;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
a{color:var(--acc);text-decoration:none}
footer{margin-top:26px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1><b>x</b> · rust mcp backend</h1><span class="tag" id="ver">…</span></header>
  <p class="sub">X API v2 exposed as MCP tools — Streamable HTTP at <code>/mcp</code>, stdio via <code>x-api --stdio</code>.</p>

  <div class="grid">
    <div class="card">
      <h2>Server</h2>
      <div id="stat"></div>
    </div>

    <div class="card">
      <h2>Try it</h2>
      <input id="q" placeholder="search query — e.g. bittensor -is:retweet" value="bittensor -is:retweet">
      <div class="row">
        <button id="go">search</button>
        <button class="ghost" id="tools-btn">tools/list</button>
      </div>
      <input id="pid" style="margin-top:8px" placeholder="post id or x.com URL (keyless)" value="20">
      <div class="row"><button class="ghost" id="getpost">get_post</button></div>
    </div>

    <div class="card full">
      <h2>MCP tools</h2>
      <div id="tools">loading…</div>
    </div>

    <div class="card full">
      <h2>Output</h2>
      <pre id="out">—</pre>
    </div>
  </div>

  <footer>
    <code>m x/serve</code> · <code>claude mcp add x -- x-api --stdio</code> ·
    credentials live in <code>~/.mod/x/credentials.json</code>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const show = v => $('out').textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
const bool = b => `<span class="${b ? 'ok' : 'no'}">${b ? 'yes' : 'no'}</span>`;

async function j(url, opts) {
  const r = await fetch(url, opts);
  return r.json();
}

async function boot() {
  const info = await j('/health');
  $('ver').textContent = 'v' + info.version;
  $('stat').innerHTML = [
    ['upstream', info.upstream],
    ['protocol', info.protocol],
    ['reads (bearer)', bool(info.auth.reads)],
    ['writes (user ctx)', bool(info.auth.writes)],
  ].map(([k, v]) => `<div class="kv"><span class="k">${k}</span><span>${v}</span></div>`).join('');

  const { tools } = await j('/tools');
  $('tools').innerHTML = tools.map(t =>
    `<div class="tool"><div class="n">${t.name}</div><div class="d">${t.description}</div></div>`).join('');
}

$('go').onclick = async () => {
  show('searching…');
  show(await j('/search?q=' + encodeURIComponent($('q').value)));
};
$('getpost').onclick = async () => {
  show('fetching…');
  show(await j('/posts/' + encodeURIComponent($('pid').value.trim())));
};
$('tools-btn').onclick = async () => show(await j('/mcp', {
  method: 'POST',
  headers: { 'content-type': 'application/json' },
  body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/list' }),
}));

boot().catch(e => show(String(e)));
</script>
</body>
</html>
