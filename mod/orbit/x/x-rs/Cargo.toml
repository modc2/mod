[package]
name = "x-rs"
version = "0.2.0"
edition = "2021"
description = "X (Twitter) API v2 MCP server — Rust backend for the x mod"

[[bin]]
name = "x-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
percent-encoding = "2"

[profile.release]
opt-level = 2
strip = true
