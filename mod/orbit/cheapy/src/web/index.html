<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%233ddc84%27/%3E%3C/svg%3E">
<title>cheapy — the cheapest model for the job</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #15181d; --line: #252a31; --text: #e8eaed;
    --dim: #8a929c; --accent: #3ddc84; --accent2: #1f6f45; --warn: #f5c518;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.5px; }
  h1 b { color: var(--accent); }
  .tag { color: var(--dim); }
  .src { margin-left: auto; color: var(--dim); font-size: 12px; }
  .src button { background: none; border: 1px solid var(--line); border-radius: 6px;
                padding: 2px 8px; cursor: pointer; margin-left: 6px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 16px; margin-top: 16px; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px;
          padding: 5px 12px; cursor: pointer; }
  .chip.on, .chip:hover { border-color: var(--accent); color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  label.f { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
  label.f input, label.f select { background: var(--bg); border: 1px solid var(--line);
       border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .toggles { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; color: var(--dim); }
  .toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .est { margin-top: 12px; display: flex; gap: 8px; }
  .est textarea { flex: 1; min-height: 38px; background: var(--bg); border: 1px solid var(--line);
       border-radius: 8px; padding: 8px 10px; color: var(--text); font: inherit; resize: vertical; }
  .est button, .cmp button { background: var(--accent2); border: 0; border-radius: 8px;
       padding: 8px 14px; cursor: pointer; }
  .best { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card .k { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .card .v { font-size: 22px; font-weight: 600; margin: 4px 0; color: var(--accent); }
  .card .m { font-size: 13px; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  td .id { color: var(--dim); font-size: 12px; }
  tr:hover td { background: #1a1e24; }
  .caps span { font-size: 11px; border: 1px solid var(--line); border-radius: 4px;
               padding: 0 4px; margin-right: 3px; color: var(--dim); }
  .free { color: var(--warn); }
  .muted { color: var(--dim); }
  .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
  .more { margin-top: 12px; text-align: center; }
  .more button { background: none; border: 1px solid var(--line); border-radius: 8px;
                 padding: 6px 16px; cursor: pointer; }
  .cmp { position: fixed; left: 0; right: 0; bottom: 0; background: #101317;
         border-top: 1px solid var(--line); padding: 10px 16px; display: none; }
  .cmp.show { display: block; }
  .cmp .in { max-width: 1100px; margin: 0 auto; }
  .cmp table td { padding: 4px 6px; }
  .cmp .x, .x { color: var(--dim); cursor: pointer; background: none; border: 0; padding: 2px 6px; }
  body.cmp-open .wrap { padding-bottom: 240px; }
  @media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><b>cheapy</b></h1>
    <span class="tag">the cheapest model that can actually do the job</span>
    <span class="src" id="src"></span>
  </header>

  <div class="panel">
    <div class="presets" id="presets"></div>
    <div class="grid">
      <label class="f">Tokens in, per call<input id="it" type="number" min="0" step="100"></label>
      <label class="f">Tokens out, per call<input id="ot" type="number" min="0" step="50"></label>
      <label class="f">Number of calls<input id="calls" type="number" min="1" step="1"></label>
      <label class="f">Search name<input id="q" placeholder="e.g. llama, mini"></label>
      <label class="f">Price
        <select id="free">
          <option value="0">Paid only</option>
          <option value="">Paid + free</option>
          <option value="1">Free only</option>
        </select>
      </label>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="tools"> Can call tools</label>
      <label><input type="checkbox" id="vision"> Reads images</label>
      <label><input type="checkbox" id="reasoning"> Can reason</label>
    </div>
    <div class="est">
      <textarea id="sample" placeholder="Not sure how many tokens? Paste a typical input here."></textarea>
      <button id="estBtn">Count tokens</button>
    </div>
  </div>

  <div class="best" id="best" style="margin-top:16px"></div>

  <div class="panel">
    <div class="row">
      <div id="count" class="muted"></div>
      <div class="muted">Tick models to compare them side by side</div>
    </div>
    <table>
      <thead><tr>
        <th></th><th>Model</th><th class="n">This job</th><th class="n hide-sm">Per call</th>
        <th class="n hide-sm">In $/M</th><th class="n hide-sm">Out $/M</th>
        <th class="n hide-sm">Context</th><th class="hide-sm">Can</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="more" id="more"></div>
  </div>
</div>

<div class="cmp" id="cmp"><div class="in">
  <div class="row"><b>Compare</b><button class="x" id="cmpClear">clear</button></div>
  <table><tbody id="cmpRows"></tbody></table>
</div></div>

<script>
const API = 'api/';  // page lives at /cheapy/, so this is /cheapy/api/
const PRESETS = [
  { name: 'Chat reply',        it: 1500,   ot: 400,  calls: 1000 },
  { name: 'Summarize a doc',   it: 20000,  ot: 800,  calls: 100 },
  { name: 'Coding agent step', it: 60000,  ot: 2000, calls: 300, tools: true },
  { name: 'Classify rows',     it: 300,    ot: 10,   calls: 100000 },
  { name: 'Describe images',   it: 1500,   ot: 300,  calls: 1000, vision: true },
  { name: 'Whole book in',     it: 400000, ot: 2000, calls: 1 },
];
const $ = id => document.getElementById(id);
let limit = 25, picked = new Map(), last = [];

function money(v) {
  if (v === 0) return 'free';
  if (v < 0.0001) return '<$0.0001';
  if (v < 0.01) return '$' + v.toFixed(4);
  if (v < 100) return '$' + v.toFixed(2);
  return '$' + Math.round(v).toLocaleString();
}
const perM = v => v === 0 ? '0' : (v < 0.01 ? v.toFixed(4) : v.toFixed(2));
const ctx = n => !n ? '?' : n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M' : Math.round(n / 1000) + 'K';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function job() {
  return { input_tokens: +$('it').value || 0, output_tokens: +$('ot').value || 0,
           calls: Math.max(1, +$('calls').value || 1) };
}

function save() {
  const s = { ...job(), q: $('q').value, free: $('free').value,
              tools: $('tools').checked, vision: $('vision').checked, reasoning: $('reasoning').checked };
  localStorage.setItem('cheapy.job', JSON.stringify(s));
  return s;
}

function load() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem('cheapy.job')) || {}; } catch (e) {}
  const p = PRESETS[0];
  $('it').value = s.input_tokens ?? p.it;
  $('ot').value = s.output_tokens ?? p.ot;
  $('calls').value = s.calls ?? p.calls;
  $('q').value = s.q || '';
  $('free').value = s.free ?? '0';
  $('tools').checked = !!s.tools; $('vision').checked = !!s.vision; $('reasoning').checked = !!s.reasoning;
}

function presets() {
  $('presets').innerHTML = PRESETS.map((p, i) => `<button class="chip" data-i="${i}">${p.name}</button>`).join('');
  $('presets').onclick = e => {
    const i = e.target.dataset.i; if (i == null) return;
    const p = PRESETS[i];
    $('it').value = p.it; $('ot').value = p.ot; $('calls').value = p.calls;
    $('tools').checked = !!p.tools; $('vision').checked = !!p.vision; $('reasoning').checked = false;
    limit = 25; run();
  };
  markPreset();
}

function markPreset() {
  const j = job();
  [...$('presets').children].forEach((b, i) => {
    const p = PRESETS[i];
    b.classList.toggle('on', p.it === j.input_tokens && p.ot === j.output_tokens && p.calls === j.calls);
  });
}

async function call(fn, args) {
  const qs = new URLSearchParams(Object.entries(args).filter(([, v]) => v !== '' && v !== false && v != null));
  const r = await fetch(API + fn + '?' + qs);
  const d = await r.json();
  if (d && d.error) throw new Error(d.error);
  return d;
}

let seq = 0;
async function run() {
  const s = save(); markPreset();
  const mine = ++seq;
  let d;
  try {
    d = await call('cheapest', { ...s, tools: s.tools ? 1 : '', vision: s.vision ? 1 : '',
                                 reasoning: s.reasoning ? 1 : '', limit });
  } catch (e) {
    $('rows').innerHTML = `<tr><td colspan="8" class="muted">Could not load prices: ${esc(e.message)}</td></tr>`;
    return;
  }
  if (mine !== seq) return;
  last = d.models;
  source(d);
  $('count').textContent = d.count
    ? `${d.count} models fit — ${d.job.calls.toLocaleString()} calls of ${d.job.input_tokens.toLocaleString()} in / ${d.job.output_tokens.toLocaleString()} out`
    : 'No model fits. Loosen a filter or lower the token counts.';
  best(d.models);
  $('rows').innerHTML = d.models.map(m => `
    <tr>
      <td><input type="checkbox" data-id="${esc(m.id)}" ${picked.has(m.id) ? 'checked' : ''}></td>
      <td>${esc(m.name)}<div class="id">${esc(m.id)}</div></td>
      <td class="n ${m.free ? 'free' : ''}"><b>${money(m.total)}</b></td>
      <td class="n hide-sm">${money(m.per_call)}</td>
      <td class="n hide-sm">${perM(m.in_m)}</td>
      <td class="n hide-sm">${perM(m.out_m)}</td>
      <td class="n hide-sm">${ctx(m.context)}</td>
      <td class="caps hide-sm">${m.tools ? '<span>tools</span>' : ''}${m.vision ? '<span>images</span>' : ''}${m.reasoning ? '<span>reason</span>' : ''}</td>
    </tr>`).join('');
  $('more').innerHTML = d.count > d.models.length ? `<button id="moreBtn">Show more (${d.count - d.models.length} left)</button>` : '';
  if ($('moreBtn')) $('moreBtn').onclick = () => { limit += 50; run(); };
  compare();
}

function best(ms) {
  const paid = ms.filter(m => !m.free);
  const cards = [];
  if (ms[0]) cards.push(['Cheapest', ms[0]]);
  if (paid[0] && paid[0] !== ms[0]) cards.push(['Cheapest paid', paid[0]]);
  const big = [...ms].sort((a, b) => b.context - a.context)[0];
  if (big && !cards.some(c => c[1] === big)) cards.push(['Biggest context in view', big]);
  $('best').innerHTML = cards.map(([k, m]) => `
    <div class="card"><div class="k">${k}</div><div class="v">${money(m.total)}</div>
      <div class="m">${esc(m.name)}</div><div class="m muted">${ctx(m.context)} context</div></div>`).join('');
}

function source(d) {
  const when = d.fetched_at ? new Date(d.fetched_at * 1000).toLocaleString() : 'unknown';
  const label = { live: 'live', cache: 'cached', stale: 'offline, last saved', snapshot: 'offline snapshot' }[d.source] || d.source;
  $('src').innerHTML = `OpenRouter prices · ${label} · ${when}<button id="refresh">refresh</button>`;
  $('refresh').onclick = async () => {
    $('refresh').textContent = '...';
    try { await call('refresh', {}); } catch (e) {}
    run();
  };
}

async function compare() {
  document.body.classList.toggle('cmp-open', picked.size > 0);
  if (!picked.size) { $('cmp').classList.remove('show'); return; }
  $('cmp').classList.add('show');
  const d = await call('compare', { ids: [...picked.keys()].join(','), ...job() });
  $('cmpRows').innerHTML = d.models.map(m => `
    <tr><td>${esc(m.name)}</td><td class="n"><b>${money(m.total)}</b></td>
      <td class="n muted">${m.x == null ? '' : m.x === 1 ? 'cheapest' : m.x + 'x'}</td>
      <td><button class="x" data-rm="${esc(m.id)}">remove</button></td></tr>`).join('');
}

$('rows').onchange = e => {
  const id = e.target.dataset.id; if (!id) return;
  e.target.checked ? picked.set(id, 1) : picked.delete(id);
  compare();
};
$('cmpRows').onclick = e => {
  const id = e.target.dataset.rm; if (!id) return;
  picked.delete(id); run();
};
$('cmpClear').onclick = () => { picked.clear(); run(); };

$('estBtn').onclick = async () => {
  const text = $('sample').value;
  if (!text) return;
  const d = await call('estimate', { chars: text.length });
  $('it').value = d.tokens; run();
};

let t;
for (const id of ['it', 'ot', 'calls', 'q']) $(id).oninput = () => { clearTimeout(t); limit = 25; t = setTimeout(run, 250); };
for (const id of ['free', 'tools', 'vision', 'reasoning']) $(id).onchange = () => { limit = 25; run(); };

load(); presets(); run();
</script>
</body>
</html>
