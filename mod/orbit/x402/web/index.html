<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x402 · every paid API</title>
<style>
  :root{--bg:#090b0f;--panel:#10141a;--panel2:#141922;--line:#1d2430;--line2:#2a3342;--text:#e8edf3;
        --dim:#8592a3;--faint:#566273;--accent:#facc15;--accent2:#f59e0b;--ok:#6ee7b7;--bad:#f87171;
        --get:#34d399;--post:#facc15;--put:#60a5fa;--del:#f87171;
        --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
        --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,monospace;
        --r:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{color:var(--text);font:14px/1.5 var(--sans);padding:28px 24px 60px;max-width:1240px;margin:0 auto;
       background:radial-gradient(900px 380px at 12% -120px,rgba(250,204,21,.10),transparent 70%),
                  radial-gradient(700px 300px at 95% -80px,rgba(245,158,11,.06),transparent 70%);
       background-repeat:no-repeat;-webkit-font-smoothing:antialiased}
  ::selection{background:rgba(250,204,21,.3)}
  header{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;
        background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1300;
        font:800 15px/1 var(--mono);letter-spacing:-.02em;box-shadow:0 6px 24px -6px rgba(250,204,21,.5)}
  h1{font-size:22px;font-weight:750;letter-spacing:-.01em;line-height:1.1}
  header .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .hint{color:var(--dim);font-size:13px;margin-bottom:16px;max-width:760px}
  .hint code{font-family:var(--mono);font-size:12px;color:var(--text)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:0 0 22px;gap:1px;
         background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .stat{padding:14px 18px;background:var(--panel)}
  .stat b{display:block;font:700 22px/1.2 var(--mono);letter-spacing:-.02em}
  .stat:first-child b{color:var(--accent)}
  .stat span{color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .stat .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:7px;
              vertical-align:middle;box-shadow:0 0 0 0 rgba(110,231,183,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(110,231,183,0)}100%{box-shadow:0 0 0 0 rgba(110,231,183,0)}}
  nav{display:inline-flex;gap:2px;padding:4px;margin-bottom:18px;background:var(--panel);
      border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
  nav a{padding:7px 14px;color:var(--dim);cursor:pointer;border-radius:9px;font-size:13px;font-weight:600;
        transition:color .12s,background .12s;user-select:none}
  nav a:hover{color:var(--text)}
  nav a.on{color:#1a1300;background:var(--accent)}
  .bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:stretch}
  input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);
        padding:10px 12px;border-radius:10px;font:inherit;transition:border-color .12s,box-shadow .12s}
  select{cursor:pointer;color:var(--dim)}
  select:hover{color:var(--text)}
  input::placeholder{color:var(--faint)}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(250,204,21,.12)}
  .bar .q{flex:1;min-width:220px}
  .srch{flex:1;min-width:240px;position:relative;display:flex}
  .srch input{flex:1;padding-left:38px;font-size:15px}
  .srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
  button{background:var(--accent);color:#1a1300;border:none;padding:9px 16px;
         border-radius:10px;font:inherit;font-weight:700;cursor:pointer;transition:filter .12s}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45;cursor:default}
  button.quiet{background:var(--panel);color:var(--dim);border:1px solid var(--line);font-weight:500}
  button.quiet:hover{color:var(--text);border-color:var(--line2)}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  tr:last-child td{border-bottom:none}
  th{color:var(--faint);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel2)}
  tr.row{cursor:pointer}
  tr.row:hover td{background:var(--panel2)}
  .url{word-break:break-all;font-family:var(--mono);font-size:12px}
  .dim{color:var(--dim);font-size:12px}
  .num{text-align:right;white-space:nowrap;font-family:var(--mono)}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
        padding:1px 9px;font-size:11px;color:var(--dim);margin:1px 2px 1px 0;
        max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
  .bar select{max-width:220px}
  .chip.ok{color:var(--ok);border-color:#1f4f3f;background:rgba(110,231,183,.06)}
  .chip.bad{color:var(--bad);border-color:#4f1f1f;background:rgba(248,113,113,.06)}
  .m{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.04em;padding:4px 6px;border-radius:5px;
     margin-right:7px;vertical-align:2px;color:var(--post);background:rgba(250,204,21,.12)}
  .m.get{color:var(--get);background:rgba(52,211,153,.12)}
  .m.put,.m.patch{color:var(--put);background:rgba(96,165,250,.12)}
  .m.delete{color:var(--del);background:rgba(248,113,113,.12)}
  img.ic{width:18px;height:18px;border-radius:5px;vertical-align:middle;margin-right:6px}
  .pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:22px 0;color:var(--dim);font-size:13px}
  #status{color:var(--dim);font-size:12px;min-height:1.5em;margin:0 0 6px}
  #status.err{color:var(--bad)}
  .empty{color:var(--dim);padding:60px 0;text-align:center;border:1px dashed var(--line2);border-radius:var(--r)}
  a{color:inherit}
  #drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);
          border-left:1px solid var(--line);padding:26px;overflow:auto;transform:translateX(100%);
          transition:transform .2s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 60px -20px rgba(0,0,0,.6);z-index:10}
  #drawer.open{transform:none}
  #drawer h2{font-size:19px;font-weight:700;margin-bottom:6px;padding-right:70px;word-break:break-word}
  #drawer h3{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.08em;margin:22px 0 8px}
  #drawer table{font-size:13px}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);
      overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
  .x{position:absolute;top:18px;right:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:border-color .15s}
  .card:hover{border-color:var(--line2)}
  .card .name{font-weight:700;margin-bottom:4px}
  .seg{display:inline-flex;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .seg a{display:flex;align-items:center;padding:0 12px;color:var(--dim);cursor:pointer;font-size:12px;font-weight:600;border-radius:7px;user-select:none}
  .seg a:hover{color:var(--text)}
  .seg a.on{background:var(--accent);color:#1a1300}
  .srv{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
  .srv .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .srv .name{font-weight:700;font-size:15px}
  .srv .tools{margin:10px 0 0;border-top:1px solid var(--line)}
  .srv .tool{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
  .srv .tool:last-child{border-bottom:none}
  .srv .tool:hover{color:var(--accent)}
  .srv code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:11px var(--mono);word-break:break-all}
  .ex{cursor:pointer}
  .ex:hover{color:var(--text);border-color:var(--accent)}
  .score{color:var(--accent);font:600 11px var(--mono)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .tile{aspect-ratio:1;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
        border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;overflow:hidden;
        min-width:0;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s}
  .tile:hover{transform:translateY(-2px);border-color:rgba(250,204,21,.45);
              box-shadow:0 12px 30px -12px rgba(0,0,0,.7),0 0 0 1px rgba(250,204,21,.08)}
  .tile .hd{display:flex;align-items:center;gap:7px;min-width:0}
  .tile .hd .ic{margin:0;flex:none}
  .tile .host{font:12px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .tile .price{font:700 13px var(--mono);color:var(--accent);flex:none;background:rgba(250,204,21,.1);
               border:1px solid rgba(250,204,21,.22);border-radius:999px;padding:2px 9px}
  .tile .nm{font-weight:700;font-size:15px;line-height:1.35;word-break:break-word;margin-top:4px;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile .nm .m{vertical-align:2px}
  .tile .ds{color:var(--dim);font-size:13px;line-height:1.5;
            display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .tile .ft{margin-top:auto;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--faint);min-width:0;
            padding-top:10px;border-top:1px solid var(--line)}
  .tile .ft .chip{max-width:90px}
  .tile .ft .calls{margin-left:auto;flex:none;font-family:var(--mono);color:var(--dim)}
  .tile .big{font:700 34px/1 var(--mono);color:var(--accent);letter-spacing:-.03em}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
  .pill{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 13px;
        color:var(--dim);font-size:12.5px;cursor:pointer;transition:all .12s;user-select:none}
  .pill:hover{color:var(--text);border-color:var(--line2);background:var(--panel)}
  .pill.ask{color:#1a1300;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;font-weight:700;margin-left:auto}
  .pill.ask:hover{filter:brightness(1.08)}
  .empty .pill.ask{margin-left:6px}
  #agent{display:none;background:var(--panel);border:1px solid rgba(250,204,21,.3);border-radius:var(--r);padding:18px;margin-bottom:18px;
         box-shadow:0 0 0 4px rgba(250,204,21,.04)}
  #agent.open{display:block}
  #agent .ah{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  #agent .ah b{letter-spacing:.06em;font-size:12px;color:var(--accent)}
  #agent .ah .sp{flex:1}
  #agent .turn{margin:12px 0;padding-top:12px;border-top:1px solid var(--line)}
  #agent .turn:first-child{border-top:none;margin-top:0;padding-top:0}
  #agent .you{color:var(--text);font-weight:700;margin-bottom:6px}
  #agent .steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
  #agent .ans{white-space:pre-wrap;font-size:14px;line-height:1.6}
  #agent .ans code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;font:12px var(--mono)}
  #agent .tiles{margin-top:12px}
  #agent form{display:flex;gap:8px;margin-top:12px}
  #agent form input{flex:1}
  h3.cat{color:var(--faint);margin:22px 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em}
  @media (max-width:640px){body{padding:18px 14px 50px}.stat{padding:12px 14px}.stat b{font-size:18px}
    .pill.ask{margin-left:0}.bar select{flex:1}
    .tile{aspect-ratio:auto;min-height:190px}}
</style>
</head>
<body>
<header>
  <div class="logo">402</div>
  <div><h1>x402</h1><div class="sub">Every pay-per-request API, in one local index</div></div>
</header>
<div class="stats" id="stats"></div>
<nav id="tabs">
  <a data-t="services" class="on">Services</a>
  <a data-t="mcp">MCP servers</a>
  <a data-t="hosts">Providers</a>
  <a data-t="sources">Facilitators</a>
  <a data-t="partners">Ecosystem</a>
</nav>
<div id="status"></div>
<section id="agent">
  <div class="ah"><b>FINDER AGENT</b><span class="dim">searches the index for you, with read-only tools · never pays</span>
    <span class="sp"></span><button class="quiet" id="anew">new chat</button><button class="quiet" id="aclose">close</button></div>
  <div class="log" id="alog"></div>
  <form id="af2"><input name="q" placeholder="what do you need? e.g. cheap token risk check on base" autocomplete="off"><button>ask</button></form>
</section>
<div id="view"></div>
<aside id="drawer"><button class="quiet x" id="close">close</button><div id="dbody"></div></aside>

<script>
const API = 'api/';   // relative: resolves under /x402/ locally and behind the gateway
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = p => p == null ? '<span class="dim">?</span>' : '$' + (p >= 1 ? p.toFixed(2) : +p.toPrecision(3));
const big = n => n == null ? '0' : n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : String(n);
const ago = t => { if (!t) return 'never'; const s = Date.now()/1000 - t;
  return s < 90 ? 'just now' : s < 5400 ? Math.round(s/60)+'m ago' : s < 129600 ? Math.round(s/3600)+'h ago' : Math.round(s/86400)+'d ago'; };

async function get(fn, args = {}) {
  const qs = new URLSearchParams(Object.entries(args).filter(([, v]) => v !== '' && v != null));
  const r = await fetch(API + fn + (qs.toString() ? '?' + qs : ''));
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function post(fn, body = {}) {
  const r = await fetch(API + fn, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function status(msg, err) { const s = $('#status'); s.textContent = msg || ''; s.className = err ? 'err' : ''; }

const st = {tab: 'services', q: '', network: '', max_price: '', sort: 'popular', offset: 0, host: '',
            meaning: localStorage.getItem('x402.meaning') !== '0', mq: ''};
const PAGE = 50;

async function loadStats() {
  try {
    const i = await get('info'), x = i.index;
    $('#stats').innerHTML = [
      [big(x.services), 'services'], [big(x.hosts), 'providers'],
      [x.listing_sources + '/' + x.sources, 'facilitators listing'],
      [big(x.calls_30d), 'paid calls 30d'], [usd(x.median_price_usd), 'median price'],
      [i.syncing ? '<i class="live"></i>syncing' : ago(i.last_sync), 'last crawl'],
    ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');
    const nets = Object.keys(x.networks).slice(0, 30);
    window.NETS = nets.map(n => [n, x.networks[n]]);
    if (!x.services) status('Index is empty. The server crawls on start; check back in a few minutes.');
  } catch (e) { status(e.message, true); }
}

function bar() {
  const nets = (window.NETS || []).map(([n, c]) =>
    `<option value="${esc(n)}" ${st.network === n ? 'selected' : ''}>${esc(n)} (${big(c)})</option>`).join('');
  return `<form class="bar" id="f">
    <span class="srch">${SEARCH_ICON}<input name="q" placeholder="Search paid APIs: weather, image, llm, twitter..." value="${esc(st.q)}" autofocus></span>
    <select name="network"><option value="">any network</option>${nets}</select>
    <select name="max_price">${['', '0.001', '0.01', '0.1', '1'].map(v =>
      `<option value="${v}" ${st.max_price === v ? 'selected' : ''}>${v ? 'up to $' + v : 'any price'}</option>`).join('')}</select>
    <select name="sort">${[['popular','most used'],['cheap','cheapest'],['new','newest'],['recent','recently updated'],['pricey','priciest']].map(([v, l]) =>
      `<option value="${v}" ${st.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <span class="seg" title="words: exact text match · meaning: what the service does"><a data-m="0" class="${st.meaning ? '' : 'on'}">words</a><a data-m="1" class="${st.meaning ? 'on' : ''}">meaning</a></span>
    ${st.host ? `<button type="button" class="quiet" id="clearhost">host: ${esc(st.host)} &times;</button>` : ''}
  </form>
  <div class="chips">${QUICK.map(q => `<span class="pill qk">${esc(q)}</span>`).join('')}
    <span class="pill ask" id="askbtn">Ask the agent &rarr;</span></div>`;
}
const SEARCH_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const mcls = m => String(m || '').toLowerCase().replace(/[^a-z]/g, '');
const QUICK = ['token price', 'web scraping', 'image generation', 'llm inference', 'wallet risk', 'weather'];

function tile(s, extra = '') {
  const nets = s.networks || [];
  return `<div class="tile" data-url="${esc(s.url)}" title="${esc(s.url)}">
    <div class="hd">${s.icon ? `<img class="ic" src="${esc(s.icon)}" loading="lazy" onerror="this.remove()">` : ''}
      <span class="host">${esc(s.host || '')}</span><span class="price">${usd(s.price_usd)}</span></div>
    <div class="nm"><span class="m ${mcls(s.method)}">${esc(s.method)}</span>${esc(s.name || pathOf(s.url))}</div>
    <div class="ds">${esc(s.description)}</div>
    ${extra}
    <div class="ft">${nets.slice(0, 2).map(n => `<span class="chip" title="${esc(n)}">${esc(n)}</span>`).join('')}${nets.length > 2 ? `+${nets.length - 2}` : ''}
      <span class="calls">${s.calls_30d ? big(s.calls_30d) + ' calls' : ''}</span></div></div>`;
}
const pathOf = u => { try { return new URL(u).pathname; } catch { return u; } };
function wireTiles(root) {
  root.querySelectorAll('.tile[data-url]').forEach(el => el.onclick = () => detail(el.dataset.url));
}

async function services() {
  const sem = st.meaning && st.q && !st.host;
  const r = sem
    ? await get('find', {q: st.q, network: st.network, max_price: st.max_price, k: 100})
        .then(f => { semNote(f); return {items: f.items.map(x => ({...x, sources: []})), total: f.items.length, offset: 0, limit: 100, sem: true}; })
    : await get('services', {q: st.q, network: st.network, max_price: st.max_price,
                             sort: st.sort, host: st.host, limit: PAGE, offset: st.offset});
  const tiles = r.items.map(s => tile(s, r.sem && s.why && s.why.length
      ? `<div>${s.why.slice(0, 2).map(w => `<span class="chip ok">${esc(w)}</span>`).join('')}</div>` : '')).join('');
  $('#view').innerHTML = bar() + (r.items.length ? `<div class="tiles">${tiles}</div>
      ${r.sem ? '' : pager(r)}` : `<div class="empty">nothing matches${st.q ? ` &middot; <a class="pill ask" id="askempty">ask the agent to look for "${esc(st.q)}"</a>` : ''}</div>`);
  wireBar();
  wireTiles($('#view'));
  document.querySelectorAll('.qk').forEach(c => c.onclick = () => { Object.assign(st, {q: c.textContent, offset: 0, meaning: true}); render(); });
  $('#askbtn').onclick = () => openAgent(st.q);
  const ae = $('#askempty'); if (ae) ae.onclick = () => openAgent(st.q, true);
}

function pager(r) {
  const end = Math.min(r.offset + r.items.length, r.total);
  return `<div class="pager">
    <button class="quiet" id="prev" ${r.offset ? '' : 'disabled'}>prev</button>
    <span>${r.offset + 1}-${end} of ${r.total.toLocaleString()}</span>
    <button class="quiet" id="next" ${end < r.total ? '' : 'disabled'}>next</button></div>`;
}

function wireBar() {
  const f = $('#f');
  let t;
  const apply = () => { const d = new FormData(f);
    Object.assign(st, {q: d.get('q'), network: d.get('network'), max_price: d.get('max_price'), sort: d.get('sort'), offset: 0}); render(); };
  f.onsubmit = e => { e.preventDefault(); apply(); };
  f.q.oninput = () => { clearTimeout(t); t = setTimeout(apply, 300); };
  f.querySelectorAll('select').forEach(s => s.onchange = apply);
  f.querySelectorAll('.seg a').forEach(a => a.onclick = () => {
    st.meaning = a.dataset.m === '1'; localStorage.setItem('x402.meaning', st.meaning ? '1' : '0'); apply(); });
  const ch = $('#clearhost'); if (ch) ch.onclick = () => { st.host = ''; st.offset = 0; render(); };
  const p = $('#prev'), n = $('#next');
  if (p) p.onclick = () => { st.offset = Math.max(0, st.offset - PAGE); render(); };
  if (n) n.onclick = () => { st.offset += PAGE; render(); };
  const q = f.q; q.focus(); q.setSelectionRange(q.value.length, q.value.length);
}

async function detail(url) {
  $('#drawer').classList.add('open');
  $('#dbody').innerHTML = '<div class="dim">loading</div>';
  try {
    const s = await get('service', {url});
    const ex = (((s.raw.extensions || {}).bazaar || {}).info) || {};
    const offers = s.offers.map(o => `<tr><td>${esc(o.network)}</td><td>${esc(o.scheme)}</td>
      <td>${esc(o.asset_name || o.asset.slice(0, 10))}</td><td class="num">${o.price_usd != null ? usd(o.price_usd) : esc(o.amount)}</td>
      <td class="dim url">${esc(o.pay_to)}</td></tr>`).join('');
    $('#dbody').innerHTML = `
      <h2>${esc(s.name || s.host)}</h2>
      <div class="url dim"><span class="m ${mcls(s.method)}">${esc(s.method)}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>
      <p style="margin-top:10px">${esc(s.description)}</p>
      <div style="margin-top:8px">${s.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
      <h3>PRICE OPTIONS</h3>
      <table><tr><th>network</th><th>scheme</th><th>asset</th><th class="num">price</th><th>pays to</th></tr>${offers}</table>
      <h3>ACTIVITY</h3>
      <div class="dim">${big(s.calls_30d)} paid calls · ${big(s.payers_30d)} payers in 30d · x402 v${s.x402_version} · first seen ${ago(s.first_seen)}${s.pinned ? ' · <span class="chip ok">probed</span>' : ''}</div>
      <h3>LISTED BY</h3><div>${s.sources.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>
      <h3>TRY IT</h3>
      <pre>curl -i ${s.method !== 'GET' ? '-X ' + esc(s.method) + ' ' : ''}'${esc(s.url)}'
# answers 402 with its price; pay with any x402 client and retry</pre>
      ${ex.input ? `<h3>INPUT EXAMPLE</h3><pre>${esc(JSON.stringify(ex.input, null, 2))}</pre>` : ''}
      ${ex.output ? `<h3>OUTPUT EXAMPLE</h3><pre>${esc(JSON.stringify(ex.output, null, 2).slice(0, 3000))}</pre>` : ''}
      <h3>PROVIDER</h3><button class="quiet" id="byhost">all ${esc(s.host)} services</button>
      <button class="quiet" id="reprobe">probe it live</button> <span id="pr" class="dim"></span>`;
    $('#byhost').onclick = () => { closeDrawer(); Object.assign(st, {tab: 'services', host: s.host, q: '', offset: 0}); tab('services'); };
    $('#reprobe').onclick = async () => {
      $('#pr').textContent = 'asking...';
      try { const p = await post('probe', {url: s.url, method: s.method, pin: false});
        $('#pr').textContent = p.x402 ? 'answers 402 with payment requirements: live' : `answered ${p.status}${p.error ? ' (' + p.error + ')' : ''}`; }
      catch (e) { $('#pr').textContent = e.message; }
    };
  } catch (e) { $('#dbody').innerHTML = `<div class="dim">${esc(e.message)}</div>`; }
}
function closeDrawer() { $('#drawer').classList.remove('open'); }
$('#close').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

async function hosts() {
  const r = await get('hosts', {q: st.q, limit: 200});
  $('#view').innerHTML = `<form class="bar" id="hf"><input class="q" name="q" placeholder="filter providers" value="${esc(st.q)}"></form>
    <div class="tiles">${r.items.map((h, i) => `<div class="tile" data-i="${i}">
      <div class="hd">${h.icon ? `<img class="ic" src="${esc(h.icon)}" loading="lazy" onerror="this.remove()">` : ''}<span class="host">${esc(h.host)}</span></div>
      <div class="nm">${esc(h.name || h.host)}</div>
      <div class="ds"><span class="big">${big(h.services)}</span><br>service${h.services === 1 ? '' : 's'}</div>
      <div class="ft"><span>${usd(h.min_price)}${h.max_price !== h.min_price ? ' - ' + usd(h.max_price) : ''}</span>
        <span class="calls">${h.calls_30d ? big(h.calls_30d) + ' calls' : ''}</span></div></div>`).join('')}</div>
    <div class="dim" style="margin-top:10px">${r.total.toLocaleString()} providers${r.total > 200 ? ' (top 200 shown; filter to narrow)' : ''}</div>`;
  let t; const f = $('#hf');
  f.onsubmit = e => e.preventDefault();
  f.q.oninput = () => { clearTimeout(t); t = setTimeout(() => { st.q = f.q.value; hosts().then(() => { $('#hf').q.focus(); }); }, 300); };
  document.querySelectorAll('.tile[data-i]').forEach(tr => tr.onclick = () => {
    Object.assign(st, {host: r.items[+tr.dataset.i].host, q: '', offset: 0}); tab('services'); });
}

// ── the finder agent: claude over this module's own read-only MCP tools ──
const ag = {session: localStorage.getItem('x402.agent.session') || '', busy: false};
function md(t) {
  return esc(t).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/^#{1,4} +(.*)$/gm, '<b>$1</b>');
}
function openAgent(q, go) {
  $('#agent').classList.add('open');
  const f = $('#af2'); if (q && !f.q.value) f.q.value = q;
  f.q.focus();
  if (go && f.q.value.trim()) askAgent(f.q.value);
  window.scrollTo({top: $('#agent').offsetTop - 10, behavior: 'smooth'});
}
async function askAgent(q) {
  if (ag.busy || !q.trim()) return;
  ag.busy = true;
  const f = $('#af2'); f.q.value = ''; f.querySelector('button').disabled = true;
  const turn = document.createElement('div'); turn.className = 'turn';
  turn.innerHTML = `<div class="you">&gt; ${esc(q)}</div><div class="steps"></div><div class="ans dim">thinking</div><div class="tiles"></div>`;
  $('#alog').appendChild(turn);
  const steps = turn.querySelector('.steps'), ans = turn.querySelector('.ans'), tl = turn.querySelector('.tiles');
  let said = '';
  try {
    const r = await fetch(API + 'ask', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, session: ag.session || undefined})});
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const {value, done} = await rd.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i; while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const e = JSON.parse(line.slice(6));
        if (e.type === 'tool') {
          const arg = e.input.q || e.input.query || e.input.url || e.input.network || '';
          steps.insertAdjacentHTML('beforeend', `<span class="chip" title="${esc(JSON.stringify(e.input))}">${esc(e.tool.replace('x402_', ''))}${arg ? ': ' + esc(String(arg).slice(0, 40)) : ''}</span>`);
          ans.textContent = 'searching';
        } else if (e.type === 'text') { said = e.text; ans.className = 'ans'; ans.innerHTML = md(said); }
        else if (e.type === 'done') {
          ans.className = 'ans'; ans.innerHTML = md(e.answer || said) +
            (e.grounded ? '' : '\n<span class="dim">(answered without searching the index)</span>');
          if (e.session) { ag.session = e.session; localStorage.setItem('x402.agent.session', e.session); }
          tl.innerHTML = e.picks.map(s => tile(s)).join(''); wireTiles(tl);
          if (!e.picks.length) tl.remove();
        } else if (e.type === 'error') {
          ans.className = 'ans'; ans.innerHTML = `<span style="color:var(--bad)">${esc(e.error)}</span>` +
            (e.login ? ` <a href="${esc(e.login)}" target="_blank">sign in</a>` : '');
        }
      }
    }
  } catch (err) { ans.innerHTML = `<span style="color:var(--bad)">${esc(err.message)}</span>`; }
  ag.busy = false; f.querySelector('button').disabled = false; f.q.focus();
}
$('#af2').onsubmit = e => { e.preventDefault(); askAgent(e.target.q.value); };
$('#aclose').onclick = () => $('#agent').classList.remove('open');
$('#anew').onclick = () => { ag.session = ''; localStorage.removeItem('x402.agent.session'); $('#alog').innerHTML = ''; $('#af2').q.focus(); };

async function sources() {
  const rows = await get('sources');
  const state = s => s.lists ? (s.status === 'error' ? `<span class="chip bad" title="${esc(s.error)}">error</span>`
      : s.status === 'crawling' ? `<span class="chip">crawling ${esc(s.progress || '')}</span>` : '<span class="chip ok">lists</span>')
      : s.lists === 0 ? '<span class="chip">no public list</span>' : '<span class="chip">unchecked</span>';
  $('#view').innerHTML = `<p class="hint">Facilitators settle x402 payments. Those that publish the spec's discovery list
    (<code>/discovery/resources</code>) are crawled every few hours; the rest are found and re-checked daily from the
    coinbase/x402 ecosystem registry. Add your own below, from this machine.</p>
    <form class="bar" id="af"><input class="q" name="base_url" placeholder="https://facilitator.example (base URL)">
      <button>add facilitator</button><button type="button" class="quiet" id="sync">crawl now</button></form>
    <form class="bar" id="pf"><input class="q" name="url" placeholder="https://api.example/paid-endpoint (probe one URL for its 402)">
      <button>probe + pin</button></form>
    <table><tr><th>facilitator</th><th>state</th><th class="num">indexed</th><th class="num">reported</th><th>last crawl</th><th>found via</th></tr>
    ${rows.map(s => `<tr><td>${esc(s.name)}<div class="dim url">${esc(s.base_url)}</div></td><td>${state(s)}</td>
      <td class="num">${s.indexed.toLocaleString()}</td><td class="num">${s.total != null ? s.total.toLocaleString() : '-'}</td>
      <td class="dim">${ago(s.last_ok)}</td><td class="dim">${esc(s.origin)}</td></tr>`).join('')}</table>`;
  $('#af').onsubmit = async e => { e.preventDefault();
    try { const r = await post('add_source', {base_url: e.target.base_url.value});
      status(r.lists ? `added; it lists ${r.total} services. Crawl now to index them.` : 'added, but it publishes no discovery list'); sources(); }
    catch (err) { status(err.message, true); } };
  $('#pf').onsubmit = async e => { e.preventDefault();
    try { const r = await post('probe', {url: e.target.url.value});
      status(r.x402 ? `x402 service indexed: ${r.service.url}` : `not x402: answered ${r.status}${r.error ? ' (' + r.error + ')' : ''}`, !r.x402); loadStats(); }
    catch (err) { status(err.message, true); } };
  $('#sync').onclick = async () => { try { await post('sync'); status('crawl started; this takes a few minutes'); setTimeout(sources, 2000); }
    catch (err) { status(err.message, true); } };
}

async function partners() {
  const rows = await get('partners');
  const cats = [...new Set(rows.map(p => p.category))];
  $('#view').innerHTML = `<p class="hint">${rows.length} projects in the coinbase/x402 ecosystem registry: who builds, pays, settles and sells over x402.</p>` +
    cats.map(c => `<h3 class="cat">${esc(c.toUpperCase())}</h3><div class="grid">` +
      rows.filter(p => p.category === c).map(p => `<div class="card">
        <div class="name">${p.logo ? `<img class="ic" src="${esc(p.logo)}" loading="lazy" onerror="this.remove()">` : ''}${esc(p.name)}</div>
        <div class="dim">${esc(p.description).slice(0, 180)}</div>
        ${p.website ? `<div class="dim" style="margin-top:6px"><a href="${esc(p.website)}" target="_blank" rel="noopener">${esc(p.website.replace(/^https?:\/\//, ''))}</a></div>` : ''}
      </div>`).join('') + '</div>').join('');
}

function semNote(f) {
  const i = f.index || {};
  const msg = f.mode === 'lexical' ? `matching words only: the local encoder is unavailable${i.error ? ' (' + i.error + ')' : ''}`
    : f.mode === 'partial' ? `still learning the index (${big(i.vectors)} of ${big(i.services)} services); results improve as it finishes`
    : `ranked by meaning in ${f.elapsed_ms} ms, on this machine`;
  status(msg, f.mode === 'lexical');
}

const EXAMPLES = ['is this token a rug', 'turn a web page into markdown', 'check a wallet before paying it',
                  'make a short video', 'stablecoin yields', 'current weather', 'search the news'];

async function mcp() {
  $('#view').innerHTML = `<p class="hint">Describe the job. Every paid MCP server in the index is ranked by what its tools do, not by the words they use.</p>
    <form class="bar" id="mf"><input class="q" name="q" placeholder="what should the server do?" value="${esc(st.mq)}" autofocus>
      <select name="max_price">${['', '0.001', '0.01', '0.1', '1'].map(v =>
        `<option value="${v}" ${st.max_price === v ? 'selected' : ''}>${v ? 'up to $' + v + ' a call' : 'any price'}</option>`).join('')}</select></form>
    <div id="mres"></div>`;
  const f = $('#mf'); let t;
  const go = () => { st.mq = f.q.value; st.max_price = f.max_price.value; mcpResults(); };
  f.onsubmit = e => { e.preventDefault(); go(); };
  f.q.oninput = () => { clearTimeout(t); t = setTimeout(go, 350); };
  f.max_price.onchange = go;
  f.q.focus(); f.q.setSelectionRange(f.q.value.length, f.q.value.length);
  mcpResults();
}

async function mcpResults() {
  const box = $('#mres');
  if (!st.mq.trim()) {
    const i = (await get('info')).semantic || {};
    box.innerHTML = `<div class="dim" style="margin:8px 0">${i.mcp_servers ? big(i.mcp_servers) + ' MCP servers indexed. ' : ''}Try:</div>` +
      EXAMPLES.map(e => `<span class="chip ex">${esc(e)}</span>`).join(' ');
    box.querySelectorAll('.ex').forEach(c => c.onclick = () => { $('#mf').q.value = c.textContent; st.mq = c.textContent; mcpResults(); });
    status('');
    return;
  }
  box.innerHTML = '<div class="dim">searching</div>';
  const r = await get('mcp_servers', {q: st.mq, max_price: st.max_price, k: 25});
  semNote(r);
  if (!r.items.length) { box.innerHTML = '<div class="empty">no MCP server does that yet</div>'; return; }
  box.innerHTML = r.items.map((g, gi) => `<div class="srv">
    <div class="top">${g.icon ? `<img class="ic" src="${esc(g.icon)}" loading="lazy" onerror="this.remove()">` : ''}
      <span class="name">${esc(g.name)}</span><span class="score">${g.score.toFixed(2)}</span>
      <span class="dim">${usd(g.min_price)}${g.max_price !== g.min_price ? ' - ' + usd(g.max_price) : ''} a call</span>
      ${g.networks.slice(0, 4).map(n => `<span class="chip">${esc(n)}</span>`).join('')}
      ${g.why.map(w => `<span class="chip ok">${esc(w)}</span>`).join('')}</div>
    <div class="url dim" style="margin-top:4px">${esc(g.server)}</div>
    <div class="tools">${g.tools.slice(0, 4).map((t, ti) => `<div class="tool" data-g="${gi}" data-t="${ti}">
      <span class="m ${mcls(t.method)}">${esc(t.method)}</span>${esc(t.description || t.url).slice(0, 160)} <span class="dim">${usd(t.price_usd)}</span></div>`).join('')}
      ${g.tools.length > 4 ? `<div class="dim" style="padding-top:6px">+${g.tools.length - 4} more matching tools</div>` : ''}</div>
    <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <code>${esc(g.connect.claude)}</code><button class="quiet cp" data-g="${gi}">copy</button></div>
  </div>`).join('');
  box.querySelectorAll('.tool').forEach(el => el.onclick = () => detail(r.items[+el.dataset.g].tools[+el.dataset.t].url));
  box.querySelectorAll('.cp').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(r.items[+b.dataset.g].connect.claude); b.textContent = 'copied'; }
    catch { b.textContent = 'select it'; }
    setTimeout(() => b.textContent = 'copy', 1500); });
}

const VIEWS = {services, mcp, hosts, sources, partners};
function tab(t) {
  st.tab = t;
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === t));
  render();
}
async function render() {
  status('');
  try { await VIEWS[st.tab](); } catch (e) { status(e.message, true); }
}
document.querySelectorAll('#tabs a').forEach(a => a.onclick = () => { st.q = ''; tab(a.dataset.t); });

loadStats().then(render);
setInterval(loadStats, 30000);
</script>
