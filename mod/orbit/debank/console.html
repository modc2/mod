<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>debank — your wallet, as a bank</title>
<style>
  :root {
    --bg: #090c12; --panel: #10151f; --panel2: #151c29; --panel3: #1a2231;
    --line: #1e2735; --line2: #28344a; --ink: #eef2f8; --dim: #8b96a8; --mute: #5d687a;
    --gold: #e3c27a; --gold2: #b8964a; --mint: #4fd1a1; --coral: #f06a5e; --amber: #e8b04a;
    --blue: #6aa5ff; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .num, .n, td.n, .stat b, .hero-total { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ── shell ── */
  #app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 22px 16px 16px; position: sticky;
    top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #1b1608; font-weight: 800; font-size: 15px; display: grid; place-items: center;
  }
  .brand b { font-size: 15px; letter-spacing: .16em; text-transform: uppercase; display: block; }
  .brand span { font-size: 11px; color: var(--dim); display: block; margin-top: -2px; }
  nav { display: flex; flex-direction: column; gap: 2px; }
  nav .sect { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute);
              padding: 12px 10px 4px; }
  nav button {
    background: none; border: 0; color: var(--dim); text-align: left; padding: 8px 10px;
    border-radius: 8px; font: inherit; font-size: 13.5px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  nav button:hover { background: var(--panel2); color: var(--ink); }
  nav button.on { background: var(--panel3); color: var(--ink); font-weight: 600; }
  nav button .k { font-size: 10px; color: var(--mute); font-weight: 400; }
  nav button.on .k { color: var(--gold); }
  .rail-foot { margin-top: auto; }
  .wallet-card {
    border: 1px solid var(--line2); border-radius: 12px; padding: 12px; background: var(--panel2);
  }
  .wallet-card .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .wallet-card .who { font-weight: 600; margin: 3px 0 2px; font-size: 13px; }
  .wallet-card .net { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); display: inline-block; }
  .dot.off { background: var(--mute); }
  .keyline { font-size: 11px; color: var(--mute); padding: 10px 6px 0; }
  .keyline b { color: var(--dim); font-weight: 500; }

  main { min-width: 0; padding: 22px 28px 80px; }
  .top { display: flex; gap: 10px; align-items: center; margin-bottom: 22px; }
  .search { flex: 1; display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 0 12px; height: 40px; }
  .search input { flex: 1; background: none; border: 0; color: var(--ink); font: inherit; outline: 0; min-width: 0; }
  .search input::placeholder { color: var(--mute); }
  .search .hint { color: var(--mute); font-size: 11px; white-space: nowrap; margin-left: 8px; }
  .search input:not(:placeholder-shown) + .hint { display: none; }

  /* ── controls ── */
  .btn {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line2); border-radius: 10px;
    padding: 0 14px; height: 40px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { border-color: var(--gold); }
  .btn.gold { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #1b1608; border-color: transparent; }
  .btn.gold:hover { filter: brightness(1.06); }
  .btn.ghost { background: none; }
  .btn.sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; }
  .btn.danger { color: var(--coral); }
  .btn.danger:hover { border-color: var(--coral); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.w { width: 100%; justify-content: center; }
  select, input.f, textarea.f {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line2); border-radius: 10px;
    padding: 0 12px; height: 40px; font: inherit; outline: 0; width: 100%;
  }
  input.f:focus, select:focus, textarea.f:focus { border-color: var(--gold); }
  select.sm { height: 32px; width: auto; font-size: 12.5px; border-radius: 8px; }
  label.f { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 0 0 6px 2px; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  /* ── cards ── */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .card h3 { margin: 0 0 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600;
             display: flex; justify-content: space-between; align-items: center; }
  .card h3 .r { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 12px; color: var(--mute); }
  .hero {
    position: relative; overflow: hidden; border-radius: 20px; padding: 26px 28px; margin-bottom: 18px;
    background: radial-gradient(1200px 300px at 0% 0%, #23304a 0%, #141b2a 45%, #10151f 100%);
    border: 1px solid var(--line2);
  }
  .hero:after {
    content: ''; position: absolute; right: -80px; top: -120px; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(227,194,122,.16), rgba(227,194,122,0) 70%);
  }
  .hero .lbl { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .hero-total { font-size: 44px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 4px; }
  .hero-total small { font-size: 22px; color: var(--dim); font-weight: 500; }
  .hero .sub { color: var(--dim); font-size: 12.5px; }
  .hero .side { position: absolute; right: 26px; top: 24px; text-align: right; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: 999px;
          padding: 3px 10px; font-size: 11.5px; color: var(--dim); background: rgba(0,0,0,.2); }
  .chip.gold { color: var(--gold); border-color: rgba(227,194,122,.4); }
  .chip.mint { color: var(--mint); border-color: rgba(79,209,161,.4); }
  .up { color: var(--mint); } .down { color: var(--coral); } .warn { color: var(--amber); } .bad { color: var(--coral); }
  .mut { color: var(--dim); } .faint { color: var(--mute); }
  .actions { display: flex; gap: 10px; margin: 0 0 18px; flex-wrap: wrap; }
  .action { flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 12px 14px; cursor: pointer; text-align: left; color: var(--ink); font: inherit; }
  .action:hover { border-color: var(--gold); }
  .action b { display: block; font-size: 13.5px; }
  .action span { font-size: 11.5px; color: var(--dim); }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { flex: 1; min-width: 140px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 20px; font-weight: 700; }
  .stat span { color: var(--dim); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }

  /* ── lists / tables ── */
  .acct { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .acct:last-child { border-bottom: 0; }
  .acct .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--panel3); display: grid; place-items: center;
              font-weight: 700; font-size: 12px; color: var(--gold); flex: none; }
  .acct .t { flex: 1; min-width: 0; }
  .acct .t b { display: block; font-size: 13.5px; }
  .acct .t span { font-size: 12px; color: var(--dim); }
  .acct .v { text-align: right; }
  .acct .v b { display: block; font-size: 14px; }
  .acct .v span { font-size: 11.5px; color: var(--dim); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--mute); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
       padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13.5px; }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; }
  td b { font-weight: 600; }
  .pill { display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: var(--panel3); color: var(--dim);
          letter-spacing: .04em; text-transform: uppercase; }
  .pill.ok { color: var(--mint); } .pill.bad { color: var(--coral); } .pill.warn { color: var(--amber); }

  /* ── notices ── */
  .note { border: 1px solid var(--line2); border-left: 3px solid var(--gold); background: var(--panel); border-radius: 10px;
          padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: var(--dim); }
  .note.err { border-left-color: var(--coral); color: var(--ink); }
  .note.ok { border-left-color: var(--mint); }
  .note b { color: var(--ink); }
  .empty { text-align: center; padding: 60px 20px; }
  .empty h2 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.01em; }
  .empty p { color: var(--dim); margin: 0 auto 22px; max-width: 460px; }
  .addr-big { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; word-break: break-all;
              background: var(--panel2); border: 1px dashed var(--line2); border-radius: 12px; padding: 18px; line-height: 1.6; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv span { color: var(--mute); }
  pre { background: var(--panel2); border: 1px solid var(--line); padding: 12px; border-radius: 10px; overflow: auto;
        font-size: 12px; max-height: 50vh; }
  code { color: var(--gold); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--panel3);
           border: 1px solid var(--line2); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-size: 13px;
           opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 80vw; z-index: 50; }
  #toast.show { opacity: 1; }
  #toast.bad { border-color: var(--coral); }
  .spin { color: var(--mute); font-size: 13px; padding: 30px 0; text-align: center; }
  .tool { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .tool b { color: var(--gold); font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .tool .d { color: var(--dim); font-size: 12.5px; }
  .h2 { font-size: 20px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .lead { color: var(--dim); margin: 0 0 18px; font-size: 13.5px; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 12px; }
    .brand { padding: 0 6px; width: 100%; }
    nav { flex-direction: row; flex-wrap: wrap; }
    nav .sect { display: none; }
    .rail-foot { width: 100%; margin-top: 4px; }
    main { padding: 16px 14px 60px; }
    .hero .side { position: static; text-align: left; margin-top: 12px; }
    .hero-total { font-size: 34px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <div class="mark">D</div>
      <div><b>debank</b><span>your wallet, as a bank</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <div class="wallet-card" id="walletCard"></div>
      <div class="keyline" id="keyline"></div>
    </div>
  </aside>
  <main>
    <div class="top">
      <div class="search">
        <input id="addr" placeholder="Look up any address — 0x…" spellcheck="false" autocomplete="off">
        <span class="hint">Enter</span>
      </div>
      <button class="btn ghost" id="mine" style="display:none">My account</button>
      <button class="btn gold" id="connectTop">Connect wallet</button>
    </div>
    <div id="out"></div>
  </main>
</div>
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   debank — the bank console.

   Two identities:  ME   = the wallet connected in the browser (can send, revoke)
                    VIEW = the address on screen (ME by default, or any address typed in)
   Two data floors: DeBank (full picture, needs the caller's own AccessKey)
                    the bank rail (native + stables on 8 chains, keyless, public RPCs)
   The private key never leaves the wallet. This page only builds transactions
   and asks the wallet to sign them.
   ═══════════════════════════════════════════════════════════════ */
const BASE = location.pathname.replace(/\/+$/, '') || '';
const API = (BASE.endsWith('/debank') ? BASE : '/debank') + '/_api';
const $ = (id) => document.getElementById(id);
const out = $('out');
const LS = { key: 'debank.key', view: 'debank.view', connected: 'debank.connected', tab: 'debank.tab' };
const read = (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const write = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };

const state = {
  tab: read(LS.tab) || 'overview',
  view: read(LS.view) || '',          // address on screen
  me: null, chainId: null,             // connected wallet
  key: read(LS.key) || '',             // DeBank AccessKey, browser-side only
  keyOk: null,                         // null unknown, true/false after /account
  networks: [], chains: [],
  cache: {},                           // per-view fetch cache, cleared on refresh
  sendPrefill: {},
};

const NAV = [
  ['sect', 'Bank'],
  ['overview', 'Overview'], ['accounts', 'Accounts'], ['assets', 'Assets'],
  ['savings', 'Savings'],
  ['positions', 'Positions', 'key'], ['statement', 'Statement', 'key'],
  ['permissions', 'Permissions', 'key'], ['vault', 'Vault', 'key'],
  ['sect', 'Move money'],
  ['send', 'Send'], ['receive', 'Receive'],
  ['sect', 'More'],
  ['settings', 'Settings'], ['api', 'API & MCP'],
];

/* ── formatting ── */
const usd = (n, d = 2) => n == null || isNaN(n) ? '—' :
  '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const usdBig = (n) => {
  if (n == null || isNaN(n)) return '—';
  const [i, f] = Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).split('.');
  return `$${i}<small>.${f}</small>`;
};
const num = (n, max = 6) => n == null || isNaN(n) ? '—' :
  Number(n).toLocaleString('en-US', { maximumFractionDigits: Math.abs(n) >= 1000 ? 2 : max });
const when = (t) => t ? new Date(t * 1000).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const esc = (s) => String(s == null ? '' : s).replace(/[<&>"]/g, (c) => ({ '<': '&lt;', '&': '&amp;', '>': '&gt;', '"': '&quot;' }[c]));
const short = (a) => a && a.length > 14 ? a.slice(0, 6) + '…' + a.slice(-4) : (a || '—');
const isAddr = (a) => /^0x[0-9a-fA-F]{40}$/.test(a || '');
const same = (a, b) => a && b && a.toLowerCase() === b.toLowerCase();
const clock = () => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const netOf = (chain) => state.networks.find((n) => n.chain === chain);
const netOfId = (id) => state.networks.find((n) => n.chain_id === Number(id));
const chainName = (c) => (netOf(c) || state.chains.find((x) => x.chain === c) || {}).name || c;

let toastTimer;
function toast(msg, bad = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ''), bad ? 5000 : 2600);
}

/* ── api ── */
async function get(path, params = {}, { cache = true } = {}) {
  const q = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null));
  const ck = `${path}?${q}`;
  if (cache && state.cache[ck]) return state.cache[ck];
  const headers = {};
  if (state.key) headers['x-debank-key'] = state.key;
  const r = await fetch(`${API}${path}?${q}`, { headers });
  const body = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw Object.assign(new Error(body.error || `HTTP ${r.status}`), body);
  if (cache) state.cache[ck] = body;
  return body;
}
async function post(path, body) {
  const r = await fetch(`${API}${path}`, { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw Object.assign(new Error(j.error || `HTTP ${r.status}`), j);
  return j;
}
const hasKey = () => !!state.key || state.keyOk === true;
const keyErr = (e) => e && (e.status === 401 || /AccessKey|no key/i.test(e.message || ''));

/* ── wallet (EIP-1193) ── */
const eth = () => window.ethereum;
async function connect(silent = false) {
  if (!eth()) {
    if (!silent) toast('No wallet found — install MetaMask, Rabby or Coinbase Wallet', true);
    return false;
  }
  try {
    const accounts = await eth().request({ method: silent ? 'eth_accounts' : 'eth_requestAccounts' });
    if (!accounts || !accounts[0]) { if (!silent) toast('The wallet gave no account', true); return false; }
    state.me = accounts[0];
    state.chainId = parseInt(await eth().request({ method: 'eth_chainId' }), 16);
    write(LS.connected, '1');
    if (!state.view || !silent) setView(state.me, false);
    if (!silent) toast(`Connected ${short(state.me)}`);
    renderChrome(); render();
    return true;
  } catch (e) {
    if (!silent) toast(e.message || 'The wallet refused', true);
    return false;
  }
}
function disconnect() {
  state.me = null; state.chainId = null; write(LS.connected, '');
  renderChrome(); render(); toast('Disconnected');
}
if (eth()) {
  eth().on?.('accountsChanged', (a) => {
    const was = state.me; state.me = a[0] || null;
    if (!state.me) write(LS.connected, '');
    if (state.me && (!state.view || same(state.view, was))) setView(state.me, false);
    renderChrome(); render();
  });
  eth().on?.('chainChanged', (c) => { state.chainId = parseInt(c, 16); renderChrome(); if (state.tab === 'send') render(); });
}
async function switchChain(chain) {
  const n = netOf(chain);
  if (!n) throw new Error(`${chain} is not on the bank rail`);
  if (state.chainId === n.chain_id) return n;
  try {
    await eth().request({ method: 'wallet_switchEthereumChain', params: [{ chainId: n.chain_id_hex }] });
  } catch (e) {
    if (e.code !== 4902 && !/unrecognized|not added|4902/i.test(e.message || '')) throw e;
    await eth().request({ method: 'wallet_addEthereumChain', params: [{
      chainId: n.chain_id_hex, chainName: n.name, rpcUrls: [n.rpc], blockExplorerUrls: [n.explorer],
      nativeCurrency: { name: n.native, symbol: n.native, decimals: 18 } }] });
  }
  state.chainId = parseInt(await eth().request({ method: 'eth_chainId' }), 16);
  return n;
}
// ABI encoding for the two calls a bank needs: transfer and approve(…, 0).
const pad = (h) => String(h).replace(/^0x/, '').toLowerCase().padStart(64, '0');
function toUnits(amount, decimals) {
  const s = String(amount).trim();
  if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') throw new Error('Amount must be a number');
  const [i = '0', f = ''] = s.split('.');
  if (f.length > decimals) throw new Error(`At most ${decimals} decimal places for this asset`);
  return BigInt(i || '0') * (10n ** BigInt(decimals)) + BigInt((f + '0'.repeat(decimals)).slice(0, decimals) || '0');
}
const fromUnits = (units, decimals) => Number(units) / 10 ** decimals;
async function sendTx(tx) {
  const hash = await eth().request({ method: 'eth_sendTransaction', params: [tx] });
  return hash;
}
async function waitReceipt(hash, tries = 60) {
  for (let i = 0; i < tries; i++) {
    const r = await eth().request({ method: 'eth_getTransactionReceipt', params: [hash] }).catch(() => null);
    if (r) return r;
    await new Promise((res) => setTimeout(res, 3000));
  }
  return null;
}

/* ── view / navigation ── */
function setView(addr, announce = true) {
  state.view = addr ? addr.toLowerCase() : '';
  write(LS.view, state.view);
  $('addr').value = state.view;
  state.cache = {};
  if (announce) render();
  renderChrome();
}
function go(tab) { state.tab = tab; write(LS.tab, tab); render(); renderChrome(); }
$('nav').innerHTML = NAV.map(([k, label, needs]) => k === 'sect'
  ? `<div class="sect">${label}</div>`
  : `<button data-t="${k}">${label}${needs ? '<span class="k">key</span>' : ''}</button>`).join('');
$('nav').onclick = (e) => { const b = e.target.closest('button'); if (b?.dataset.t) go(b.dataset.t); };
$('addr').onkeydown = (e) => {
  if (e.key !== 'Enter') return;
  const v = $('addr').value.trim();
  if (!isAddr(v)) return toast('That is not an EVM address (0x + 40 hex). ENS names are not resolved here.', true);
  setView(v); if (!['overview', 'accounts', 'assets', 'savings', 'positions', 'statement', 'permissions', 'vault'].includes(state.tab)) go('overview');
};
$('mine').onclick = () => { setView(state.me); go('overview'); };
$('connectTop').onclick = () => (state.me ? disconnect() : connect());

function renderChrome() {
  for (const b of $('nav').querySelectorAll('button')) b.classList.toggle('on', b.dataset.t === state.tab);
  const n = state.me ? netOfId(state.chainId) : null;
  $('walletCard').innerHTML = state.me ? `
    <div class="lbl">Connected wallet</div>
    <div class="who mono">${short(state.me)}</div>
    <div class="net"><span class="dot"></span>${n ? esc(n.name) : `chain ${state.chainId ?? '?'}`}</div>`
    : `<div class="lbl">Wallet</div>
       <div class="net" style="margin:4px 0 10px"><span class="dot off"></span>Not connected</div>
       <button class="btn sm w" id="connectRail">Connect wallet</button>`;
  $('connectRail') && ($('connectRail').onclick = () => connect());
  $('connectTop').textContent = state.me ? `Disconnect ${short(state.me)}` : 'Connect wallet';
  $('connectTop').className = state.me ? 'btn ghost' : 'btn gold';
  $('mine').style.display = state.me && !same(state.me, state.view) ? '' : 'none';
  $('keyline').innerHTML = state.key
    ? `<b>DeBank key</b> · in this browser${state.keyOk === false ? ' · <span class="bad">rejected</span>' : state.keyOk ? ' · <span class="up">works</span>' : ''}`

}

/* ── pieces ── */

  `<div class="stat"><b class="${c}">${v}</b><span>${l}</span></div>`).join('')}</div>`;
function table(cols, rows, emptyMsg = 'Nothing here.') {
  if (!rows || !rows.length) return `<div class="faint" style="padding:14px 0">${emptyMsg}</div>`;
  return `<table><thead><tr>${cols.map((c) => `<th class="${c.n ? 'n' : ''}">${c.label}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${cols.map((c) =>
      `<td class="${c.n ? 'n' : ''} ${c.cls ? c.cls(r) : ''}">${c.get(r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

/* ── data: the two floors ── */
async function overviewData(id) {
  // Try DeBank (full picture); fall back to the rail. Both are returned so the
  // page can say which one it is showing.
  const rail = get('/balances', { id }).catch((e) => ({ error: e }));
  let full = null, fullErr = null;
  if (hasKey()) {
    try { full = await get('/portfolio', { id }); } catch (e) { fullErr = e; if (keyErr(e)) state.keyOk = false; }
  }
  return { rail: await rail, full, fullErr };
}

/* ── money actions ── */
function prefillSend(chain, asset, to, amount) {
  state.sendPrefill = { chain, asset, to: to ?? $('sTo')?.value, amount: amount ?? $('sAmt')?.value };
  go('send');
}
async function doSend(chain, asset) {
  const to = $('sTo').value.trim(), amount = $('sAmt').value.trim();
  const status = $('sendStatus');
  const say = (html, cls = '') => (status.innerHTML = `<div class="note ${cls}">${html}</div>`);
  if (!isAddr(to)) return say('<b>Enter a valid 0x address to send to.</b>', 'err');
  if (same(to, state.me)) return say('<b>That is your own address.</b>', 'err');
  const n = netOf(chain);
  const a = asset === n.native ? { symbol: n.native, native: true, decimals: 18 } : n.tokens.find((t) => t.symbol === asset);
  let units;
  try { units = toUnits(amount, a.decimals); } catch (e) { return say(`<b>${esc(e.message)}</b>`, 'err'); }
  if (units <= 0n) return say('<b>Enter an amount above zero.</b>', 'err');
  $('sGo').disabled = true;
  try {
    say(`Switching the wallet to <b>${esc(n.name)}</b>…`);
    await switchChain(chain);
    say(`Confirm in your wallet: <b>${esc(amount)} ${esc(asset)}</b> to <span class="mono">${short(to)}</span> on ${esc(n.name)}.`);
    const tx = a.native
      ? { from: state.me, to, value: '0x' + units.toString(16) }
      : { from: state.me, to: a.address, data: '0xa9059cbb' + pad(to) + pad(units.toString(16)) };
    const hash = await sendTx(tx);
    const link = `<a href="${esc(n.explorer)}/tx/${hash}" target="_blank" rel="noopener" class="mono">${short(hash)}</a>`;
    say(`Sent. Waiting for confirmation… ${link}`, 'ok');
    toast('Transaction submitted');
    const r = await waitReceipt(hash);
    if (!r) say(`Submitted, not yet mined: ${link}. Check the explorer.`, '');
    else if (r.status === '0x1') { say(`<b>Confirmed</b> in block ${parseInt(r.blockNumber, 16)} · ${link}`, 'ok'); state.cache = {}; }
    else say(`<b>Reverted</b> on chain · ${link}`, 'err');
  } catch (e) {
    say(`<b>${esc(e.message || 'The wallet refused')}</b>`, 'err');
  } finally { $('sGo').disabled = false; }
}
async function revoke(chain, token, spender, symbol) {
  if (!state.me) return toast('Connect the owning wallet first', true);
  if (!isAddr(token)) return toast(`${symbol} is not an ERC-20 contract — revoke it in the wallet itself`, true);
  if (!confirm(`Revoke ${symbol} allowance for ${short(spender)} on ${chainName(chain)}?\n\nThis sends approve(spender, 0) from your wallet and costs gas.`)) return;
  try {
    const n = await switchChain(chain);
    const hash = await sendTx({ from: state.me, to: token, data: '0x095ea7b3' + pad(spender) + pad('0') });
    toast(`Revoke submitted: ${short(hash)}`);
    const r = await waitReceipt(hash);
    if (r?.status === '0x1') { toast(`Revoked ${symbol} for ${short(spender)}`); state.cache = {}; render(); }
    else if (r) toast('The revoke reverted on chain', true);
    else toast(`Still pending: ${n.explorer}/tx/${hash}`);
  } catch (e) { toast(e.message || 'The wallet refused', true); }
}
/* ── savings actions ── */
function planFund(fund, amount) {
  const amt = parseFloat(amount);
  state.savPlan = { fund, amount: amt > 0 ? Math.round(amt * 100) / 100 : 1000, data: null };
  if (state.tab !== 'savings') go('savings'); else render();
}
async function placeLegs() {
  const d = state.savPlan?.data;
  if (!d || !state.me) return;
  const status = $('savStatus');
  const say = (html, cls = '') => (status.innerHTML = `<div class="note ${cls}">${html}</div>`);
  $('savGo').disabled = true;
  let done = 0;
  try {
    say(`Switching the wallet to <b>${esc(d.fund.chain_name)}</b>…`);
    await switchChain(d.chain);
    for (const leg of d.legs) {
      let last = null;
      for (const tx of leg.txs) {
        say(`<b>${esc(leg.name)}</b> — ${esc(tx.step)}. Confirm in your wallet…`);
        const hash = await sendTx({ from: state.me, to: tx.to, data: tx.data });
        say(`<b>${esc(leg.name)}</b> — ${esc(tx.step)}: waiting for <span class="mono">${short(hash)}</span>…`);
        const r = await waitReceipt(hash);
        if (!r || r.status !== '0x1') throw new Error(`${tx.step} ${r ? 'reverted on chain' : 'never confirmed'} (${short(hash)})`);
        last = hash;
      }
      done++;
      post('/savings/record', { id: state.me, fund: d.fund.id, venue: leg.venue,
        amount: leg.allocation_usd, tx: last, chain: d.chain }).catch(() => {});
      say(`<b>${esc(leg.name)}</b> placed — ${done} of ${d.legs.length} sleeves done.`, 'ok');
    }
    toast(`Placed ${usd(d.amount_usd)} into ${d.fund.name}`);
    state.savPlan = null; state.cache = {}; render();
  } catch (e) {
    say(`<b>${esc(e.message || 'The wallet refused')}</b>${done ? `<div class="mut" style="margin-top:4px">${done} sleeve(s) already placed — they are yours and show under “Where your savings sit”.</div>` : ''}`, 'err');
    $('savGo') && ($('savGo').disabled = false);
  }
}
async function withdrawVenue(venue, name) {
  if (!state.me) return toast('Connect the owning wallet first', true);
  if (!confirm(`Withdraw everything from ${name} back to your wallet?\n\nThis signs one transaction and costs gas.`)) return;
  try {
    const d = await get('/savings/exit', { id: state.me, venue }, { cache: false });
    await switchChain(d.chain);
    const hash = await sendTx({ from: state.me, to: d.tx.to, data: d.tx.data });
    toast(`Withdrawal submitted: ${short(hash)}`);
    const r = await waitReceipt(hash);
    if (r?.status === '0x1') { toast(`Withdrawn from ${name}`); state.cache = {}; render(); }
    else if (r) toast('The withdrawal reverted on chain', true);
    else toast('Still pending — check the explorer');
  } catch (e) { toast(e.message || 'The wallet refused', true); }
}

  try {
    const a = await get('/account', {}, { cache: false });
    state.keyOk = !!a.ok;
    toast(a.ok ? 'Key works' : `Key rejected: ${a.error || ''}`, !a.ok);
  } catch (e) { state.keyOk = false; toast(e.message, true); }
  render();
}
async function storeKeyOnServer() {
  const k = $('kIn').value.trim();
  if (!k) return toast('Paste a key first', true);
  if (!confirm('Store this key on the server at ~/.mod/debank/key.json so the shell and MCP tools use it too?')) return;
  try { const r = await post('/set_key', { key: k, persist: true }); toast(`Stored at ${r.stored}`); state.keyOk = true; renderChrome(); }
  catch (e) { toast(e.message, true); }
}
function refresh() { state.cache = {}; render(); toast('Refreshing'); }

/* ── render loop ── */
let seq = 0;
async function render() {
  const my = ++seq;
  renderChrome();
  const needs = ['overview', 'accounts', 'assets', 'savings', 'positions', 'statement', 'permissions', 'vault'];
  if (needs.includes(state.tab) && !state.view) { out.innerHTML = needAddr(); return; }
  out.innerHTML = `<div class="spin">Reading every chain…</div>`;
  try {
    const html = await VIEWS[state.tab](state.view);
    if (my === seq) out.innerHTML = html;
  } catch (e) {
    if (my !== seq) return;
    if (keyErr(e) && needs.includes(state.tab)) { state.keyOk = false; renderChrome(); }
    out.innerHTML = errCard(e);
  }
}

/* ── boot ── */
(async () => {
  try { state.networks = (await get('/networks')).networks; } catch {}
  get('/chains').then((d) => { state.chains = d.chains; }).catch(() => {});
  if (!state.key) get('/health').then((h) => { if (h.key) state.keyOk = true; renderChrome(); }).catch(() => {});
  if (state.view) $('addr').value = state.view;
  if (read(LS.connected) && eth()) await connect(true);
  render();
})();
</script>
</body>
