<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>debank — your wallet, as a bank</title>
<style>
  :root {
    --bg: #090c12; --panel: #10151f; --panel2: #151c29; --panel3: #1a2231;
    --line: #1e2735; --line2: #28344a; --ink: #eef2f8; --dim: #8b96a8; --mute: #5d687a;
    --gold: #e3c27a; --gold2: #b8964a; --mint: #4fd1a1; --coral: #f06a5e; --amber: #e8b04a;
    --blue: #6aa5ff; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .num, .n, td.n, .stat b, .hero-total { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ── shell ── */
  #app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 22px 16px 16px; position: sticky;
    top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: #1b1608; font-weight: 800; font-size: 15px; display: grid; place-items: center;
  }
  .brand b { font-size: 15px; letter-spacing: .16em; text-transform: uppercase; display: block; }
  .brand span { font-size: 11px; color: var(--dim); display: block; margin-top: -2px; }
  nav { display: flex; flex-direction: column; gap: 2px; }
  nav .sect { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute);
              padding: 12px 10px 4px; }
  nav button {
    background: none; border: 0; color: var(--dim); text-align: left; padding: 8px 10px;
    border-radius: 8px; font: inherit; font-size: 13.5px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
  }
  nav button:hover { background: var(--panel2); color: var(--ink); }
  nav button.on { background: var(--panel3); color: var(--ink); font-weight: 600; }
  nav button .k { font-size: 10px; color: var(--mute); font-weight: 400; }
  nav button.on .k { color: var(--gold); }
  .rail-foot { margin-top: auto; }
  .wallet-card {
    border: 1px solid var(--line2); border-radius: 12px; padding: 12px; background: var(--panel2);
  }
  .wallet-card .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .wallet-card .who { font-weight: 600; margin: 3px 0 2px; font-size: 13px; }
  .wallet-card .net { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); display: inline-block; }
  .dot.off { background: var(--mute); }
  .keyline { font-size: 11px; color: var(--mute); padding: 10px 6px 0; }
  .keyline b { color: var(--dim); font-weight: 500; }

  main { min-width: 0; padding: 22px 28px 80px; }
  .top { display: flex; gap: 10px; align-items: center; margin-bottom: 22px; }
  .search { flex: 1; display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 0 12px; height: 40px; }
  .search input { flex: 1; background: none; border: 0; color: var(--ink); font: inherit; outline: 0; min-width: 0; }
  .search input::placeholder { color: var(--mute); }
  .search .hint { color: var(--mute); font-size: 11px; white-space: nowrap; margin-left: 8px; }
  .search input:not(:placeholder-shown) + .hint { display: none; }

  /* ── controls ── */
  .btn {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line2); border-radius: 10px;
    padding: 0 14px; height: 40px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { border-color: var(--gold); }
  .btn.gold { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #1b1608; border-color: transparent; }
  .btn.gold:hover { filter: brightness(1.06); }
  .btn.ghost { background: none; }
  .btn.sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; }
  .btn.danger { color: var(--coral); }
  .btn.danger:hover { border-color: var(--coral); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.w { width: 100%; justify-content: center; }
  select, input.f, textarea.f {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line2); border-radius: 10px;
    padding: 0 12px; height: 40px; font: inherit; outline: 0; width: 100%;
  }
  input.f:focus, select:focus, textarea.f:focus { border-color: var(--gold); }
  select.sm { height: 32px; width: auto; font-size: 12.5px; border-radius: 8px; }
  label.f { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 0 0 6px 2px; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

  /* ── cards ── */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .card h3 { margin: 0 0 12px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600;
             display: flex; justify-content: space-between; align-items: center; }
  .card h3 .r { font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 12px; color: var(--mute); }
  .hero {
    position: relative; overflow: hidden; border-radius: 20px; padding: 26px 28px; margin-bottom: 18px;
    background: radial-gradient(1200px 300px at 0% 0%, #23304a 0%, #141b2a 45%, #10151f 100%);
    border: 1px solid var(--line2);
  }
  .hero:after {
    content: ''; position: absolute; right: -80px; top: -120px; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(227,194,122,.16), rgba(227,194,122,0) 70%);
  }
  .hero .lbl { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .hero-total { font-size: 44px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 4px; }
  .hero-total small { font-size: 22px; color: var(--dim); font-weight: 500; }
  .hero .sub { color: var(--dim); font-size: 12.5px; }
  .hero .side { position: absolute; right: 26px; top: 24px; text-align: right; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: 999px;
          padding: 3px 10px; font-size: 11.5px; color: var(--dim); background: rgba(0,0,0,.2); }
  .chip.gold { color: var(--gold); border-color: rgba(227,194,122,.4); }
  .chip.mint { color: var(--mint); border-color: rgba(79,209,161,.4); }
  .up { color: var(--mint); } .down { color: var(--coral); } .warn { color: var(--amber); } .bad { color: var(--coral); }
  .mut { color: var(--dim); } .faint { color: var(--mute); }
  .actions { display: flex; gap: 10px; margin: 0 0 18px; flex-wrap: wrap; }
  .action { flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 12px 14px; cursor: pointer; text-align: left; color: var(--ink); font: inherit; }
  .action:hover { border-color: var(--gold); }
  .action b { display: block; font-size: 13.5px; }
  .action span { font-size: 11.5px; color: var(--dim); }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { flex: 1; min-width: 140px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 20px; font-weight: 700; }
  .stat span { color: var(--dim); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }

  /* ── lists / tables ── */
  .acct { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .acct:last-child { border-bottom: 0; }
  .acct .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--panel3); display: grid; place-items: center;
              font-weight: 700; font-size: 12px; color: var(--gold); flex: none; }
  .acct .t { flex: 1; min-width: 0; }
  .acct .t b { display: block; font-size: 13.5px; }
  .acct .t span { font-size: 12px; color: var(--dim); }
  .acct .v { text-align: right; }
  .acct .v b { display: block; font-size: 14px; }
  .acct .v span { font-size: 11.5px; color: var(--dim); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--mute); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
       padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13.5px; }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; }
  td b { font-weight: 600; }
  .pill { display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: var(--panel3); color: var(--dim);
          letter-spacing: .04em; text-transform: uppercase; }
  .pill.ok { color: var(--mint); } .pill.bad { color: var(--coral); } .pill.warn { color: var(--amber); }

  /* ── notices ── */
  .note { border: 1px solid var(--line2); border-left: 3px solid var(--gold); background: var(--panel); border-radius: 10px;
          padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: var(--dim); }
  .note.err { border-left-color: var(--coral); color: var(--ink); }
  .note.ok { border-left-color: var(--mint); }
  .note b { color: var(--ink); }
  .empty { text-align: center; padding: 60px 20px; }
  .empty h2 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.01em; }
  .empty p { color: var(--dim); margin: 0 auto 22px; max-width: 460px; }
  .addr-big { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; word-break: break-all;
              background: var(--panel2); border: 1px dashed var(--line2); border-radius: 12px; padding: 18px; line-height: 1.6; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv span { color: var(--mute); }
  pre { background: var(--panel2); border: 1px solid var(--line); padding: 12px; border-radius: 10px; overflow: auto;
        font-size: 12px; max-height: 50vh; }
  code { color: var(--gold); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--panel3);
           border: 1px solid var(--line2); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-size: 13px;
           opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 80vw; z-index: 50; }
  #toast.show { opacity: 1; }
  #toast.bad { border-color: var(--coral); }
  .spin { color: var(--mute); font-size: 13px; padding: 30px 0; text-align: center; }
  .tool { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .tool b { color: var(--gold); font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .tool .d { color: var(--dim); font-size: 12.5px; }
  .h2 { font-size: 20px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .lead { color: var(--dim); margin: 0 0 18px; font-size: 13.5px; }

  /* ── address book ── */
  .book-hdr { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); padding: 12px 10px 4px; }
  .book-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; cursor: pointer; }
  .book-row:hover { background: var(--panel2); }
  .book-row .bic { width: 24px; height: 24px; border-radius: 7px; background: var(--panel3); display: grid; place-items: center;
                   font-weight: 700; font-size: 10px; color: var(--gold); flex: none; }
  .book-row .bt { flex: 1; min-width: 0; }
  .book-row .bt b { display: block; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-row .bt span { font-size: 11px; color: var(--dim); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .book-row .bdel { opacity: 0; font-size: 16px; color: var(--mute); background: none; border: 0; cursor: pointer; padding: 0 2px; line-height: 1; flex: none; }
  .book-row:hover .bdel, .book-row .bdel:focus { opacity: 1; }
  .book-row .bdel:hover { color: var(--coral); }
  @media (hover: none) { .book-row .bdel { opacity: 1; } }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 12px; }
    .brand { padding: 0 6px; width: 100%; }
    nav { flex-direction: row; flex-wrap: wrap; }
    nav .sect { display: none; }
    .rail-foot { width: 100%; margin-top: 4px; }
    main { padding: 16px 14px 60px; }
    .hero .side { position: static; text-align: left; margin-top: 12px; }
    .hero-total { font-size: 34px; }
  }
  .ask-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(9,12,18,.82); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
  }
  .ask-card {
    background: var(--panel); border: 1px solid var(--line2);
    border-radius: var(--radius); padding: 28px 28px 22px; max-width: 400px; width: 90%;
    box-shadow: 0 12px 48px rgba(0,0,0,.6);
  }
  .ask-card h3 { margin: 0 0 10px; font-size: 16px; color: var(--ink); }
  .ask-card p  { margin: 0 0 18px; font-size: 14px; color: var(--dim); line-height: 1.5; }
  .ask-card input.f { width: 100%; box-sizing: border-box; margin-bottom: 18px; }
  .ask-btns { display: flex; gap: 10px; justify-content: flex-end; }
  .ask-btns button { padding: 8px 18px; border-radius: 8px; font: inherit; cursor: pointer; font-size: 14px; }
  .ask-btns .ask-cancel { background: var(--panel2); color: var(--dim); border: 1px solid var(--line2); }
  .ask-btns .ask-cancel:hover { color: var(--ink); }
  .ask-btns .ask-confirm { background: transparent; color: var(--coral); border: 1px solid var(--coral); font-weight: 600; }
  .ask-btns .ask-confirm:hover { background: rgba(240,106,94,.12); }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">
      <div class="mark">D</div>
      <div><b>debank</b><span>your wallet, as a bank</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <div class="wallet-card" id="walletCard"></div>
      <div class="keyline" id="keyline"></div>
      <div id="bookBlock"></div>
    </div>
  </aside>
  <main>
    <div class="top">
      <div class="search">
        <input id="addr" placeholder="Look up any address — 0x…" spellcheck="false" autocomplete="off">
        <span class="hint">Enter</span>
      </div>
      <button class="btn ghost" id="mine" style="display:none">My account</button>
      <button class="btn gold" id="connectTop">Connect wallet</button>
    </div>
    <div id="out"></div>
  </main>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   debank — the bank console.

   Two identities:  ME   = the wallet connected in the browser (can send, revoke)
                    VIEW = the address on screen (ME by default, or any address typed in)
   Two data floors: DeBank (full picture, needs the caller's own AccessKey)
                    the bank rail (native + stables on 8 chains, keyless, public RPCs)
   The private key never leaves the wallet. This page only builds transactions
   and asks the wallet to sign them.
   ═══════════════════════════════════════════════════════════════ */
const BASE = location.pathname.replace(/\/+$/, '') || '';
const API = (BASE.endsWith('/debank') ? BASE : '/debank') + '/_api';
const $ = (id) => document.getElementById(id);
const out = $('out');
const LS = { key: 'debank.key', view: 'debank.view', connected: 'debank.connected', tab: 'debank.tab', book: 'debank.book' };
const read = (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const write = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
function snapshotSave(id, usd) {
  if (!id || usd == null || isNaN(usd)) return;
  const key = 'debank.snap.' + id;
  let arr; try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch { arr = []; }
  const now = Math.floor(Date.now() / 1000);
  const today = new Date().toDateString();
  arr = arr.filter(e => new Date(e.t * 1000).toDateString() !== today);
  arr.push({ t: now, usd });
  arr.sort((a, b) => a.t - b.t);
  try { localStorage.setItem(key, JSON.stringify(arr.slice(-90))); } catch {}
}
function snapshotRead(id) {
  try { return JSON.parse(localStorage.getItem('debank.snap.' + id) || '[]').sort((a, b) => a.t - b.t); }
  catch { return []; }
}

const state = {
  tab: read(LS.tab) || 'overview',
  view: read(LS.view) || '',          // address on screen
  me: null, chainId: null,             // connected wallet
  key: read(LS.key) || '',             // DeBank AccessKey, browser-side only
  keyOk: null,                         // null unknown, true/false after /account
  networks: [], chains: [],
  cache: {},                           // per-view fetch cache, cleared on refresh
  sendPrefill: {},
  chartOpen: false, chartPeriod: 'All',
  scanAllPermissions: false,
  stmtSearch: '',
  stmtBucket: null,
};

const NAV = [
  ['sect', 'Bank'],
  ['overview', 'Overview'], ['accounts', 'Accounts'], ['assets', 'Assets'],
  ['savings', 'Savings'],
  ['watchlist', 'Watchlist'],
  ['positions', 'Positions', 'key'], ['statement', 'Statement', 'key'],
  ['permissions', 'Permissions', 'key'], ['vault', 'Vault', 'key'],
  ['sect', 'Move money'],
  ['send', 'Send'], ['receive', 'Receive'],
  ['sect', 'More'],
  ['settings', 'Settings'], ['api', 'API & MCP'],
];

/* ── formatting ── */
const usd = (n, d = 2) => n == null || isNaN(n) ? '—' :
  '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const usdBig = (n) => {
  if (n == null || isNaN(n)) return '—';
  const [i, f] = Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).split('.');
  return `$${i}<small>.${f}</small>`;
};
const num = (n, max = 6) => n == null || isNaN(n) ? '—' :
  Number(n).toLocaleString('en-US', { maximumFractionDigits: Math.abs(n) >= 1000 ? 2 : max });
const when = (t) => t ? new Date(t * 1000).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const esc = (s) => String(s == null ? '' : s).replace(/[<&>"]/g, (c) => ({ '<': '&lt;', '&': '&amp;', '>': '&gt;', '"': '&quot;' }[c]));
const pct24h = (n) => n == null ? '' : '<span class="' + (n >= 0 ? 'up' : 'down') + '" style="font-size:12px">' + (n >= 0 ? '+' : '') + (n * 100).toFixed(2) + '%</span>';
const short = (a) => a && a.length > 14 ? a.slice(0, 6) + '…' + a.slice(-4) : (a || '—');
const isAddr = (a) => /^0x[0-9a-fA-F]{40}$/.test(a || '');
const same = (a, b) => a && b && a.toLowerCase() === b.toLowerCase();
const clock = () => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const netOf = (chain) => state.networks.find((n) => n.chain === chain);
const netOfId = (id) => state.networks.find((n) => n.chain_id === Number(id));
const chainName = (c) => (netOf(c) || state.chains.find((x) => x.chain === c) || {}).name || c;

let toastTimer;
function toast(msg, bad = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ''), bad ? 5000 : 2600);
}

/* ── api ── */
async function get(path, params = {}, { cache = true } = {}) {
  const q = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null));
  const ck = `${path}?${q}`;
  if (cache && state.cache[ck]) return state.cache[ck];
  const headers = {};
  if (state.key) headers['x-debank-key'] = state.key;
  const r = await fetch(`${API}${path}?${q}`, { headers });
  const body = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw Object.assign(new Error(body.error || `HTTP ${r.status}`), body);
  if (cache) state.cache[ck] = body;
  return body;
}
async function post(path, body) {
  const r = await fetch(`${API}${path}`, { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));

    + `<stop offset="0%" stop-color="rgba(227,194,122,0.18)"/>`
    + `<stop offset="100%" stop-color="rgba(227,194,122,0)"/>`
    + `</linearGradient></defs>`
    + gridLines
    + `<path d="${area}" fill="url(#bigG)"/>`
    + `<polyline points="${ptStr}" fill="none" stroke="#e3c27a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`
    + `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.5" fill="#e3c27a"/>`
    + yLabels + xLabels
    + `<line class="spk-cursor" x1="0" y1="${padT}" x2="0" y2="${H - padB}" stroke="#e3c27a" stroke-width="1" stroke-dasharray="3 2" visibility="hidden"/>`
    + `<circle class="spk-dot" cx="0" cy="0" r="4" fill="#e3c27a" stroke="#141b2a" stroke-width="1.5" visibility="hidden"/>`
    + `<rect x="0" y="0" width="${W}" height="${H - padB}" fill="transparent" onmousemove="spkMove(event,this)" onmouseleave="spkOut()"/>`

const weekChart = (txs) => {
  if (!txs || !txs.length) return '';
  const bucketMap = {};
  txs.forEach(r => {
    const w = Math.floor(r.time / 604800);
    if (!bucketMap[w]) bucketMap[w] = { w, count: 0, gasUsd: 0 };
    bucketMap[w].count++;
    bucketMap[w].gasUsd += r.gas_usd || 0;
  });
  let buckets = Object.values(bucketMap).sort((a, b) => a.w - b.w);
  if (buckets.length > 52) buckets = buckets.slice(buckets.length - 52);
  const n = buckets.length;
  if (n < 1) return '';
  const W = 700, H = 60, padB = 16;
  const chartH = H - padB;
  const gap = 2;
  const barW = Math.max(2, (W - gap * Math.max(n - 1, 0)) / n);
  const stride = barW + gap;
  const maxCount = Math.max(...buckets.map(b => b.count));
  const maxGas = Math.max(...buckets.map(b => b.gasUsd));
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let bars = '', xLabels = '';
  let prevQ = -1;
  buckets.forEach((b, i) => {
    const x = i * stride;
    const bw = barW.toFixed(1);
    const countH = maxCount ? (b.count / maxCount) * chartH * 0.9 : 0;
    const gasH = maxGas ? (b.gasUsd / maxGas) * chartH * 0.35 : 0;
    const isActive = state.stmtBucket === b.w;
    bars += '<rect x="' + x.toFixed(1) + '" y="' + (chartH - countH).toFixed(1) + '" width="' + bw + '" height="' + countH.toFixed(1) + '"'
      + ' fill="' + (isActive ? '#e3c27a' : 'rgba(93,104,122,0.55)') + '" rx="1" style="cursor:pointer"'
      + ' onclick="state.stmtBucket=' + (isActive ? 'null' : b.w) + ';render()"'
      + ' onmouseenter="wkTipShow(event,' + b.w + ',' + b.count + ',' + b.gasUsd.toFixed(4) + ')" onmouseleave="wkTipHide()"/>';
    if (gasH > 0.5) bars += '<rect x="' + x.toFixed(1) + '" y="' + (chartH - gasH).toFixed(1) + '" width="' + bw + '" height="' + gasH.toFixed(1) + '"'
      + ' fill="rgba(227,194,122,0.2)" rx="1" style="pointer-events:none"/>';
    const d = new Date(b.w * 604800 * 1000);
    const q = Math.floor(d.getMonth() / 3) + d.getFullYear() * 4;
    if (q !== prevQ && x + 40 < W) {
      xLabels += '<text x="' + x.toFixed(1) + '" y="' + (H - 3) + '" fill="#5d687a" font-size="9" font-family="Inter,system-ui,sans-serif">' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '</text>';
      prevQ = q;
    }
  });
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="display:block;overflow:visible;width:100%;height:auto">' + bars + xLabels + '</svg>';
};
const simChart = (amount, apy) => {
  const W = 700, H = 180, padT = 8, padB = 28;
  const pts = [0];
  for (let d = 7; d <= 365; d += 7) pts.push(d);
  if (pts[pts.length - 1] !== 365) pts.push(365);
  const vFund = (d) => amount * Math.pow(1 + apy / 100, d / 365);
  const lo = amount, hi = vFund(365);
  const range = hi - lo || 1;
  const iy = (v) => padT + ((hi - v) / range) * (H - padT - padB);
  const ix = (d) => (d / 365) * W;
  const fundPts = pts.map((d) => [ix(d), iy(vFund(d))]);
  const idlePts = [[0, iy(lo)], [W, iy(lo)]];
  const fundStr = fundPts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const idleStr = idlePts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  let gridLines = '', yLabels = '';
  for (let i = 0; i <= 4; i++) {
    const v = lo + range * i / 4;
    const y = iy(v);
    const label = v >= 1e6 ? '$' + (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? '$' + (v / 1e3).toFixed(0) + 'k' : '$' + Math.round(v);
    gridLines += `<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="#1e2735" stroke-width="1" stroke-dasharray="4 3"/>`;
    yLabels += `<rect x="3" y="${(y - 8).toFixed(1)}" width="${label.length * 6 + 4}" height="13" fill="rgba(9,12,18,0.72)" rx="2"/>`;
    yLabels += `<text x="5" y="${(y + 3).toFixed(1)}" fill="#5d687a" font-size="9" font-family="ui-monospace,Consolas,monospace">${esc(label)}</text>`;
  }
  let xLabels = '';
  [[0, 'now', 'start'], [90, '3mo', 'middle'], [180, '6mo', 'middle'], [270, '9mo', 'middle'], [365, '1yr', 'end']].forEach(([d, lbl, anchor]) => {
    xLabels += `<text x="${ix(d).toFixed(1)}" y="${H - 8}" fill="#5d687a" font-size="10" font-family="Inter,system-ui,sans-serif" text-anchor="${anchor}">${lbl}</text>`;
  });
  const areaPath = 'M' + fundPts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' L')
    + ` L${W},${H - padB} L0,${H - padB} Z`;
  const dataPts = JSON.stringify(pts.map(d => ({ days: d, u: vFund(d) }))).replace(/'/g, '&#39;');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible;width:100%;height:auto" data-pts='${dataPts}' data-pad-t="${padT}" data-pad-b="${padB}">`
    + `<defs><linearGradient id="simG" x1="0" y1="0" x2="0" y2="1">`
    + `<stop offset="0%" stop-color="rgba(227,194,122,0.15)"/>`
    + `<stop offset="100%" stop-color="rgba(227,194,122,0)"/>`
    + `</linearGradient></defs>`
    + gridLines
    + `<path d="${areaPath}" fill="url(#simG)"/>`
    + `<polyline points="${idleStr}" fill="none" stroke="#3a4557" stroke-width="1.5" stroke-dasharray="5 3"/>`
    + `<polyline points="${fundStr}" fill="none" stroke="#e3c27a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`
    + yLabels + xLabels
    + `<line class="spk-cursor" x1="0" y1="${padT}" x2="0" y2="${H - padB}" stroke="#e3c27a" stroke-width="1" stroke-dasharray="3 2" visibility="hidden"/>`
    + `<circle class="spk-dot" cx="0" cy="0" r="4" fill="#e3c27a" stroke="#141b2a" stroke-width="1.5" visibility="hidden"/>`
    + `<rect x="0" y="0" width="${W}" height="${H - padB}" fill="transparent" onmousemove="simMove(event,this)" onmouseleave="spkOut()"/>`
    + `</svg>`;
};

const DONUT_PALETTE = ['#e3c27a', '#4fd1a1', '#6aa5ff', '#e8b04a', '#f06a5e'];
const donut = (slices, size = 130) => {
  const active = slices.filter(s => s.usd > 0);
  if (active.length < 2) return '';
  const total = active.reduce((s, a) => s + a.usd, 0);
  if (!total) return '';
  const cx = size / 2, cy = size / 2, ro = size * 0.45, ri = size * 0.29;
  const tau = 2 * Math.PI;
  const f = n => n.toFixed(2);
  let paths = '', start = -Math.PI / 2;
  active.forEach((a, i) => {
    const sweep = (a.usd / total) * tau;
    const end = start + sweep;
    const large = sweep > Math.PI ? 1 : 0;
    const ox1 = cx + ro * Math.cos(start), oy1 = cy + ro * Math.sin(start);
    const ox2 = cx + ro * Math.cos(end),   oy2 = cy + ro * Math.sin(end);
    const ix1 = cx + ri * Math.cos(end),   iy1 = cy + ri * Math.sin(end);
    const ix2 = cx + ri * Math.cos(start), iy2 = cy + ri * Math.sin(start);
    const color = i < DONUT_PALETTE.length ? DONUT_PALETTE[i] : `hsl(${(i * 47) % 360},55%,55%)`;
    const pct = ((a.usd / total) * 100).toFixed(1);
    paths += `<path d="M${f(ox1)},${f(oy1)} A${f(ro)},${f(ro)} 0 ${large},1 ${f(ox2)},${f(oy2)} L${f(ix1)},${f(iy1)} A${f(ri)},${f(ri)} 0 ${large},0 ${f(ix2)},${f(iy2)} Z" fill="${color}" stroke="#090c12" stroke-width="1.5" data-name="${esc(a.name || a.chain || '?')}" data-usd="${esc(usd(a.usd))}" data-pct="${pct}" onmouseenter="this.setAttribute('fill-opacity','0.72')" onmouseleave="this.setAttribute('fill-opacity','1');donutOut()" onmousemove="donutMove(event,this)"/>`;
    start = end;
  });
  const t = total >= 1e9 ? `$${(total/1e9).toFixed(1)}B` : total >= 1e6 ? `$${(total/1e6).toFixed(1)}M` : total >= 1e3 ? `$${(total/1e3).toFixed(1)}K` : usd(total, 0);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">${paths}<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="#eef2f8" font-size="11" font-weight="700" font-family="Inter,system-ui,sans-serif">${esc(t)}</text></svg>`;
};

const perfFrom = (pts, secsBack) => {
  const last = pts[pts.length - 1];
  const target = last.time - secsBack;
  const ref = pts.reduce((b, p) => Math.abs(p.time - target) < Math.abs(b.time - target) ? p : b, pts[0]);
  const delta = last.usd - ref.usd;
  return { delta, pct: ref.usd ? delta / ref.usd * 100 : 0 };
};
const netStats = (pts) => {
  if (!pts || pts.length < 2) return null;
  let athIdx = 0;
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].usd > pts[athIdx].usd) athIdx = i;
  }
  const ath = pts[athIdx].usd;
  const athDate = pts[athIdx].time;
  const current = pts[pts.length - 1].usd;
  const drawdownPct = ath > 0 ? (current - ath) / ath * 100 : 0;
  let bestDay = 0, worstDay = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = pts[i].usd - pts[i - 1].usd;
    if (d > bestDay) bestDay = d;
    if (d < worstDay) worstDay = d;
  }
  return { ath, athDate, drawdownPct, bestDay, worstDay };
};

        <button class="action" onclick="go('savings')"><b>Savings</b><span>put idle dollars to work</span></button>
        <button class="action" onclick="go('permissions')"><b>Permissions</b><span>who can move your money</span></button>

      </div>
      ${fullErr ? `<div class="note err"><b>DeBank: ${esc(fullErr.message)}</b> — showing the keyless rail instead.</div>` : ''}
      ${!full && !hasKey() ? `<div class="note">This is the <b>keyless floor</b>: native coin and USDC/USDT/DAI on eight chains.

      <div class="grid2">

            <div class="acct">
              <div class="ic">${esc((a.chain || '?').slice(0, 3).toUpperCase())}</div>
              <div class="t"><b>${esc(a.name)}</b><span>${esc(a.sub)}</span>

          ${assets.length ? assets.map((t) => `
            <div class="acct">

          ${assets.length ? `<div style="margin-top:10px"><a href="#" onclick="go('assets');return false">All assets</a></div>` : ''}

  },

  async accounts(id) {
    const rail = await get('/balances', { id });
    let full = null;
    if (hasKey()) { try { full = await get('/portfolio', { id }); } catch (e) { if (keyErr(e)) state.keyOk = false; } }
    const fullBy = Object.fromEntries((full?.chains || []).map((c) => [c.chain, c]));
    const cards = rail.chains.map((c) => {
      const f = fullBy[c.chain];
      const stables = c.tokens.filter((t) => !t.native && t.amount > 0);
      const mine = same(state.me, id);
      return `<div class="card">
        <h3>${esc(c.name)} <span class="r">chain ${c.chain_id}</span></h3>
        <div style="font-size:22px;font-weight:700" class="num">${usd(f ? f.usd : c.usd)}</div>
        <div class="mut" style="font-size:12px;margin-bottom:10px">${f ? 'DeBank, incl. DeFi' : 'native + stablecoins'}</div>
        <div class="kv">
          <span>${esc(c.native)}</span><div class="num">${num(c.native_amount, 5)}</div>
          ${stables.map((t) => `<span>${esc(t.symbol)}</span><div class="num">${num(t.amount, 2)}</div>`).join('')}
        </div>
        <div class="row" style="margin-top:12px">
          ${mine ? `<button class="btn sm" onclick="prefillSend('${c.chain}')">Send from here</button>` : ''}
          ${state.me ? `<button class="btn sm ghost" onclick="switchChain('${c.chain}').then(()=>toast('Wallet on ${esc(c.name)}')).catch(e=>toast(e.message,true))">Switch wallet</button>` : ''}
          <a class="btn sm ghost" href="${esc((netOf(c.chain) || {}).explorer || '#')}/address/${esc(id)}" target="_blank" rel="noopener">Explorer</a>
        </div>
      </div>`;
    });
    const extra = (full?.chains || []).filter((c) => !netOf(c.chain));
    return `<div class="h2">Accounts</div><p class="lead">One account per chain. ${mineLabel()}</p>
      ${stats([['total', usd(full ? full.total_usd : rail.total_usd)], ['chains with value', (full ? full.chains : rail.chains.filter((c) => c.usd > 0)).length], rail.errors ? ['unreachable', Object.keys(rail.errors).join(', '), 'warn'] : null])}
      <div class="grid3">${cards.join('')}</div>
      ${extra.length ? `<div class="card" style="margin-top:16px"><h3>Other chains (DeBank)</h3>${table([
        { label: 'chain', get: (r) => `<b>${esc(r.name || r.chain)}</b>` },
        { label: 'native', get: (r) => esc(r.native || '') },
        { label: 'value', n: true, get: (r) => usd(r.usd) }], extra)}</div>` : ''}`;
  },

  async assets(id) {
    if (hasKey()) {
      try {
        const chain = state.chainFilter || '';
        const d = await get('/tokens', { id, chain, limit: 200 });
        const dSlices = d.tokens.slice(0, 5).map(t => ({ name: t.symbol, usd: t.usd }));
        const dOther = d.tokens.slice(5).reduce((s, t) => s + t.usd, 0);
        if (dOther > 0) dSlices.push({ name: 'Other', usd: dOther });
        const dSvg = donut(dSlices, 130);
        const dTot = dSlices.reduce((s, t) => s + t.usd, 0);
        const dViz = dSvg ? `<div style="display:flex;align-items:center;gap:20px;margin-bottom:12px">${dSvg}<div style="display:flex;flex-direction:column;gap:5px;justify-content:center">${dSlices.filter(s => s.usd > 0).map((s, i) => `<span style="font-size:12px;display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;flex-shrink:0;background:${i < DONUT_PALETTE.length ? DONUT_PALETTE[i] : 'hsl(' + (i * 47) % 360 + ',55%,55%)'}"></span><span class="faint">${esc(s.name)}</span><span style="margin-left:8px">${dTot ? ((s.usd / dTot) * 100).toFixed(1) : '0.0'}%</span></span>`).join('')}</div></div>` : '';
        return `<div class="h2">Assets</div><p class="lead">Every token DeBank prices, biggest first. ${mineLabel()}</p>
          ${stats([['token value', usd(d.total_usd)], ['shown', `${d.shown} of ${d.total}`], d.hidden_below_min_usd ? ['dust hidden', d.hidden_below_min_usd] : null])}
          <div class="card"><h3>Holdings <span class="r">${filterRow('assets')}</span></h3>${dViz}${table([
            { label: 'asset', get: (r) => `<b>${esc(r.symbol || '?')}</b> <span class="faint">${esc(r.name || '')}</span>` },
            { label: 'chain', get: (r) => esc(chainName(r.chain)) },
            { label: 'amount', n: true, get: (r) => num(r.amount) },
            { label: 'price', n: true, get: (r) => usd(r.price, r.price < 1 ? 4 : 2) },
            { label: '24h', n: true, get: (r) => pct24h(r.price_24h_change) },
            { label: 'value', n: true, get: (r) => `<b>${usd(r.usd)}</b>` }], d.tokens)}</div>`;
      } catch (e) { if (!keyErr(e)) throw e; state.keyOk = false; }
    }
    const d = await get('/balances', { id });
    const rows = d.tokens.filter((t) => t.amount > 0);
    const rSlices = rows.slice(0, 5).map(t => ({ name: t.symbol, usd: t.usd }));
    const rOther = rows.slice(5).reduce((s, t) => s + t.usd, 0);
    if (rOther > 0) rSlices.push({ name: 'Other', usd: rOther });
    const rSvg = donut(rSlices, 130);
    const rTot = rSlices.reduce((s, t) => s + t.usd, 0);
    const rViz = rSvg ? `<div style="display:flex;align-items:center;gap:20px;margin-bottom:12px">${rSvg}<div style="display:flex;flex-direction:column;gap:5px;justify-content:center">${rSlices.filter(s => s.usd > 0).map((s, i) => `<span style="font-size:12px;display:flex;align-items:center;gap:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;flex-shrink:0;background:${i < DONUT_PALETTE.length ? DONUT_PALETTE[i] : 'hsl(' + (i * 47) % 360 + ',55%,55%)'}"></span><span class="faint">${esc(s.name)}</span><span style="margin-left:8px">${rTot ? ((s.usd / rTot) * 100).toFixed(1) : '0.0'}%</span></span>`).join('')}</div></div>` : '';
    return `<div class="h2">Assets</div><p class="lead">Native coin and stablecoins on the bank rail. ${mineLabel()}</p>
      ${stats([['rail value', usd(d.total_usd)], ['positions', rows.length], ['coverage', '8 chains']])}
      <div class="note">Only the rail is visible without a DeBank key — every other token, LP and staked balance needs one. <a href="#" onclick="go('settings');return false">Add a key</a>.</div>
      <div class="card"><h3>Holdings</h3>${rViz}${table([
        { label: 'asset', get: (r) => `<b>${esc(r.symbol)}</b> ${r.native ? '<span class="pill">native</span>' : ''}` },
        { label: 'chain', get: (r) => esc(chainName(r.chain)) },
        { label: 'amount', n: true, get: (r) => num(r.amount) },
        { label: 'price', n: true, get: (r) => usd(r.price, r.price < 1 ? 4 : 2) },
        { label: 'value', n: true, get: (r) => `<b>${usd(r.usd)}</b>` },
        { label: '', get: (r) => same(state.me, id) ? `<button class="btn sm ghost" onclick="prefillSend('${r.chain}','${esc(r.symbol)}')">Send</button>` : '' }],
        rows, 'Nothing on the rail for this address.')}</div>`;
  },

  async savings(id) {
    const [sav, fx] = await Promise.all([get('/savings', { id }), get('/funds', {})]);
    const mine = same(state.me, id);
    const fmtM = (n) => n == null ? '—' : n >= 1e9 ? '$' + (n / 1e9).toFixed(1) + 'b' : n >= 1e6 ? '$' + (n / 1e6).toFixed(0) + 'm' : usd(n, 0);
    const pct = (n) => n == null ? '—' : Number(n).toFixed(2) + '%';
    const exitChip = (e) => e.delay_days ? `<span class="pill warn" title="${esc(e.note)}">${e.kind} · ~${e.delay_days}d</span>`
      : `<span class="pill ok" title="${esc(e.note)}">instant exit</span>`;
    const idleOf = (sym, chain) => {
      const t = (sav.idle.tokens || []).find((t) => t.symbol === sym && t.chain === chain);
      return t ? t.amount : 0;
    };
    const placed = sav.placed.venues || [];
    const p = state.savPlan;

    const planner = p ? await (async () => {
      let d = p.data;
      if (!d) {
        try { d = await get('/savings/plan', { id, fund: p.fund, amount: p.amount }, { cache: false }); p.data = d; }
        catch (e) { return `<div class="card" style="margin-bottom:16px"><h3>Place savings</h3>${errCard(e)}
          <button class="btn sm ghost" onclick="state.savPlan=null;render()">Close</button></div>`; }
      }
      return `<div class="card" style="margin-bottom:16px;border-color:var(--gold2)">
        <h3>Place savings — ${esc(d.fund.name)} <span class="r">${esc(d.fund.chain_name)} · ${esc(d.fund.asset)}
          <button class="btn sm ghost" onclick="state.savPlan=null;render()">Close</button></span></h3>
        <div class="row" style="margin-bottom:12px">
          <div style="flex:1;min-width:180px"><label class="f">Amount (${esc(d.fund.asset)})</label>
            <div class="row"><input class="f num" id="savAmt" inputmode="decimal" style="min-width:130px;width:auto;flex:1" value="${esc(p.amount)}">
            <button class="btn" onclick="planFund('${esc(p.fund)}', ${idleOf(d.fund.asset, d.chain)})">Max</button>
            <button class="btn" onclick="planFund('${esc(p.fund)}', $('savAmt').value)">Recalculate</button></div></div>
          <div class="stat"><b class="up">${pct(d.fund.projected_apy)}</b><span>projected roi / yr</span></div>
          <div class="stat"><b>${usd(d.projected_1y_usd ?? d.fund.projected_1y_usd)}</b><span>projected 1y earnings</span></div>
          <div class="stat"><b>${d.signatures}</b><span>wallet signatures</span></div>
        </div>
        ${table([
          { label: 'protocol', get: (l) => `<b>${esc(l.name)}</b><div class="faint" style="font-size:11px">${esc(l.receipt)} · since ${l.since}</div>` },
          { label: 'weight', n: true, get: (l) => (100 * l.weight).toFixed(0) + '%' },
          { label: 'amount', n: true, get: (l) => `<b>${usd(l.allocation_usd)}</b>` },
          { label: 'apy', n: true, cls: () => 'up', get: (l) => pct(l.apy_30d ?? l.apy) },
          { label: '1y proj.', n: true, get: (l) => usd(l.projected_1y_usd) },
          { label: 'liquidity locked', n: true, get: (l) => fmtM(l.liquidity.locked_usd) },
          { label: 'exit', get: (l) => exitChip(l.exit) }], d.legs)}
        ${!d.funded ? `<div class="note err" style="margin-top:12px"><b>Not enough ${esc(d.fund.asset)} on ${esc(d.fund.chain_name)}</b> —
          the wallet holds ${num(d.wallet_has, 2)}, short ${usd(d.shortfall)}. Receive or bridge it there first, or lower the amount.</div>` : ''}
        <div id="savStatus" style="margin-top:12px"></div>
        <div class="row" style="margin-top:12px">
          ${mine ? `<button class="btn gold" id="savGo" onclick="placeLegs()" ${!d.funded ? 'disabled' : ''}>Sign ${d.signatures} transactions in wallet</button>`
                 : `<button class="btn gold" onclick="connect()">Connect the owning wallet to place</button>`}
          <span class="faint" style="font-size:12px">approvals are exact-amount, never unlimited · deposits go straight from your wallet to the protocol</span>
        </div></div>`;
    })() : '';

    const sim = state.savSim;
    const simPanel = sim ? (() => {
      const amt = parseFloat(sim.amount) || 1000;
      const v = (d) => amt * Math.pow(1 + sim.apy / 100, d / 365);
      const bar = [30, 90, 180, 365].map((d) =>
        `<div style="text-align:center"><div class="num" style="font-weight:700">${usd(v(d))}</div>
          <div class="faint" style="font-size:11px">+${usd(v(d) - amt)}</div>
          <div class="mut" style="font-size:11px">${d}d</div></div>`).join('');
      return `<div class="card" style="margin-bottom:16px;border-color:var(--gold2)">
        <h3>Projection — ${esc(sim.name)} <span class="r"><span class="up">${pct(sim.apy)}</span>&nbsp;apy
          <button class="btn sm ghost" style="margin-left:8px" onclick="state.savSim=null;render()">Close</button></span></h3>
        <div style="margin-bottom:12px"><label class="f" style="display:inline-block;margin-right:8px">Amount (USD)</label>
          <input class="f num" id="simAmt" inputmode="decimal" style="max-width:160px;display:inline-block" value="${esc(String(sim.amount))}"
            onchange="const n=parseFloat(this.value);if(n>0&&state.savSim){state.savSim.amount=n;render()}"></div>
        ${simChart(amt, sim.apy)}
        <div style="margin-top:6px;font-size:11.5px;margin-bottom:12px">
          <span style="color:#3a4557;margin-right:4px">╌╌</span>idle (0%)&nbsp;&nbsp;&nbsp;
          <span style="color:#e3c27a;margin-right:4px">──</span>${esc(sim.name)} (${pct(sim.apy)})
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${bar}</div>
      </div>`;
    })() : '';

    return `
      <div class="hero">
        <div class="lbl">Savings</div>
        <div class="hero-total">${usdBig(sav.total_usd)}</div>
        <div class="sub">${usd(sav.idle.usd)} idle in the wallet · ${usd(sav.placed.usd)} placed in protocols
          ${sav.placed.blended_apy != null ? `earning <span class="up">${pct(sav.placed.blended_apy)}</span> ≈ ${usd(sav.placed.projected_1y_usd)}/yr` : ''}
          · read from chain, no key needed</div>
        <div class="side">${mineLabel()}<div class="mono faint" style="margin-top:6px;font-size:12px">${short(id)}</div></div>
      </div>
      ${planner}
      ${placed.length ? `<div class="card" style="margin-bottom:16px"><h3>Where your savings sit</h3>${table([
        { label: 'protocol', get: (r) => `<b>${esc(r.name)}</b><div class="faint" style="font-size:11px">${esc(chainName(r.chain))} · ${esc(r.receipt)}</div>` },
        { label: 'held', n: true, get: (r) => `<b>${usd(r.held_usd)}</b><div class="faint" style="font-size:11px">${num(r.amount, 2)} ${esc(r.asset)}</div>` },
        { label: 'apy', n: true, cls: () => 'up', get: (r) => pct(r.apy) },
        { label: '1y proj.', n: true, get: (r) => usd(r.projected_1y_usd) },
        { label: 'liquidity locked', n: true, get: (r) => fmtM(r.liquidity.locked_usd) },
        { label: 'exit', get: (r) => exitChip(r.exit) },
        { label: '', get: (r) => mine ? `<button class="btn sm danger" onclick="withdrawVenue('${r.venue}','${esc(r.name)}')">Withdraw all</button>` : '' }],
        placed)}</div>` : ''}
      ${!placed.length && !sav.idle.usd ? `<div class="note">No stablecoins found on the bank rail for this address.
        Receive USDC, USDT or DAI first — then this page can put them to work.</div>` : ''}
      ${simPanel}
      <div class="h2" style="margin-top:6px">Index funds</div>
      <p class="lead">Curated baskets of yield venues — one asset, one chain, a few signatures. Projected ROI is the 30-day mean
      APY per sleeve, weighted; liquidity locked is read from each protocol's contract right now. Not a promise, and not FDIC anything.</p>
      <div class="grid2">
        ${fx.funds.map((f) => `
        <div class="card">
          <h3>${esc(f.name)} <span class="r"><span class="chip">${esc(f.chain_name)}</span> <span class="chip gold">${esc(f.asset)}</span>
            <span class="pill ${f.tier === 'core' ? 'ok' : 'warn'}">${esc(f.tier)}</span></span></h3>
          <div class="row" style="align-items:baseline;gap:14px;margin-bottom:6px">
            <div style="font-size:30px;font-weight:700" class="up num">${pct(f.projected_apy)}</div>
            <div class="mut" style="font-size:12px">projected roi / yr · spot today ${pct(f.current_apy)}</div>
          </div>
          <p class="mut" style="font-size:12.5px;margin:0 0 12px">${esc(f.strategy)}</p>
          ${f.sleeves.map((s) => `
            <div class="acct">
              <div class="ic">${esc(s.protocol.slice(0, 3).toUpperCase())}</div>
              <div class="t"><b>${esc(s.name)}</b><span>${(100 * s.weight).toFixed(0)}% · ${esc(s.exit.kind)}${s.exit.delay_days ? ` ~${s.exit.delay_days}d` : ''} exit</span></div>
              <div class="v"><b class="up">${pct(s.apy_30d ?? s.apy)}</b><span>${fmtM(s.liquidity.locked_usd)} locked</span></div>
            </div>`).join('')}
          <div class="row" style="margin-top:12px;justify-content:space-between">
            <span class="faint" style="font-size:12px">${fmtM(f.liquidity_locked_usd)} locked across sleeves · ${exitChip(f.exit)}</span>
            <div class="row" style="gap:6px">
              <button class="btn sm ghost" onclick="simFund('${esc(f.name)}', ${f.projected_apy}, ${idleOf(f.asset, f.chain) || 1000})">Simulate</button>
              <button class="btn sm gold" onclick="planFund('${f.id}', ${idleOf(f.asset, f.chain) || 1000})">Place savings</button>
            </div>
          </div>
        </div>`).join('')}
      </div>
      <div class="card" style="margin-top:16px"><h3>Single protocols <span class="r">a fund of one — 2 signatures</span></h3>${table([
        { label: 'protocol', get: (v) => `<b>${esc(v.name)}</b><div class="faint" style="font-size:11px">${esc(v.blurb)}</div>` },
        { label: 'chain', get: (v) => esc(chainName(v.chain)) },
        { label: 'asset', get: (v) => esc(v.asset) },
        { label: 'apy', n: true, cls: () => 'up', get: (v) => pct(v.apy) },
        { label: '30d', n: true, get: (v) => pct(v.apy_30d) },
        { label: 'liquidity locked', n: true, get: (v) => fmtM(v.liquidity.locked_usd) },
        { label: 'exit', get: (v) => exitChip(v.exit) },
        { label: '', get: (v) => `<button class="btn sm ghost" onclick="simFund('${esc(v.name)}', ${v.apy_30d ?? v.apy}, 1000)">Simulate</button> <button class="btn sm ghost" onclick="planFund('venue:${v.venue}', 1000)">Place</button>` }],
        fx.venues)}</div>
      <div class="faint" style="margin-top:12px;font-size:11.5px">APY source: ${esc((fx.venues[0] || {}).apy_source || 'DefiLlama')}.
        Yield moves, contracts can fail, stablecoins can depeg — this is DeFi, not a deposit guarantee.</div>`;
  },

  async positions(id) {
    if (!hasKey()) return `<div class="h2">Positions</div><p class="lead">DeFi — supplied, staked, borrowed.</p>${keyCard('DeFi positions')}`;
    const d = await get('/protocols', { id, chain: state.chainFilter || '', detail: 'true' });
    const minH = (r) => Math.min(...(r.positions || []).filter((p) => p.health_rate != null).map((p) => p.health_rate).concat([Infinity]));
    const atRisk = (d.protocols || []).filter((r) => minH(r) < 1.2).map((r) => r.name || r.protocol);
    const fmtTokens = (toks, cls, label) => (toks || []).length
      ? `<span class="${esc(cls)}">${(toks).map((t) => `${num(t.amount, 4)} ${esc(t.symbol)} ${usd(t.usd)}`).join(', ')} ${esc(label)}</span>`
      : '';
    const posDetail = (r) => (r.positions || []).map((p) => {
      const s = fmtTokens(p.assets, 'up', 'supplied');
      const b = fmtTokens(p.debt, 'warn', 'borrowed');
      return (s || b) ? `<div class="faint" style="font-size:11px">${[s, b].filter(Boolean).join(' · ')}</div>` : '';
    }).join('');
    return `<div class="h2">Positions</div><p class="lead">Open DeFi positions, net of what is borrowed against them. ${mineLabel()}</p>
      ${stats([['net in DeFi', usd(d.total_usd)], ['borrowed', usd(d.total_borrowed_usd), d.total_borrowed_usd ? 'warn' : ''], ['protocols', d.shown]])}
      ${atRisk.length ? `<div class="note err"><b>Health rate below 1.2 on ${esc(atRisk.join(', '))}</b> — repay debt or add collateral to avoid liquidation.</div>` : ''}
      <div class="card"><h3>Protocols <span class="r">${filterRow('positions')}</span></h3>${table([
        { label: 'protocol', get: (r) => `<b>${esc(r.name || r.protocol)}</b>${posDetail(r)}` },
        { label: 'chain', get: (r) => esc(chainName(r.chain)) },
        { label: 'type', get: (r) => `<span class="faint">${esc((r.positions || []).map((p) => p.type).filter(Boolean).join(', ') || '—')}</span>` },
        { label: 'supplied', n: true, get: (r) => usd(r.supplied_usd) },
        { label: 'borrowed', n: true, cls: (r) => r.borrowed_usd ? 'warn' : '', get: (r) => usd(r.borrowed_usd) },
        { label: 'net', n: true, get: (r) => `<b>${usd(r.usd)}</b>` },
        { label: 'health', n: true, get: (r) => { const h = minH(r); return h === Infinity ? '' : `<span class="pill ${h < 1.0 ? 'bad' : h < 1.5 ? 'warn' : 'ok'}">⚡ ${h.toFixed(2)}</span>`; } }],
        d.protocols, 'No open positions.')}</div>`;
  },

  async statement(id) {
    if (!hasKey()) return `<div class="h2">Statement</div><p class="lead">Decoded transaction history.</p>${keyCard('Statements')}`;
    const d = await get('/history', { id, chain: state.chainFilter || '' });
    const leg = (l) => (l || []).map((x) => `${num(x.amount, 4)} ${esc(x.symbol || '')}`).join(', ');
    const typeCounts = {};
    (d.transactions || []).forEach((r) => { typeCounts[r.type || ''] = (typeCounts[r.type || ''] || 0) + 1; });
    const q = state.stmtSearch || '';
    const visible = (d.transactions || []).filter((r) => stmtMatch(r, q));
    const subLabel = q ? ` <span class="chip" style="font-size:11px">${visible.length} of ${(d.transactions || []).length} shown</span>` : '';
    const typeChips = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]).map(([t, n]) => {
      const active = q === t;
      const onclick = `state.stmtSearch=${active ? "''" : "'" + t.replace(/'/g, "\\'") + "'"};render()`;
      return `<button class="chip${active ? ' gold' : ''}" style="cursor:pointer;background:none;border:1px solid ${active ? 'rgba(227,194,122,.4)' : 'var(--line2)'};" onclick="${esc(onclick)}">${esc(t)} <span class="faint">${n}</span></button>`;
    }).join(' ');
    const wkHtml = weekChart(d.transactions || []);
    const clearBucket = state.stmtBucket !== null ? `<button class="chip" style="cursor:pointer;background:none;border:1px solid rgba(227,194,122,.4);" onclick="${esc('state.stmtBucket=null;render()')}">× clear week</button>` : '';
    return `<div class="h2">Statement</div><p class="lead">What moved, through what, at what cost. ${mineLabel()}</p>
      ${stats([['transactions', d.count], ['oldest shown', d.oldest_time ? when(d.oldest_time) : '—']])}
      ${wkHtml ? `<div style="margin-bottom:14px">${wkHtml}</div>` : ''}
      ${(typeChips || clearBucket) ? `<div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:6px">${typeChips}${clearBucket}</div>` : ''}
      <div class="card"><h3>Recent activity${subLabel} <span class="r"><input class="sm" style="height:32px;border-radius:8px;padding:0 10px;font-size:12.5px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);outline:0;width:140px" placeholder="search…" value="${esc(q)}" oninput="state.stmtSearch=this.value;render()">&nbsp;${filterRow('statement')} <button class="btn sm ghost" onclick="downloadStmtCSV()">↓ CSV</button></span></h3>${table([
        { label: 'when', get: (r) => `<span class="mut">${when(r.time)}</span>` },
        { label: 'type', get: (r) => `<b>${esc(r.type)}</b><div class="faint" style="font-size:11.5px">${esc(r.project || r.action || '')}</div>` },
        { label: 'chain', get: (r) => esc(chainName(r.chain)) },
        { label: 'out', cls: () => 'down', get: (r) => leg(r.sent) ? '−' + leg(r.sent) : '' },
        { label: 'in', cls: () => 'up', get: (r) => leg(r.received) ? '+' + leg(r.received) : '' },
        { label: 'with', get: (r) => { const cp = (r.sent?.[0]?.counterparty) || (r.received?.[0]?.counterparty); return isAddr(cp) ? `<a href="#" class="faint mono" style="font-size:11px" onclick="setView('${esc(cp)}');go('overview');return false">${short(cp)}</a>` : ''; } },
        { label: 'fee', n: true, get: (r) => usd(r.gas_usd, 4) },
        { label: '', get: (r) => {
          const eb = netOf(r.chain)?.explorer || state.chains.find((x) => x.chain === r.chain)?.explorer;
          const base = eb && (eb.startsWith('http') ? eb : 'https://' + eb);
          return `<span class="pill ${r.status === 'ok' ? 'ok' : 'bad'}">${esc(r.status)}</span>${r.hash && base ? ` <a href="${esc(base)}/tx/${r.hash}" target="_blank" rel="noopener">↗</a>` : ''}`;
        } }],
        visible, 'No transactions.')}
        ${d.oldest_time ? `<div style="margin-top:10px"><button class="btn sm ghost" onclick="olderStatement(${d.oldest_time})">Older</button></div>` : ''}</div>`;
  },

  async permissions(id) {
    if (!hasKey()) return `<div class="h2">Permissions</div><p class="lead">Standing approvals — who can move this money without asking.</p>${keyCard('Approvals')}`;
    const scanAll = state.scanAllPermissions;
    const scanBtn = `<button class="btn sm${scanAll ? ' gold' : ' ghost'}" onclick="state.scanAllPermissions=!state.scanAllPermissions;state.cache={};render()">${scanAll ? '◉ All chains' : '○ Scan all chains'}</button>`;

    if (scanAll) {
      let portfolio = null;
      try { portfolio = await get('/portfolio', { id }); } catch (e) { /* fall through */ }
      const chains = (portfolio?.chains || []).filter((c) => c.chain);
      if (!chains.length) return `<div class="h2">Permissions</div><p class="lead">Standing approvals across every chain. ${mineLabel()}</p>
        <div class="note">No chains with value found — DeBank has no portfolio data for this address.</div>
        <div class="row" style="margin-top:12px">${scanBtn}</div>`;

      const [results, nftResults] = await Promise.all([
        Promise.allSettled(chains.map((c) => get('/approvals', { id, chain: c.chain }))),
        Promise.allSettled(chains.map((c) => get('/nft_approvals', { id, chain: c.chain })))
      ]);
      const all = [];
      let totalExposure = 0, unlimitedCount = 0, chainsScanned = 0;
      results.forEach((r, i) => {
        if (r.status !== 'fulfilled') return;
        chainsScanned++;
        const d = r.value;
        totalExposure += d.total_exposure_usd || 0;
        unlimitedCount += d.unlimited_count || 0;
        (d.approvals || []).forEach((a) => all.push({ ...a, _chain: chains[i].chain }));
      });
      all.sort((a, b) => (b.exposure_usd || 0) - (a.exposure_usd || 0));
      const allNft = [];
      let nftSetApprovalCount = 0;
      nftResults.forEach((r, i) => {
        if (r.status !== 'fulfilled') return;
        const nd = r.value;
        nftSetApprovalCount += nd.set_approval_for_all_count || 0;
        (nd.nft_approvals || []).forEach((a) => allNft.push({ ...a, _chain: chains[i].chain }));
      });
      const mine = same(state.me, id);
      return `<div class="h2">Permissions</div><p class="lead">Every standing approval across all ${chainsScanned} chain${chainsScanned !== 1 ? 's' : ''} with value. ${mineLabel()}</p>
        ${stats([['at risk', usd(totalExposure), totalExposure ? 'bad' : ''], ['unlimited', unlimitedCount, unlimitedCount ? 'warn' : ''], ['chains scanned', chainsScanned]])}
        ${mine ? '' : `<div class="note">Connect the wallet that owns this address to revoke from here.</div>`}
        <div class="card"><h3>Approvals — all chains <span class="r">${scanBtn}</span></h3>${table([
          { label: 'chain', get: (r) => `<span class="pill">${esc(chainName(r._chain))}</span>` },
          { label: 'token', get: (r) => `<b>${esc(r.token || '?')}</b>` },
          { label: 'spender', get: (r) => `${esc(r.spender_name || 'unknown contract')}<div class="faint mono" style="font-size:11px">${short(r.spender)}</div>` },
          { label: 'allowance', get: (r) => r.unlimited ? '<span class="pill warn">unlimited</span>' : '<span class="pill">capped</span>' },
          { label: 'balance', n: true, get: (r) => usd(r.balance_usd) },
          { label: 'could take', n: true, cls: (r) => r.exposure_usd ? 'bad' : '', get: (r) => `<b>${usd(r.exposure_usd)}</b>` },
          { label: 'granted', get: (r) => `<span class="mut">${when(r.last_approved)}</span>` },
          { label: '', get: (r) => (mine && netOf(r._chain)) ? `<button class="btn sm danger" onclick="revoke('${esc(r._chain)}','${esc(r.token_id)}','${esc(r.spender)}','${esc(r.token)}')">Revoke</button>` : '' }],
          all, 'No standing approvals found across any chain.')}</div>
        <div class="card" style="margin-top:14px"><h3>NFT Approvals — all chains ${nftSetApprovalCount ? `<span class="pill warn">${nftSetApprovalCount} setApprovalForAll</span>` : ''}</h3>${table([
          { label: 'chain', get: (r) => `<span class="pill">${esc(chainName(r._chain))}</span>` },
          { label: 'collection', get: (r) => `<b>${esc(r.collection || '?')}</b><div class="faint mono" style="font-size:11px">${short(r.contract)}</div>` },
          { label: 'spender', get: (r) => `${esc(r.spender_name || 'unknown contract')}<div class="faint mono" style="font-size:11px">${short(r.spender)}</div>` },
          { label: 'type', get: (r) => r.is_set_approval_for_all ? '<span class="pill warn">setApprovalForAll</span>' : `<span class="pill">token #${esc(String(r.token_id || '?'))}</span>` },
          { label: 'granted', get: (r) => `<span class="mut">${when(r.last_approved)}</span>` },
          { label: '', get: (r) => (mine && netOf(r._chain) && r.is_set_approval_for_all) ? `<button class="btn sm danger" onclick="revokeNft('${esc(r._chain)}','${esc(r.contract)}','${esc(r.spender)}','${esc(r.collection || '')}')">Revoke</button>` : '' }],
          allNft, 'No NFT approvals found across any chain.')}</div>`;
    }

    const chain = state.chainFilter || state.networks[0]?.chain || 'eth';
    state.chainFilter = chain;
    const [d, nftd] = await Promise.all([
      get('/approvals', { id, chain }),
      get('/nft_approvals', { id, chain }).catch(() => ({ nft_approvals: [], count: 0, set_approval_for_all_count: 0 }))
    ]);
    const mine = same(state.me, id) && !!netOf(chain);
    return `<div class="h2">Permissions</div><p class="lead">Every contract still allowed to spend this address's tokens on ${esc(chainName(chain))}, ranked by what it could take today. ${mineLabel()}</p>
      ${stats([['at risk', usd(d.total_exposure_usd), d.total_exposure_usd ? 'bad' : ''], ['unlimited', d.unlimited_count, d.unlimited_count ? 'warn' : ''], ['approvals', d.shown]])}
      ${mine ? '' : `<div class="note">Connect the wallet that owns this address to revoke from here.</div>`}
      <div class="card"><h3>Approvals <span class="r">${filterRow('permissions', true)} ${scanBtn}</span></h3>${table([
        { label: 'token', get: (r) => `<b>${esc(r.token || '?')}</b>` },
        { label: 'spender', get: (r) => `${esc(r.spender_name || 'unknown contract')}<div class="faint mono" style="font-size:11px">${short(r.spender)}</div>` },
        { label: 'allowance', get: (r) => r.unlimited ? '<span class="pill warn">unlimited</span>' : '<span class="pill">capped</span>' },
        { label: 'balance', n: true, get: (r) => usd(r.balance_usd) },
        { label: 'could take', n: true, cls: (r) => r.exposure_usd ? 'bad' : '', get: (r) => `<b>${usd(r.exposure_usd)}</b>` },
        { label: 'granted', get: (r) => `<span class="mut">${when(r.last_approved)}</span>` },
        { label: '', get: (r) => mine ? `<button class="btn sm danger" onclick="revoke('${chain}','${esc(r.token_id)}','${esc(r.spender)}','${esc(r.token)}')">Revoke</button>` : '' }],
        d.approvals, 'No standing approvals on this chain.')}</div>
      <div class="card" style="margin-top:14px"><h3>NFT Approvals</h3>${table([
        { label: 'collection', get: (r) => `<b>${esc(r.collection || '?')}</b><div class="faint mono" style="font-size:11px">${short(r.contract)}</div>` },
        { label: 'spender', get: (r) => `${esc(r.spender_name || 'unknown contract')}<div class="faint mono" style="font-size:11px">${short(r.spender)}</div>` },
        { label: 'type', get: (r) => r.is_set_approval_for_all ? '<span class="pill warn">setApprovalForAll</span>' : `<span class="pill">token #${esc(String(r.token_id || '?'))}</span>` },
        { label: 'granted', get: (r) => `<span class="mut">${when(r.last_approved)}</span>` },
        { label: '', get: (r) => (mine && r.is_set_approval_for_all) ? `<button class="btn sm danger" onclick="revokeNft('${esc(chain)}','${esc(r.contract)}','${esc(r.spender)}','${esc(r.collection || '')}')">Revoke</button>` : '' }],
        nftd.nft_approvals, 'No NFT approvals on this chain.')}</div>`;
  },

  async vault(id) {
    if (!hasKey()) return `<div class="h2">Vault</div><p class="lead">NFTs at floor.</p>${keyCard('NFTs')}`;
    const d = await get('/nfts', { id, chain: state.chainFilter || '' });
    const nftCards = d.nfts.length ? d.nfts.map((r) => {
      const label = esc(r.collection || '?');
      const fallback = label.charAt(0).toUpperCase();
      const imgHtml = r.image
        ? `<img src="${esc(r.image)}" alt="" loading="lazy"
               style="width:100%;height:160px;object-fit:cover;border-radius:10px;display:block;margin-bottom:10px"
               onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`
        : '';
      return `<div class="card" style="padding:12px">
        ${imgHtml}
        <div class="ic" style="width:100%;height:${r.image ? '0' : '160px'};border-radius:10px;margin-bottom:10px;font-size:28px;${r.image ? 'display:none' : ''}">${fallback}</div>
        <div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px">${label}</div>
        <div style="font-size:13.5px;font-weight:600;margin-bottom:6px">${esc(r.name || ('#' + (r.token_id || '?')))}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="pill">${esc(chainName(r.chain))}</span>
          ${r.usd ? `<span style="font-size:13px;font-weight:600">${usd(r.usd)}</span>` : ''}
        </div>
      </div>`;
    }).join('') : `<p class="mut" style="margin:0">Nothing in the vault.</p>`;
    return `<div class="h2">Vault</div><p class="lead">NFTs, valued at floor where DeBank has one. ${mineLabel()}</p>
      ${stats([['floor value', usd(d.total_usd)], ['items', d.count]])}
      <div class="card"><h3>Items <span class="r">${filterRow('vault')}</span></h3>
      <div class="grid3" style="margin-top:12px">${nftCards}</div></div>`;
  },

  async send() {
    if (!state.me) return `<div class="h2">Send</div><p class="lead">Move native coin or stablecoins to any address.</p>
      <div class="card" style="max-width:560px"><h3>Connect a wallet to send</h3>
      <p class="mut" style="margin:0 0 14px">Transactions are built here and signed in your wallet. The key never leaves it.</p>
      <button class="btn gold" onclick="connect()">Connect wallet</button></div>`;
    const p = state.sendPrefill;
    const chain = p.chain || netOfId(state.chainId)?.chain || 'eth';
    const n = netOf(chain);
    const assets = [{ symbol: n.native, native: true, decimals: 18 }, ...n.tokens];
    const asset = p.asset && assets.find((a) => a.symbol === p.asset) ? p.asset : assets[0].symbol;
    let bal = null, gas = null;
    [bal, gas] = await Promise.all([
      get('/balances', { id: state.me, chains: chain }).then((r) => r.chains[0]).catch(() => null),
      get('/gas', { chain }).catch(() => null),
    ]);
    const balOf = (sym) => bal ? (bal.tokens.find((t) => t.symbol === sym) || {}).amount : null;
    const nativePrice = bal?.tokens?.find((t) => t.native)?.price ?? 0;
    const normalGas = gas?.levels?.find((l) => l.level === 'normal');
    const gasUnits = (asset === n.native) ? 21000 : 65000;
    const feeUsd = normalGas ? normalGas.price_gwei * gasUnits / 1e9 * nativePrice : null;
    const feeLabel = feeUsd != null
      ? `<span>~${usd(feeUsd)}</span> <span class="faint">· ${num(normalGas.price_gwei, 0)} gwei normal</span>`
      : `<span class="mut">paid in ${esc(n.native)}, set by your wallet</span>`;
    return `<div class="h2">Send</div><p class="lead">From ${short(state.me)} · signed in your wallet.</p>
      <div class="grid2">
        <div class="card">
          <div class="field"><label class="f">Network</label>
            <select id="sNet" onchange="prefillSend(this.value)">${state.networks.map((x) =>
              `<option value="${x.chain}"${x.chain === chain ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
          <div class="field"><label class="f">Asset</label>
            <select id="sAsset" onchange="prefillSend('${chain}', this.value)">${assets.map((a) =>
              `<option value="${esc(a.symbol)}"${a.symbol === asset ? ' selected' : ''}>${esc(a.symbol)}${balOf(a.symbol) != null ? ` — ${num(balOf(a.symbol), 6)} available` : ''}</option>`).join('')}</select></div>
          <div class="field"><label class="f">To</label>
            <input class="f mono" id="sTo" placeholder="0x…" spellcheck="false" value="${esc(p.to || '')}"></div>
          <div class="field"><label class="f">Amount</label>
            <div class="row" style="flex-wrap:nowrap"><input class="f num" id="sAmt" placeholder="0.00" inputmode="decimal" value="${esc(p.amount || '')}">
            <button class="btn" onclick="$('sAmt').value='${balOf(asset) ?? ''}'">Max</button></div>
            <div class="faint" style="font-size:12px;margin-top:6px">${balOf(asset) != null ? `${num(balOf(asset), 6)} ${esc(asset)} available on ${esc(n.name)}` : ''}</div></div>
          <button class="btn gold w" id="sGo" onclick="doSend('${chain}','${esc(asset)}')">Review in wallet</button>
        </div>
        <div>
          <div class="card" style="margin-bottom:14px"><h3>Before you send</h3>
            <div class="kv">
              <span>Network</span><div>${esc(n.name)} <span class="faint">(chain ${n.chain_id})</span></div>
              <span>Wallet on</span><div>${state.chainId === n.chain_id ? '<span class="up">this network</span>' : `<span class="warn">${esc(netOfId(state.chainId)?.name || 'chain ' + state.chainId)} — will switch</span>`}</div>
              <span>Asset</span><div>${esc(asset)} ${assets.find((a) => a.symbol === asset)?.native ? '<span class="pill">native</span>' : '<span class="pill">erc-20</span>'}</div>
              <span>Fee</span><div>${feeLabel}</div>
            </div></div>
          <div id="sendStatus"></div>
          <div class="note">Only send to an address on the <b>same network</b>. Transfers are final; there is no bank to call.</div>
        </div>
      </div>`;
  },

  async receive() {

        <div class="card">

            <button class="btn ghost" onclick="copy('ethereum:${esc(addr)}')">Copy payment link</button>
          </div>
        </div>
        <div class="card"><h3>Works on</h3>
          ${state.networks.map((x) => `<div class="acct"><div class="ic">${esc(x.chain.slice(0, 3).toUpperCase())}</div>
            <div class="t"><b>${esc(x.name)}</b><span>${esc(x.native)} · ${x.tokens.map((t) => t.symbol).join(', ')}</span></div>
            <div class="v"><span>chain ${x.chain_id}</span></div></div>`).join('')}
          <div class="faint" style="margin-top:10px;font-size:12px">…and every other EVM chain. Do not send Bitcoin, Solana or exchange-internal assets here.</div>
        </div>
      </div>`;
  },

    renderChrome();
    return `<div class="h2">Settings</div><p class="lead">Keys and connections.</p>
      <div class="grid2">
        <div class="card">
          <h3>DeBank AccessKey <span class="r">BYOK</span></h3>
          <p class="mut" style="margin:0 0 12px;font-size:13px">Unlocks every token, DeFi positions, NFTs, the statement and permissions. Billed to your key, per call.
