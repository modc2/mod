          </div>
          <div style="margin-top:14px" class="kv">
            <span>Status</span><div>${acct.ok ? '<span class="up">key works</span>' : `<span class="bad">${esc(acct.error || 'no working key')}</span>`}</div>
            <span>Source</span><div class="mut">${esc(acct.source || (state.key ? 'this browser' : 'none'))}</div>
            ${acct.units != null ? `<span>Units left</span><div>${esc(JSON.stringify(acct.units))}</div>` : ''}
            ${acct.units_note ? `<span></span><div class="faint">${esc(acct.units_note)}</div>` : ''}
          </div>
        </div>
        <div class="card">
          <h3>Wallet</h3>
          <div class="kv">
            <span>Provider</span><div>${eth() ? (eth().isMetaMask ? 'MetaMask' : eth().isRabby ? 'Rabby' : eth().isCoinbaseWallet ? 'Coinbase Wallet' : 'EIP-1193 wallet') : '<span class="bad">none detected</span>'}</div>
            <span>Account</span><div class="mono">${state.me ? esc(state.me) : '—'}</div>
            <span>Network</span><div>${state.me ? esc(netOfId(state.chainId)?.name || `chain ${state.chainId}`) : '—'}</div>
          </div>
          <div class="row" style="margin-top:14px">
            ${state.me ? `<button class="btn ghost" onclick="disconnect()">Disconnect</button>` : `<button class="btn gold" onclick="connect()">Connect wallet</button>`}
          </div>
          <p class="faint" style="font-size:12px;margin:14px 0 0">This page never sees a private key. It builds transactions (transfer, approve-to-zero) and the wallet signs them. Rail balances and prices are read from public RPCs and CoinGecko with no account at all.</p>
        </div>
      </div>`;
  },

  async watchlist() {
    const book = bookRead();
    if (!book.length) {
      return `<div class="empty">
        <h2>Watchlist</h2>
        <p>Save addresses with ★ to build your watchlist.</p>
      </div>`;
    }
    const results = await Promise.allSettled(
      hasKey()
        ? book.map(e => get('/portfolio', { id: e.addr }).catch(() => get('/balances', { id: e.addr })))
        : book.map(e => get('/balances', { id: e.addr }))
    );
    let curves = book.map(() => null);
    if (hasKey()) {
      const cr = await Promise.allSettled(book.map(e => get('/net_curve', { id: e.addr }).catch(() => null)));
      cr.forEach((r, i) => { if (r.status === 'fulfilled') curves[i] = r.value; });
    }
    const combinedTotal = results.reduce((s, r) => s + (r.status === 'fulfilled' ? (r.value?.total_usd ?? 0) : 0), 0);
    const loadedCount = results.filter(r => r.status === 'fulfilled').length;
    const heroFloor = hasKey() ? '(DeBank)' : '(keyless floor)';
    const validCurves = curves.filter(c => c?.points?.length >= 2);
    let combinedChartHtml = '';
    if (validCurves.length >= 2) {
      const grid = validCurves[0].points;
      const combinedPts = grid.map(gp => {
        const usdSum = validCurves.reduce((s, vc) => {
          const nearest = vc.points.reduce((b, p) => Math.abs(p.time - gp.time) < Math.abs(b.time - gp.time) ? p : b, vc.points[0]);
          return s + nearest.usd;
        }, 0);
        return { time: gp.time, usd: usdSum };
      });
      combinedChartHtml = bigChart(combinedPts);
    }
    const heroHtml = loadedCount > 0 ? (combinedChartHtml
      ? `<div class="card" style="margin-bottom:18px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
            <div>
              <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600">Combined net worth</div>
              <div style="font-size:12px;color:var(--mute);margin-top:3px">${loadedCount} address${loadedCount !== 1 ? 'es' : ''} ${heroFloor}</div>
            </div>
            <div class="num" style="font-size:28px;font-weight:700">${usd(combinedTotal, 0)}</div>
          </div>
          ${combinedChartHtml}
        </div>`
      : `<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <div>
            <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600">Combined net worth</div>
            <div style="font-size:12px;color:var(--mute);margin-top:3px">${loadedCount} address${loadedCount !== 1 ? 'es' : ''} ${heroFloor}</div>
          </div>
          <div class="num" style="font-size:28px;font-weight:700">${usd(combinedTotal, 0)}</div>
        </div>`) : '';
    const cards = book.map((e, i) => {
      const r = results[i];
      const bal = r.status === 'fulfilled' ? r.value : null;
      const curve = curves[i];
      const pts = curve?.points?.length >= 2 ? curve.points : null;
      const total = bal?.total_usd ?? 0;
      const chainCount = bal?.chains?.length ?? 0;
      let perfChip = '';
      let spkHtml = '';
      if (pts) {
        const periods = [{label:'24h', s:86400}, {label:'7d', s:604800}, {label:'30d', s:2592000}];
        const chips = periods.map(({label, s}) => {
          if (pts[0].time > pts[pts.length - 1].time - s * 0.8) return '';
          const {delta, pct} = perfFrom(pts, s);
          const cls = delta >= 0 ? 'up' : 'down';
          return `<span class="${cls}">${delta >= 0 ? '+' : ''}${usd(delta)} ${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span> <span class="faint" style="font-size:11px">${label}</span>`;
        }).filter(Boolean).join(' &nbsp;·&nbsp; ');
        perfChip = chips;
        spkHtml = sparkline(pts, 160, 44);
      }
      const allocationBar = bal?.chains?.length && total > 0
        ? `<div style="display:flex;gap:2px;height:3px;margin-top:10px;border-radius:2px;overflow:hidden">${
            bal.chains.slice(0, 5).map((c, ci) =>
              `<div style="flex:${c.usd / total};min-width:2px;background:${DONUT_PALETTE[ci % DONUT_PALETTE.length]};height:100%;border-radius:1px"></div>`
            ).join('')
          }</div>` : '';
      return `<div class="card" style="cursor:pointer;transition:border-color .15s" onclick="setView('${esc(e.addr)}');go('overview')"
        onmouseenter="this.style.borderColor='var(--gold)'" onmouseleave="this.style.borderColor=''">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="min-width:0">
            <div style="font-size:13.5px;font-weight:600;margin-bottom:2px">${esc(e.label)}</div>
            <div class="mono faint" style="font-size:11.5px">${short(e.addr)}</div>
          </div>
          <div style="text-align:right;flex:none">
            <div style="font-size:18px;font-weight:700" class="num">${usd(total, 0)}</div>
            <div class="faint" style="font-size:11.5px">${chainCount} chain${chainCount !== 1 ? 's' : ''}</div>
          </div>
        </div>
        ${r.status !== 'fulfilled' ? `<div class="faint" style="font-size:12px;margin-top:8px">Could not load balance</div>` : ''}
        ${pts ? `<div style="margin:10px 0 4px;line-height:0">${spkHtml}</div>` : ''}
        ${perfChip ? `<div style="margin-top:${pts ? '2px' : '8px'}">${perfChip}</div>` : ''}
        ${allocationBar}
      </div>`;
    }).join('');
    return `<div class="h2">Watchlist</div>
      <p class="lead">${book.length} saved address${book.length !== 1 ? 'es' : ''}. Click any card to focus on that account.</p>
      ${heroHtml}<div class="grid3">${cards}</div>`;
  },

  async api() {
    const d = await get('/tools');
    const info = await get('/');
    return `<div class="h2">API & MCP</div><p class="lead">The same client answers the console, the REST API and ${d.count} MCP tools.</p>
      <div class="grid2">
        <div class="card"><h3>Endpoints</h3><div class="kv" style="grid-template-columns:200px 1fr">${Object.entries(info.endpoints).map(([k, v]) =>
          `<span class="mono" style="color:var(--gold)">${esc(k)}</span><div class="mut" style="font-size:12.5px">${esc(v)}</div>`).join('')}</div>
          <div style="margin-top:14px" class="kv"><span>MCP</span><div class="mono" style="font-size:12px">POST ${location.origin}/mcp</div>
          <span>stdio</span><div class="mono" style="font-size:12px">python3 mcp.py</div><span>shell</span><div class="mono" style="font-size:12px">m debank/balances 0x…</div></div></div>
        <div class="card"><h3>Tools <span class="r">${d.count}</span></h3>${d.tools.map((t) =>
          `<div class="tool"><b>${esc(t.name)}</b> <span class="faint" style="font-size:11.5px">${Object.keys(t.inputSchema.properties || {}).join(', ') || 'no arguments'}</span>
           <div class="d">${esc(t.description)}</div></div>`).join('')}</div>
      </div>`;
  },
};

function filterRow(tab, railOnly = false) {
  return `filter ${chainSelect('cf', state.chainFilter || '', railOnly)}`;
}
document.addEventListener('change', (e) => {
  if (e.target.id === 'cf') { state.chainFilter = e.target.value; render(); }
});
async function olderStatement(t) {
  const id = state.view;
  try {
    const d = await get('/history', { id, chain: state.chainFilter || '', start_time: t });
    toast(`${d.count} older transactions loaded`);
    const k = `/history?${new URLSearchParams({ id, ...(state.chainFilter ? { chain: state.chainFilter } : {}) })}`;
    const cur = state.cache[k];
    if (cur) { cur.transactions = cur.transactions.concat(d.transactions); cur.count = cur.transactions.length; cur.oldest_time = d.oldest_time; }
    render();
  } catch (e) { toast(e.message, true); }
}
function downloadStmtCSV() {
  const id = state.view;
  const k = `/history?${new URLSearchParams({ id, ...(state.chainFilter ? { chain: state.chainFilter } : {}) })}`;
  const d = state.cache[k];
  if (!d) { toast('Load the statement first', true); return; }
  const legStr = (l) => (l || []).map((x) => `${x.amount != null ? x.amount : ''} ${x.symbol || ''}`.trim()).join(' + ');
  const csvEsc = (v) => { const s = String(v == null ? '' : v); return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['Date', 'Type', 'Protocol', 'Chain', 'Sent', 'Received', 'Counterparty', 'Fee USD', 'Status', 'TX Hash']];
  (d.transactions || []).forEach((r) => {
    const cp = r.sent?.[0]?.counterparty || r.received?.[0]?.counterparty || '';
    rows.push([
      r.time ? new Date(r.time * 1000).toISOString() : '',
      r.type || '', r.project || r.action || '',
      chainName(r.chain), legStr(r.sent), legStr(r.received),
      cp, r.gas_usd != null ? r.gas_usd : '', r.status || '', r.hash || ''
    ]);
  });
  const csv = rows.map((row) => row.map(csvEsc).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `debank-statement-${id}.csv`;
  a.click();
}

/* ── money actions ── */
function prefillSend(chain, asset, to, amount) {
  state.sendPrefill = { chain, asset, to: to ?? $('sTo')?.value, amount: amount ?? $('sAmt')?.value };
  go('send');
}
async function doSend(chain, asset) {
  const to = $('sTo').value.trim(), amount = $('sAmt').value.trim();
  const status = $('sendStatus');
  const say = (html, cls = '') => (status.innerHTML = `<div class="note ${cls}">${html}</div>`);
  if (!isAddr(to)) return say('<b>Enter a valid 0x address to send to.</b>', 'err');
  if (same(to, state.me)) return say('<b>That is your own address.</b>', 'err');
  const n = netOf(chain);
  const a = asset === n.native ? { symbol: n.native, native: true, decimals: 18 } : n.tokens.find((t) => t.symbol === asset);
  let units;
  try { units = toUnits(amount, a.decimals); } catch (e) { return say(`<b>${esc(e.message)}</b>`, 'err'); }
  if (units <= 0n) return say('<b>Enter an amount above zero.</b>', 'err');
  $('sGo').disabled = true;
  try {
    say(`Switching the wallet to <b>${esc(n.name)}</b>…`);
    await switchChain(chain);
    say(`Confirm in your wallet: <b>${esc(amount)} ${esc(asset)}</b> to <span class="mono">${short(to)}</span> on ${esc(n.name)}.`);
    const tx = a.native
      ? { from: state.me, to, value: '0x' + units.toString(16) }
      : { from: state.me, to: a.address, data: '0xa9059cbb' + pad(to) + pad(units.toString(16)) };
    const hash = await sendTx(tx);
    const link = `<a href="${esc(n.explorer)}/tx/${hash}" target="_blank" rel="noopener" class="mono">${short(hash)}</a>`;
    say(`Sent. Waiting for confirmation… ${link}`, 'ok');
    toast('Transaction submitted');
    const r = await waitReceipt(hash);
    if (!r) say(`Submitted, not yet mined: ${link}. Check the explorer.`, '');
    else if (r.status === '0x1') { say(`<b>Confirmed</b> in block ${parseInt(r.blockNumber, 16)} · ${link}`, 'ok'); state.cache = {}; }
    else say(`<b>Reverted</b> on chain · ${link}`, 'err');
  } catch (e) {
    say(`<b>${esc(e.message || 'The wallet refused')}</b>`, 'err');
  } finally { $('sGo').disabled = false; }
}
async function revoke(chain, token, spender, symbol) {
  if (!state.me) return toast('Connect the owning wallet first', true);
  if (!isAddr(token)) return toast(`${symbol} is not an ERC-20 contract — revoke it in the wallet itself`, true);
  if (!await ask(`Revoke ${symbol} allowance`, `Revoke ${symbol} for ${short(spender)} on ${chainName(chain)}? This sends approve(spender, 0) from your wallet and costs gas.`)) return;
  try {
    const n = await switchChain(chain);
    const hash = await sendTx({ from: state.me, to: token, data: '0x095ea7b3' + pad(spender) + pad('0') });
    toast(`Revoke submitted: ${short(hash)}`);
    const r = await waitReceipt(hash);
    if (r?.status === '0x1') { toast(`Revoked ${symbol} for ${short(spender)}`); state.cache = {}; render(); }
    else if (r) toast('The revoke reverted on chain', true);
    else toast(`Still pending: ${n.explorer}/tx/${hash}`);
  } catch (e) { toast(e.message || 'The wallet refused', true); }
}
async function revokeNft(chain, contract, spender, name) {
  if (!state.me) return toast('Connect the owning wallet first', true);
  if (!isAddr(contract)) return toast(`${name || contract} is not a contract address`, true);
  if (!await ask(`Revoke NFT access`, `Revoke all NFT access for ${short(spender)} on ${name || 'collection'} (${chainName(chain)})? This sends setApprovalForAll(operator, false) from your wallet and costs gas.`)) return;
  try {
    const n = await switchChain(chain);
    const hash = await sendTx({ from: state.me, to: contract, data: '0xa22cb465' + pad(spender) + pad('0') });
    toast(`Revoke submitted: ${short(hash)}`);
    const r = await waitReceipt(hash);
    if (r?.status === '0x1') { toast(`Revoked NFT access for ${short(spender)}`); state.cache = {}; render(); }
    else if (r) toast('The revoke reverted on chain', true);
    else toast(`Still pending: ${n.explorer}/tx/${hash}`);
  } catch (e) { toast(e.message || 'The wallet refused', true); }
}
/* ── savings actions ── */
function planFund(fund, amount) {
  const amt = parseFloat(amount);
  state.savPlan = { fund, amount: amt > 0 ? Math.round(amt * 100) / 100 : 1000, data: null };
  if (state.tab !== 'savings') go('savings'); else render();
}
function simFund(name, apy, amount) {
  const amt = parseFloat(amount);
  state.savSim = { name, apy, amount: amt > 0 ? Math.round(amt * 100) / 100 : 1000 };
  if (state.tab !== 'savings') go('savings'); else render();
}
async function placeLegs() {
  const d = state.savPlan?.data;
  if (!d || !state.me) return;
  const status = $('savStatus');
  const say = (html, cls = '') => (status.innerHTML = `<div class="note ${cls}">${html}</div>`);
  $('savGo').disabled = true;
  let done = 0;
  try {
    say(`Switching the wallet to <b>${esc(d.fund.chain_name)}</b>…`);
    await switchChain(d.chain);
    for (const leg of d.legs) {
      let last = null;
      for (const tx of leg.txs) {
        say(`<b>${esc(leg.name)}</b> — ${esc(tx.step)}. Confirm in your wallet…`);
        const hash = await sendTx({ from: state.me, to: tx.to, data: tx.data });
        say(`<b>${esc(leg.name)}</b> — ${esc(tx.step)}: waiting for <span class="mono">${short(hash)}</span>…`);
        const r = await waitReceipt(hash);
        if (!r || r.status !== '0x1') throw new Error(`${tx.step} ${r ? 'reverted on chain' : 'never confirmed'} (${short(hash)})`);
        last = hash;
      }
      done++;
      post('/savings/record', { id: state.me, fund: d.fund.id, venue: leg.venue,
        amount: leg.allocation_usd, tx: last, chain: d.chain }).catch(() => {});
      say(`<b>${esc(leg.name)}</b> placed — ${done} of ${d.legs.length} sleeves done.`, 'ok');
    }
    toast(`Placed ${usd(d.amount_usd)} into ${d.fund.name}`);
    state.savPlan = null; state.cache = {}; render();
  } catch (e) {
    say(`<b>${esc(e.message || 'The wallet refused')}</b>${done ? `<div class="mut" style="margin-top:4px">${done} sleeve(s) already placed — they are yours and show under “Where your savings sit”.</div>` : ''}`, 'err');
    $('savGo') && ($('savGo').disabled = false);
  }
}
async function withdrawVenue(venue, name) {
  if (!state.me) return toast('Connect the owning wallet first', true);
  if (!await ask(`Withdraw from ${name}`, `Withdraw everything from ${name} back to your wallet? This signs one transaction and costs gas.`)) return;
  try {
    const d = await get('/savings/exit', { id: state.me, venue }, { cache: false });
    await switchChain(d.chain);
    const hash = await sendTx({ from: state.me, to: d.tx.to, data: d.tx.data });
    toast(`Withdrawal submitted: ${short(hash)}`);
    const r = await waitReceipt(hash);
    if (r?.status === '0x1') { toast(`Withdrawn from ${name}`); state.cache = {}; render(); }
    else if (r) toast('The withdrawal reverted on chain', true);
    else toast('Still pending — check the explorer');
  } catch (e) { toast(e.message || 'The wallet refused', true); }
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch { prompt('Copy:', text); }
}
async function saveKey() {
  const k = $('kIn').value.trim();
  state.key = k; write(LS.key, k); state.keyOk = null; state.cache = {};
  if (!k) return render();
  try {
    const a = await get('/account', {}, { cache: false });
    state.keyOk = !!a.ok;
    toast(a.ok ? 'Key works' : `Key rejected: ${a.error || ''}`, !a.ok);
  } catch (e) { state.keyOk = false; toast(e.message, true); }
  render();
}
async function storeKeyOnServer() {
  const k = $('kIn').value.trim();
  if (!k) return toast('Paste a key first', true);
  if (!await ask('Store key on server', 'Store this key at ~/.mod/debank/key.json so the shell and MCP tools use it too?')) return;
  try { const r = await post('/set_key', { key: k, persist: true }); toast(`Stored at ${r.stored}`); state.keyOk = true; renderChrome(); }
  catch (e) { toast(e.message, true); }
}
function refresh() { state.cache = {}; render(); toast('Refreshing'); }

/* ── render loop ── */
let seq = 0;
async function render() {
  const my = ++seq;
  renderChrome();
  const needs = ['overview', 'accounts', 'assets', 'savings', 'positions', 'statement', 'permissions', 'vault'];
  if (needs.includes(state.tab) && !state.view) { out.innerHTML = needAddr(); return; }
  out.innerHTML = `<div class="spin">Reading every chain…</div>`;
  try {
    const html = await VIEWS[state.tab](state.view);
    if (my === seq) {
      out.innerHTML = html;
      if (state.tab === 'receive') setTimeout(() => {
        const el = document.getElementById('qrcode');
        const addr = state.me || state.view;
        if (el && addr && typeof QRCode !== 'undefined') new QRCode(el, { text: addr, width: 192, height: 192, colorDark: '#e3c27a', colorLight: '#10151f', correctLevel: QRCode.CorrectLevel.M });
      }, 0);
    }
  } catch (e) {
    if (my !== seq) return;
    if (keyErr(e) && needs.includes(state.tab)) { state.keyOk = false; renderChrome(); }
    out.innerHTML = errCard(e);
  }
}

/* ── boot ── */
(async () => {
  try { state.networks = (await get('/networks')).networks; } catch {}
  get('/chains').then((d) => { state.chains = d.chains; }).catch(() => {});
  if (!state.key) get('/health').then((h) => { if (h.key) state.keyOk = true; renderChrome(); }).catch(() => {});
  parseHash();
  if (state.view) $('addr').value = state.view;
  if (read(LS.connected) && eth()) await connect(true);
  render();
})();
