<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FABRICAS — design your own clothes</title>
<style>
  :root {
    --bg: #141416; --panel: #1c1c20; --edge: #2c2c32; --ink: #e8e2d4;
    --dim: #8a8578; --gold: #c9a227; --red: #a4243b; --ok: #57623c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 "Courier New", monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 14px 18px; border-bottom: 1px solid var(--edge);
  }
  header h1 { font-size: 20px; letter-spacing: 5px; }
  header .tag { color: var(--dim); font-size: 12px; }
  header .handle { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  input, select, textarea, button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--edge); border-radius: 4px; padding: 5px 8px;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--gold); }
  button { cursor: pointer; letter-spacing: 1px; }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--gold); color: #141416; font-weight: bold; }
  button.ghost { background: none; color: var(--dim); }
  main {
    display: grid; grid-template-columns: 290px 1fr 300px; gap: 16px;
    padding: 16px 18px; max-width: 1280px; margin: 0 auto;
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--edge);
           border-radius: 8px; padding: 12px; }
  .panel + .panel { margin-top: 14px; }
  .panel h2 { font-size: 11px; letter-spacing: 3px; color: var(--dim);
              margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 4px 10px; border: 1px solid var(--edge); border-radius: 14px;
    cursor: pointer; font-size: 12px; color: var(--dim); background: none;
  }
  .chip.on { border-color: var(--gold); color: var(--gold); }
  .swatches { display: flex; flex-wrap: wrap; gap: 7px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
        border: 2px solid var(--edge); }
  .sw.on { border-color: var(--gold); box-shadow: 0 0 0 2px #c9a22744; }
  .layers { display: flex; flex-direction: column; gap: 5px; }
  .layer-row {
    display: flex; gap: 6px; align-items: center; padding: 5px 7px;
    border: 1px solid var(--edge); border-radius: 5px; cursor: pointer;
    font-size: 12px;
  }
  .layer-row.on { border-color: var(--gold); }
  .layer-row .what { flex: 1; overflow: hidden; text-overflow: ellipsis;
                     white-space: nowrap; }
  .layer-row .x { color: var(--dim); background: none; border: none;
                  padding: 0 3px; }
  .layer-row .x:hover { color: var(--red); }
  .field { display: flex; align-items: center; gap: 8px; margin-top: 8px;
           font-size: 12px; }
  .field label { width: 52px; color: var(--dim); }
  .field input[type=range] { flex: 1; accent-color: var(--gold); padding: 0;
                             background: none; border: none; }
  .field input[type=text] { flex: 1; }
  .field select { flex: 1; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #preview { width: 100%; max-width: 520px; background: #232327;
             border: 1px solid var(--edge); border-radius: 10px; }
  #dname { width: 100%; max-width: 520px; text-align: center;
           background: none; border-color: transparent; }
  #dname:hover, #dname:focus { border-color: var(--edge); }
  .quote-line { display: flex; justify-content: space-between; font-size: 12px;
                padding: 2px 0; color: var(--dim); }
  .quote-line.total { color: var(--ink); font-weight: bold; font-size: 15px;
                      border-top: 1px solid var(--edge); margin-top: 6px;
                      padding-top: 6px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs .chip { flex: 1; text-align: center; border-radius: 4px; }
  .cards { display: flex; flex-direction: column; gap: 8px; max-height: 420px;
           overflow-y: auto; }
  .card { display: flex; gap: 10px; align-items: center; padding: 7px;
          border: 1px solid var(--edge); border-radius: 6px; }
  .card svg { width: 54px; height: 54px; flex-shrink: 0;
              background: #232327; border-radius: 4px; }
  .card .meta { flex: 1; font-size: 12px; min-width: 0; }
  .card .meta .nm { color: var(--ink); overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
  .card .meta .by { color: var(--dim); font-size: 11px; }
  .status { font-size: 10px; letter-spacing: 1px; padding: 2px 7px;
            border-radius: 10px; border: 1px solid var(--edge);
            color: var(--gold); white-space: nowrap; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
           background: var(--panel); border: 1px solid var(--gold);
           border-radius: 6px; padding: 8px 16px; font-size: 13px;
           opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .empty { color: var(--dim); font-size: 12px; text-align: center; padding: 12px 0; }
</style>
</head>
<body>
<header>
  <h1>FABRICAS</h1>
  <span class="tag">cut + print + sew — designed by you, made here</span>
  <span class="handle">
    <span class="tag">you are</span>
    <input id="handle" size="10" placeholder="handle">
  </span>
</header>

<main>
  <!-- ── left: the cutting table ── -->
  <section>
    <div class="panel">
      <h2>CUT</h2>
      <div class="chips" id="garments"></div>
    </div>
    <div class="panel">
      <h2>FABRIC</h2>
      <div class="swatches" id="fabrics"></div>
    </div>
    <div class="panel">
      <h2>LAYERS</h2>
      <div class="layers" id="layers"></div>
      <div class="row">
        <button id="add-text">+ TEXT</button>
        <button id="add-mark">+ MARK</button>
      </div>
      <div id="editor"></div>
    </div>
  </section>

  <!-- ── center: the garment ── -->
  <section class="stage">
    <input id="dname" placeholder="name this design" maxlength="60">
    <div id="preview"></div>
  </section>

  <!-- ── right: price, order, racks ── -->
  <section>
    <div class="panel">
      <h2>PRICE</h2>
      <div id="quote"></div>
      <div class="row">
        <select id="size"></select>
        <input id="qty" type="number" min="1" value="1" title="quantity">
      </div>
      <div class="row">
        <button id="save" title="save to the rack">SAVE</button>
        <button id="order" class="primary" title="save + place the order">ORDER</button>
      </div>
    </div>
    <div class="panel">
      <div class="tabs">
        <button class="chip on" data-tab="gallery">GALLERY</button>
        <button class="chip" data-tab="mine">MINE</button>
        <button class="chip" data-tab="orders">ORDERS</button>
      </div>
      <div class="cards" id="rack"></div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
// Relative base: served at /fabricas/, so 'api/x' → /fabricas/api/x both
// locally and behind the gateway.
const api = (p, opts) => fetch('api/' + p, opts).then(async r => {
  const j = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
});
const post = (p, body) => api(p, {method: 'POST',
  headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});

let CAT = null;                 // catalog: garments, palette, inks, shapes, fonts
let design = {garment: 'tee', color: 'bone', name: '', layers: []};
let sel = -1;                   // selected layer index
let savedId = null;             // id of the design as last saved
let remixOf = null;
let tab = 'gallery';

const $ = id => document.getElementById(id);
const me = () => $('handle').value.trim() || 'anon';
$('handle').value = localStorage.getItem('fabricas.handle') || '';
$('handle').addEventListener('change', () => {
  localStorage.setItem('fabricas.handle', me()); loadRack();
});

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// ── preview: composed client-side from the same geometry the server
//    renderer uses (paths come from /catalog, never duplicated here) ──
function esc(s) { return String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function svgFor(d, px) {
  const g = CAT.garments[d.garment];
  const fabric = CAT.palette[d.color] || d.color;
  const pa = g.print;
  let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="${px}" height="${px}">`;
  out += `<path d="${g.path}" fill="${fabric}" stroke="#000" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>`;
  for (const det of g.details)
    out += `<path d="${det}" fill="#000" opacity="0.14"/>`;
  d.layers.forEach((l, i) => {
    const cx = pa.x + pa.w * l.x / 100, cy = pa.y + pa.h * l.y / 100;
    const ink = CAT.inks[l.ink] || l.ink;
    const hl = i === sel ? `<circle cx="${cx}" cy="${cy}" r="4" fill="none" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="2 2"/>` : '';
    if (l.type === 'text') {
      const fs = Math.max(6, pa.w * l.size / 100 * 0.42);
      out += `<text x="${cx}" y="${cy}" fill="${ink}" font-family='${CAT.fonts[l.font]}' font-size="${fs}" text-anchor="middle" dominant-baseline="central" transform="rotate(${l.rotate} ${cx} ${cy})">${esc(l.text)}</text>`;
    } else {
      const k = pa.w * l.size / 100 / 100;
      out += `<g transform="translate(${cx} ${cy}) rotate(${l.rotate}) scale(${k}) translate(-50 -50)"><path d="${CAT.shapes[l.shape]}" fill="${ink}"/></g>`;
    }
    out += hl;
  });
  return out + '</svg>';
}

// ── quote (debounced against the server: pricing has one home) ──
let quoteTimer = null;
function refreshQuote() {
  clearTimeout(quoteTimer);
  quoteTimer = setTimeout(async () => {
    try {
      const q = await post('quote', {design, size: $('size').value,
                                     qty: +$('qty').value || 1});
      $('quote').innerHTML =
        line('garment', '$' + q.base.toFixed(2)) +
        (q.size_surcharge ? line('size ' + q.size, '+$' + q.size_surcharge.toFixed(2)) : '') +
        line(q.layers + ' print layer' + (q.layers === 1 ? '' : 's'), '+$' + q.print_cost.toFixed(2)) +
        line('unit', '$' + q.unit.toFixed(2)) +
        (q.discount ? line('qty break', '-' + Math.round(q.discount * 100) + '%') : '') +
        `<div class="quote-line total"><span>${q.qty} × ${q.size}</span><span>$${q.total.toFixed(2)}</span></div>`;
    } catch (e) { $('quote').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }, 220);
}
const line = (k, v) => `<div class="quote-line"><span>${k}</span><span>${v}</span></div>`;

// ── render the whole UI from state ──
function draw() {
  const g = CAT.garments[design.garment];
  $('garments').innerHTML = Object.entries(CAT.garments).map(([k, v]) =>
    `<button class="chip ${k === design.garment ? 'on' : ''}" data-g="${k}">${v.label} $${v.base_price}</button>`).join('');
  $('fabrics').innerHTML = Object.entries(CAT.palette).map(([k, v]) =>
    `<div class="sw ${k === design.color ? 'on' : ''}" data-c="${k}" title="${k}" style="background:${v}"></div>`).join('');
  $('layers').innerHTML = design.layers.map((l, i) =>
    `<div class="layer-row ${i === sel ? 'on' : ''}" data-i="${i}">
       <span class="what">${l.type === 'text' ? '"' + esc(l.text) + '"' : l.shape}</span>
       <button class="x" data-del="${i}" title="remove">×</button></div>`).join('')
    || '<div class="empty">blank garment — add a layer</div>';
  $('editor').innerHTML = sel >= 0 ? editorFor(design.layers[sel]) : '';
  const keep = $('size').value;
  $('size').innerHTML = g.sizes.map(s => `<option ${s === keep ? 'selected' : ''}>${s}</option>`).join('');
  if (!g.sizes.includes(keep)) $('size').value = g.sizes.includes('M') ? 'M' : g.sizes[0];
  $('dname').value = design.name;
  $('preview').innerHTML = svgFor(design, 520);
  refreshQuote();
}

function editorFor(l) {
  const opts = (table, cur) => Object.keys(table).map(k =>
    `<option ${k === cur ? 'selected' : ''}>${k}</option>`).join('');
  let h = '';
  if (l.type === 'text') {
    h += `<div class="field"><label>text</label><input type="text" data-k="text" value="${esc(l.text)}" maxlength="${CAT.limits.max_text}"></div>
          <div class="field"><label>font</label><select data-k="font">${opts(CAT.fonts, l.font)}</select></div>`;
  } else {
    h += `<div class="field"><label>mark</label><select data-k="shape">${opts(CAT.shapes, l.shape)}</select></div>`;
  }
  h += `<div class="field"><label>ink</label><select data-k="ink">${opts(CAT.inks, l.ink)}</select></div>
        <div class="field"><label>across</label><input type="range" data-k="x" min="0" max="100" value="${l.x}"></div>
        <div class="field"><label>down</label><input type="range" data-k="y" min="0" max="100" value="${l.y}"></div>
        <div class="field"><label>size</label><input type="range" data-k="size" min="5" max="100" value="${l.size}"></div>
        <div class="field"><label>tilt</label><input type="range" data-k="rotate" min="0" max="359" value="${l.rotate}"></div>`;
  return h;
}

function touch() { savedId = null; draw(); }

// ── events ──
$('garments').addEventListener('click', e => {
  const b = e.target.closest('[data-g]');
  if (b) { design.garment = b.dataset.g; touch(); }
});
$('fabrics').addEventListener('click', e => {
  const s = e.target.closest('[data-c]');
  if (s) { design.color = s.dataset.c; touch(); }
});
$('layers').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    design.layers.splice(+del.dataset.del, 1);
    sel = Math.min(sel, design.layers.length - 1); touch(); return;
  }
  const row = e.target.closest('[data-i]');
  if (row) { sel = +row.dataset.i; draw(); }
});
$('editor').addEventListener('input', e => {
  const k = e.target.dataset.k;
  if (k == null || sel < 0) return;
  const v = e.target.value;
  design.layers[sel][k] = ['x', 'y', 'size', 'rotate'].includes(k) ? +v : v;
  savedId = null;
  $('preview').innerHTML = svgFor(design, 520);
  if (['text'].includes(k)) refreshLayerList();
  refreshQuote();
});
function refreshLayerList() {
  [...$('layers').querySelectorAll('.layer-row')].forEach((row, i) => {
    const l = design.layers[i];
    row.querySelector('.what').textContent =
      l.type === 'text' ? '"' + l.text + '"' : l.shape;
  });
}
$('add-text').onclick = () => {
  if (design.layers.length >= CAT.limits.max_layers) return toast('the press takes ' + CAT.limits.max_layers + ' layers');
  design.layers.push({type: 'text', text: 'YOURS', font: 'display', ink: 'black',
                      x: 50, y: 30, size: 50, rotate: 0});
  sel = design.layers.length - 1; touch();
};
$('add-mark').onclick = () => {
  if (design.layers.length >= CAT.limits.max_layers) return toast('the press takes ' + CAT.limits.max_layers + ' layers');
  design.layers.push({type: 'shape', shape: 'star', ink: 'gold',
                      x: 50, y: 60, size: 40, rotate: 0});
  sel = design.layers.length - 1; touch();
};
$('dname').addEventListener('input', e => { design.name = e.target.value; savedId = null; });
$('size').addEventListener('change', refreshQuote);
$('qty').addEventListener('input', refreshQuote);

async function saveDesign() {
  const r = await post('save', {design, author: me(), remix_of: remixOf});
  savedId = r.id;
  return r.id;
}
$('save').onclick = async () => {
  try { toast('saved — ' + await saveDesign()); loadRack(); }
  catch (e) { toast(e.message); }
};
$('order').onclick = async () => {
  try {
    const id = savedId || await saveDesign();
    const o = await post('order', {id, size: $('size').value,
                                   qty: +$('qty').value || 1, author: me()});
    toast('order placed — $' + o.quote.total.toFixed(2) + ' · ' + o.id);
    tab = 'orders'; syncTabs(); loadRack();
  } catch (e) { toast(e.message); }
};

// ── the racks: gallery / mine / orders ──
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (b) { tab = b.dataset.tab; syncTabs(); loadRack(); }
});
function syncTabs() {
  [...document.querySelectorAll('.tabs .chip')].forEach(c =>
    c.classList.toggle('on', c.dataset.tab === tab));
}
async function loadRack() {
  const rack = $('rack');
  try {
    if (tab === 'orders') {
      const os = await api('orders?author=' + encodeURIComponent(me()));
      rack.innerHTML = os.length ? os.map(o =>
        `<div class="card"><div class="meta">
           <div class="nm">${o.qty} × ${o.quote.garment} · ${o.size} · $${o.quote.total.toFixed(2)}</div>
           <div class="by">${o.id} · ${new Date(o.created * 1000).toLocaleDateString()}</div></div>
         <span class="status">${o.status.toUpperCase()}</span></div>`).join('')
        : '<div class="empty">no orders yet</div>';
      return;
    }
    const ds = tab === 'mine'
      ? await api('designs?author=' + encodeURIComponent(me()))
      : await api('gallery');
    rack.innerHTML = ds.length ? ds.map(d =>
      `<div class="card">${svgFor(d.design, 54)}
         <div class="meta"><div class="nm">${esc(d.name)}</div>
           <div class="by">by ${esc(d.author)}${d.remix_of ? ' · remix' : ''}</div></div>
         <button class="chip" data-remix="${d.id}">REMIX</button></div>`).join('')
      : '<div class="empty">nothing on this rack yet</div>';
  } catch (e) { rack.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
$('rack').addEventListener('click', async e => {
  const b = e.target.closest('[data-remix]');
  if (!b) return;
  try {
    const r = await api('remix?id=' + b.dataset.remix);
    design = r.design; remixOf = r.remix_of; sel = -1; savedId = null;
    draw(); toast('remixing "' + r.design.name.replace(' (remix)', '') + '" by ' + r.original_author);
    window.scrollTo({top: 0, behavior: 'smooth'});
  } catch (err) { toast(err.message); }
});

// ── boot ──
(async () => {
  CAT = await api('catalog');
  draw(); loadRack();
})();
</script>
</body>
</html>
