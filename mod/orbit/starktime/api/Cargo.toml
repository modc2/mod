[package]
name = "starktime-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "starktime-api"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# blocking JSON-RPC to public Starknet nodes, run inside spawn_blocking
ureq = { version = "2", features = ["json"] }
sha3 = "0.10"
num-bigint = "0.4"

[profile.release]
opt-level = 3
