[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
via_ir = true
fs_permissions = [{ access = "read", path = "../near/tests/fixture.json" }, { access = "read-write", path = "../data" }]
# verification is ~0.41M gas per ring member; MAX_RING 32 = ~13.4M (tx cap 2^24)
gas_limit = 1000000000
