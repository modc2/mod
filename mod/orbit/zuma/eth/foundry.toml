[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "../near/tests/fixture.json" }]
# verification is ~300k gas per ring member; a ring of 64 needs ~20M
gas_limit = 1000000000
