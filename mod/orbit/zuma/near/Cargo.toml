[package]
name = "zuma_near"
version = "0.1.0"
edition = "2021"
description = "zuma on NEAR: anonymous Bittensor-style subnet. Verifies the same LSAG-over-STARK-curve ring signatures as the Starknet contract (contracts/), in wasm."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
starknet-types-core = { version = "0.2.4", default-features = false, features = ["curve", "hash", "alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
num-bigint = "0.4"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false
panic = "abort"
overflow-checks = true
