[package]
name = "hyperliquid-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hyperliquid-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps action JSON keys in insertion order — Hyperliquid hashes
# msgpack(action) and the Python SDK uses Python's insertion-ordered dicts, so
# any reordering breaks signature verification on /exchange.
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"

# Backend signer + Hyperliquid action signing.
# k256 = secp256k1 ECDSA (Ethereum curve); aes-gcm encrypts stored keys.
# rmp-serde = msgpack — Hyperliquid hashes msgpack-encoded actions.
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
aes-gcm = "0.10"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rmp-serde = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
