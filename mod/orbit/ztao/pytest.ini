[pytest]
# python -m pytest            -> fast offline tests (every chain + core + server)
# ZTAO_NATIVE=1 python -m pytest  -> + each chain's native suite (snforge, cargo, forge)
# ZTAO_LIVE=1   python -m pytest  -> + a full anonymous epoch on each local chain
# python -m pytest src/networks/near   -> one chain only
testpaths = src
addopts = --import-mode=importlib -p no:cacheprovider
norecursedirs = contract tools target node_modules static prover _template .git
markers =
    native: runs the chain's own toolchain suite (ZTAO_NATIVE=1)
    live: runs a full epoch on the chain's local net (ZTAO_LIVE=1)
