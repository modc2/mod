[package]
name = "ztao_near"
version = "0.1.0"
edition = "2021"
description = "ztao on NEAR: anonymous Bittensor-style subnet. Verifies the same LSAG-over-STARK-curve ring signatures as the Starknet contract (starknet/contract/), in wasm."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bench = []

[dependencies]
near-sdk = "5"
starknet-types-core = { version = "0.2.4", default-features = false, features = ["curve", "hash", "alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
num-bigint = "0.4"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false
panic = "abort"
# OFF on purpose. In wasm a checked u64/u128 multiply becomes a `__multi3`
# call, and lambdaworks' generic field/Poseidon code is inlined into THIS
# crate, so checks here doubled the cost of every hash and field op. The
# contract's own sums are checked explicitly (lib.rs `add`, checked_mul).
overflow-checks = false
