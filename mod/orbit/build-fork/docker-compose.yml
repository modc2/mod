networks:
  default:
    external: true
    name: modnet

services:
  build-fork:
    build:
      context: .
      args:
        BUILD_FORK_CID: "${BUILD_FORK_CID:-}"
        BUILD_FORK_TIME: "${BUILD_FORK_TIME:-}"
    container_name: build-fork
    image: build-fork:latest
    ports:
      - "8895:8895"
    restart: unless-stopped
    # Linux needs an explicit alias; Mac/Windows resolve host.docker.internal automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_PORT=8894
      - APP_PORT=8895
      - BUILD_FORK_JOBS_LOCAL=1
    volumes:
      - "${HOME}/.claude:/host-claude"
      - "${HOME}/.mod/build-fork:/home/node/.mod/build-fork"
      - "${HOME}/.mod/api:/home/node/.mod/api"
      - "${HOME}/mod:/home/node/mod"
      - "./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro"
