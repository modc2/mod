<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LOOPS</title>
<link rel="stylesheet" href="kit.css" />
<style>
@keyframes pill-pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.pill-pulse { animation: pill-pulse 1.4s ease-in-out infinite; }
</style>
</head>
<body>
<div class="wrap">
  <div id="hdr"></div>
  <div class="grid">
    <div class="card wide">
      <h2>Loop agents <span class="sp"></span><span id="caps" class="faint"></span><button id="newBtn" class="primary sm">+ new loop</button></h2>
      <div id="form" class="card" style="display:none;margin-bottom:12px;background:var(--panel2)">
        <div class="form">
          <label class="f">mod to improve<select id="f_module"><option value="">loading mods…</option></select></label>
          <label class="f">name (optional)<input id="f_name" placeholder="auto" /></label>
          <label class="f full">goal for the agent<textarea id="f_goal"></textarea></label>
          <label class="f full">command to check each round (optional, bash, runs in the mod)<textarea id="f_cmd" placeholder="e.g. pytest -x -q  — empty = the agent just keeps improving"></textarea></label>
        </div>
        <details style="margin-top:10px"><summary class="faint" style="cursor:pointer;font-size:12px">more options</summary>
          <div class="form" style="margin-top:10px">
            <label class="f">cwd (only if no mod)<input id="f_cwd" placeholder="/root/mod/mod/orbit/…" /></label>
            <label class="f">model<input id="f_model" placeholder="default" /></label>
            <label class="f">every (seconds)<input id="f_every" type="number" min="10" value="60" /></label>
            <label class="f">max iterations<input id="f_max" type="number" min="1" max="500" value="5" /></label>
            <label class="chk full"><input id="f_until" type="checkbox" /> stop as soon as the command exits 0</label>
          </div>
        </details>
        <div class="inline" style="margin-top:12px;justify-content:flex-end">
          <span class="faint" style="flex:1;font-size:12px">Pick a mod and go: the agent works in that mod's folder and ends the loop by printing LOOP_DONE.</span>
          <button id="cancelBtn">cancel</button><button id="createBtn" class="primary">improve it</button>
        </div>
      </div>
      <div id="list" class="rows"><div class="empty">loading…</div></div>
    </div>
  </div>
</div>
<script src="kit.js"></script>
<script>
const open = new Set();
let last = null;

const st = (s) => s === "running" ? "on" : s === "error" ? "bad" : s === "done" ? "acc" : "";

function render() {
  const d = last;
  const list = document.getElementById("list");
  if (!d) return;
  if (d.error) { list.innerHTML = `<div class="notice bad">${K.esc(d.error)}</div>`; return; }
  const loops = d.loops || [];
  const running = loops.filter((l) => l.status === "running").length;
  K.setState(K.pill(running > 0, `${running} running`, "idle"));
  document.getElementById("caps").textContent = `${loops.length}/${d.cap} loops · ${running}/${d.running_cap} running · min ${d.min_every_secs}s`;
  if (!loops.length) { list.innerHTML = `<div class="empty">No loops yet. Hit + new loop, pick a mod, and an agent keeps improving it.</div>`; return; }
  list.innerHTML = loops.map((l) => {
    const where = l.module ? `mod ${l.module}` : l.cwd;
    const iterMap = {};
    for (const e of (l.log || [])) {
      const k = e.iter ?? 0;
      if (!iterMap[k]) iterMap[k] = { hasCmd: false, passed: false, hasAgent: false };
      if (e.kind === "cmd") { iterMap[k].hasCmd = true; iterMap[k].passed = e.code === 0; }
      if (e.kind === "agent") iterMap[k].hasAgent = true;
    }
    const log = (() => {
      if (!open.has(l.id)) return "";
      const evs = (l.log || []).slice(-200);
      if (!evs.length) return `<div style="padding:6px 2px;font-size:12px;color:var(--faint)">no events yet</div>`;
      const groups = {};
      for (const e of evs) { const k = e.iter ?? 0; (groups[k] = groups[k] || []).push(e); }
      return Object.keys(groups).sort((a, b) => +a - +b).map((iter) => {
        const g = groups[iter];
        const cmdEv = g.find((e) => e.kind === "cmd");
        const agentEv = g.find((e) => e.kind === "agent");
        const ts = g[0]?.ts;
        const badge = cmdEv ? (cmdEv.code === 0 ? `<span style="color:#5fd3b8;font-weight:700">✓</span>` : `<span style="color:#e55;font-weight:700">✗</span>`) : "";
        const time = ts ? new Date(ts * 1000).toLocaleTimeString() : "";
        const cmdOut = cmdEv?.out ? `<pre class="log" style="margin:4px 0 0">${K.esc(cmdEv.out.slice(-2000))}</pre>` : "";
        const agentOut = agentEv?.out ? `<pre class="log" style="margin:4px 0 0">${K.esc(agentEv.out.slice(-2000))}</pre>` : "";
        const iterCost = agentEv?.cost_usd ? ` · $${parseFloat(agentEv.cost_usd).toFixed(2)}` : "";
        return `<details><summary style="cursor:pointer;font-size:12px;padding:3px 0">#${iter} / ${l.max_iters} ${badge} <span class="faint">${time}${iterCost}</span></summary>${cmdOut}${agentOut}</details>`;
      }).join("");
    })();
    return `<div class="row click" data-id="${l.id}" style="flex-wrap:wrap">
      <span class="pill ${st(l.status)}">${K.esc(l.status)}</span>${l.status === "running" && l.job_id ? `<a class="pill on pill-pulse" href="${K.BUILD_APP}">⟳ agent…</a>` : ""}
      <div class="grow">
        <div class="t">${K.esc(l.name)} <span class="faint mono">· ${K.esc(where)}</span></div>
        <div class="s mono">${l.cmd ? "$ " + K.esc(l.cmd) : ""}${l.goal ? ` → ${K.esc(l.goal)}` : ""}</div>
        <div class="s">iter ${l.iter}/${l.max_iters} · every ${K.dur(l.every_secs)}${l.until_pass ? " · until pass" : ""}${l.status === "running" && l.next_at ? ` · next ${K.ago(l.next_at)}` : ""}${l.note ? ` · ${K.esc(l.note)}` : ""}${(() => { const t = (l.log || []).filter(e => e.kind === "agent" && e.cost_usd).reduce((acc, e) => acc + parseFloat(e.cost_usd), 0); return t > 0 ? ` · $${t.toFixed(2)} total` : ""; })()} · updated ${K.ago(l.updated_at)}</div>
        <div class="meter" style="margin-top:6px;display:flex;gap:2px">${Array.from({length: l.max_iters}, (_, i) => { const it = iterMap[i + 1]; const c = !it ? "var(--line)" : it.hasCmd ? (it.passed ? "var(--green)" : "var(--red)") : "var(--accent)"; return `<span style="flex:1;height:100%;background:${c};border-radius:3px"></span>`; }).join("")}</div>
      </div>
      <div class="acts">
        ${l.status === "running" ? `<button class="sm" data-a="stop">stop</button>` : `<button class="sm" data-a="start">start</button>`}
        <button class="sm danger" data-a="del">delete</button>
      </div>
      <div style="flex-basis:100%">${log}</div>
    </div>`;
  }).join("");
}

async function load() {
  if (!K.token) { last = { error: "Loops are owner-only (their log is raw host terminal output). Sign in to build as the owner." }; return render(); }
  const r = await K.api("/loops");
  last = r.ok ? r.data : { error: r.data?.error || `failed (${r.status})` };
  render();
}

document.getElementById("list").addEventListener("click", async (e) => {
  const row = e.target.closest(".row"); if (!row) return;
  const id = row.dataset.id, a = e.target.closest("button")?.dataset.a;
  if (!a) { open.has(id) ? open.delete(id) : open.add(id); return render(); }
  if (a === "start") await K.act(`/loops/${id}/start`, {}, "started");
  if (a === "stop") await K.act(`/loops/${id}/stop`, {}, "stopped");
  if (a === "del" && await K.ask("Delete this loop and its log?", "Delete", true)) await K.act(`/loops/${id}`, undefined, "deleted", "DELETE");
  load();
});

const form = document.getElementById("form");
const DEFAULT_GOAL = "Improve this module: read it, find the most valuable bug fix or improvement, make it, and keep its tests passing. Small, safe steps. Say what you changed.";
const goalEl = document.getElementById("f_goal");
goalEl.value = DEFAULT_GOAL;
const modEl = document.getElementById("f_module");
const createBtn = document.getElementById("createBtn");
const syncBtn = () => { createBtn.textContent = modEl.value ? `improve ${modEl.value}` : "create + start"; };
modEl.onchange = syncBtn;
K.api("/modules").then((r) => {
  const mods = (r.data?.modules || []).filter((m) => m.name && !m.name.includes("/") && ["orbit", "core"].includes(m.category));
  const by = {};
  for (const m of mods) (by[m.category] = by[m.category] || []).push(m);
  modEl.innerHTML = `<option value="">pick a mod…</option>` + Object.keys(by).map((t) =>
    `<optgroup label="${K.esc(t)}">${by[t].sort((x, y) => x.name.localeCompare(y.name)).map((m) => `<option value="${K.esc(m.name)}">${K.esc(m.name)}</option>`).join("")}</optgroup>`).join("");
  if (modEl.dataset.want) modEl.value = modEl.dataset.want;
  syncBtn();
}).catch(() => { modEl.innerHTML = `<option value="">mod list unavailable</option>`; });
function openForm(mod) { form.style.display = ""; if (mod) { modEl.dataset.want = mod; modEl.value = mod; syncBtn(); } }
document.getElementById("newBtn").onclick = () => { form.style.display === "none" ? openForm() : (form.style.display = "none"); };
document.getElementById("cancelBtn").onclick = () => { form.style.display = "none"; };
createBtn.onclick = async () => {
  const v = (id) => document.getElementById(id).value.trim();
  if (!v("f_module") && !v("f_cwd")) return K.toast("pick a mod first", true);
  const body = {
    name: v("f_name"), module: v("f_module"), cwd: v("f_cwd"), cmd: v("f_cmd"), goal: v("f_goal"), model: v("f_model"),
    every_secs: +v("f_every") || 60, max_iters: +v("f_max") || 5, until_pass: document.getElementById("f_until").checked,
  };
  const made = await K.act("/loops", body, "loop created");
  if (!made) return;
  const id = made.id || made.loop?.id;
  if (id && made.loop?.status !== "running" && made.status !== "running") await K.act(`/loops/${id}/start`, {}, "started");
  form.style.display = "none";
  goalEl.value = DEFAULT_GOAL;
  load();
};

// Prefill from ?cmd=&module=&cwd= (e.g. a link from a terminal).
const q = new URLSearchParams(location.search);
for (const k of ["cmd", "cwd", "goal", "name"]) if (q.get(k)) { document.getElementById("f_" + k).value = q.get(k); form.style.display = ""; }
if (q.get("module")) openForm(q.get("module"));

K.init({ glyph: "⟳", title: "Loops", accent: "#5fd3b8", sub: "Run a command in a module, hand its output to an agent, wait, repeat — until it passes, the agent says LOOP_DONE, or you stop it." })
  .then(() => K.poll(load, 4000));
</script>
</body>
</html>
