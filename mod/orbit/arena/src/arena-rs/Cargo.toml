[package]
name = "arena-rs"
version = "1.0.0"
edition = "2021"
description = "Wasm storage and execution layer with an MCP server — the arena mod's backend"

[[bin]]
name = "arena-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
opt-level = 2
strip = true

# The example pack is built separately (src/examples/build.sh) for
# wasm32-unknown-unknown, so it must not be pulled into this workspace.
[workspace]
