<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0f14; --card:#121820; --line:#1f2a36; --fg:#d7e2ec; --dim:#7d8fa1; --a:#55e0c8; --b:#ffb454; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,Menlo,Consolas,monospace; text-align:center; }
  #st { margin:6px 0 14px; color:var(--dim); min-height:21px; } #st.turn { color:var(--a); font-weight:700; } #st.over { color:var(--fg); font-weight:700; }
  button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--a); color:var(--a); } button:disabled { opacity:.35; cursor:default; }
  button.go { background:var(--a); color:var(--bg); border-color:var(--a); font-weight:700; }
  .t { letter-spacing:3px; font-size:12px; color:var(--dim); }
</style>
<title>ROCK · PAPER · SCISSORS</title><style>
#hand { display:flex; gap:12px; justify-content:center; } #hand button { width:110px; height:110px; font-size:15px; font-weight:700; border-radius:18px; }
#hand button span { display:block; font-size:34px; } #score { font-size:28px; font-weight:800; margin:10px 0; } #hist { color:var(--dim); font-size:12px; }</style></head><body>
<div class=t>ROCK · PAPER · SCISSORS</div><div id=st>waiting for the table…</div>
<div id=score>0 : 0</div><div id=round class=t></div><p></p><div id=hand></div><p id=hist></p>
<p><button id=again class=go onclick="send({arena:'new'})">start a game</button></p>
<script>
const $ = (id) => document.getElementById(id);
const send = (m) => parent.postMessage({ protocol: "arena-frontend/1", ...m }, "*");
const move = (mv) => send({ arena: "move", move: String(mv) });
let S = {};
function head(msg) {
  $("st").textContent = msg.status || "";
  $("st").className = msg.done ? "over" : msg.your_turn ? "turn" : "";
  $("again").hidden = msg.started && !msg.done;
  $("again").textContent = msg.started ? "play again" : "start a game";
}
addEventListener("message", (e) => { if (e.source === parent && e.data?.arena === "state") { S = e.data; head(S); draw(S); } });
new ResizeObserver(() => send({ arena: "height", px: document.documentElement.scrollHeight })).observe(document.body);
send({ arena: "ready" });

const ICON = { rock: "R", paper: "P", scissors: "S" };
function draw(m) {
  const v = m.view || "";
  const sc = /score:\s*you\s*(\d+),\s*opponent\s*(\d+)/i.exec(v);
  if (sc) $("score").textContent = `${sc[1]} : ${sc[2]}`;
  if (m.done && Array.isArray(m.result?.scores ?? m.result)) $("score").textContent = (m.result.scores ?? m.result).join(" : ");
  $("round").textContent = (/round\s+\d+\s+of\s+\d+/i.exec(v) || [""])[0];
  $("hand").replaceChildren(...["rock", "paper", "scissors"].map((t) => {
    const b = document.createElement("button"); b.disabled = !m.your_turn;
    b.innerHTML = `<span>${ICON[t]}</span>`; b.append(t); b.onclick = () => move(t); return b;
  }));
  $("hist").textContent = (m.log || []).filter((l) => /plays/.test(l)).slice(0, 5).join("\n");
}
</script></body></html>
