[package]
name = "chutes-rs"
version = "4.0.0"
edition = "2021"
description = "chutes.ai serverless GPU inference — Rust MCP server backend for the chutes mod"

[[bin]]
name = "chutes-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
# owner.rs — mod-protocol token verification (EIP-191 personal_sign) for POST /key
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 2
strip = true
