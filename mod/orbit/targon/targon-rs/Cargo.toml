[package]
name = "targon-rs"
version = "1.2.0"
edition = "2021"
description = "Targon (Bittensor SN4) compute MCP server — Rust backend for the targon mod"

[[bin]]
name = "targon-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
# Chain-side wallet: SS58 decoding and the one storage-key hash we need.
blake2 = "0.10"
bs58 = "0.5"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
opt-level = 2
strip = true
