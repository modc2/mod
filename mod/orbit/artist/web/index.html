<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>artist</title>
<style>
  :root {
    --bg: #0d0d0f; --panel: #141417; --edge: #26262b; --ink: #e8e8ea;
    --dim: #8a8a92; --accent: #7bd88f; --video: #5fa8f5; --audio: #c792ea;
    --image: #f5c518; --danger: #f07178;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); height: 100vh; overflow: hidden;
    font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--edge); flex: none;
  }
  header .mark { color: var(--accent); font-weight: 700; letter-spacing: .08em; }
  header input#pname {
    background: var(--panel); border: 1px solid var(--edge); color: var(--ink);
    padding: 6px 10px; border-radius: 6px; width: 220px; font: inherit;
  }
  .btn {
    background: var(--panel); border: 1px solid var(--edge); color: var(--ink);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit;
    letter-spacing: .04em;
  }
  .btn:hover { border-color: var(--dim); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .4; cursor: default; }
  #status { margin-left: auto; color: var(--dim); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }

  /* library rail */
  #library {
    width: 260px; flex: none; border-right: 1px solid var(--edge);
    display: flex; flex-direction: column; min-height: 0;
  }
  #library h2, #stage h2 {
    font-size: 11px; color: var(--dim); letter-spacing: .15em; font-weight: 600;
    padding: 10px 14px 6px;
  }
  #drop {
    margin: 0 12px 10px; padding: 14px; border: 1px dashed var(--edge);
    border-radius: 8px; color: var(--dim); text-align: center; font-size: 12px;
    cursor: pointer;
  }
  #drop.hot { border-color: var(--accent); color: var(--accent); }
  #assets { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .asset {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
    margin-bottom: 6px; cursor: grab;
  }
  .asset .kind {
    flex: none; width: 20px; height: 20px; border-radius: 5px; font-size: 11px;
    display: flex; align-items: center; justify-content: center; color: #0d0d0f;
    font-weight: 700;
  }
  .asset[data-kind=video] .kind { background: var(--video); }
  .asset[data-kind=audio] .kind { background: var(--audio); }
  .asset[data-kind=image] .kind { background: var(--image); }
  .asset .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .asset .size { color: var(--dim); font-size: 11px; flex: none; }

  /* stage */
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #previewwrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 14px; }
  #preview { max-width: 100%; max-height: 100%; background: #000; border-radius: 8px; aspect-ratio: 16/9; }

  /* timeline */
  #timeline { flex: none; border-top: 1px solid var(--edge); padding-bottom: 12px; }
  .lane { display: flex; align-items: center; gap: 8px; padding: 6px 14px; }
  .lane .label { width: 48px; flex: none; font-size: 11px; color: var(--dim); letter-spacing: .12em; }
  .lane .clips {
    flex: 1; display: flex; gap: 6px; min-height: 52px; align-items: center;
    background: var(--panel); border: 1px dashed var(--edge); border-radius: 8px;
    padding: 6px; overflow-x: auto;
  }
  .lane .clips.hot { border-color: var(--accent); }
  .lane .clips:empty::after { content: attr(data-hint); color: var(--dim); font-size: 12px; padding-left: 8px; }
  .clip {
    flex: none; position: relative; padding: 8px 26px 8px 10px; border-radius: 7px;
    font-size: 12px; max-width: 170px; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; cursor: grab; color: #0d0d0f; font-weight: 600;
  }
  .clip[data-kind=video] { background: var(--video); }
  .clip[data-kind=audio] { background: var(--audio); }
  .clip[data-kind=image] { background: var(--image); }
  .clip .x {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: 4px; border: none; cursor: pointer;
    background: rgba(0,0,0,.25); color: #0d0d0f; font: 700 11px/1 inherit;
  }
  .clip .dur {
    display: inline-block; margin-left: 6px; background: rgba(0,0,0,.2);
    border-radius: 4px; padding: 0 4px; font-size: 10px;
  }
  .clip.drag { opacity: .4; }
  #projects { padding: 4px 14px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .pchip {
    font-size: 11px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--edge); color: var(--dim);
  }
  .pchip.on { color: var(--accent); border-color: var(--accent); }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <span class="mark">ARTIST</span>
  <input id="pname" placeholder="untitled cut" spellcheck="false">
  <button class="btn" id="save">SAVE</button>
  <button class="btn primary" id="export">EXPORT</button>
  <button class="btn" id="render" hidden>RENDER</button>
  <button class="btn" id="play">PLAY</button>
  <span id="status">loading</span>
</header>
<main>
  <aside id="library">
    <h2>LIBRARY</h2>
    <div id="drop">drop video, music or images here<br>(or click to pick)</div>
    <input type="file" id="pick" multiple accept="video/*,audio/*,image/*">
    <div id="assets"></div>
  </aside>
  <section id="stage">
    <div id="previewwrap"><canvas id="preview" width="1280" height="720"></canvas></div>
    <div id="timeline">
      <h2>TIMELINE</h2>
      <div class="lane"><span class="label">VIDEO</span>
        <div class="clips" id="vlane" data-hint="drag picture here — videos and images play in order"></div></div>
      <div class="lane"><span class="label">AUDIO</span>
        <div class="clips" id="alane" data-hint="drag sound here — music and voice play in order"></div></div>
      <div id="projects"></div>
    </div>
  </section>
</main>
<video id="vel" hidden playsinline></video>
<audio id="ael" hidden></audio>
<script>
'use strict';
// Served under /artist/ — every call is relative, so the same bundle works
// direct on the port and behind the gateway.
const api = (fn, opts) => fetch('api/' + fn, opts).then(r => r.json());
const $ = id => document.getElementById(id);
const status = (t) => { $('status').textContent = t; };

let ASSETS = {};                       // id → asset row
let TL = { video: [], audio: [] };     // the cut
let PID = null;                        // current project id
let FFMPEG = false;

const fmtB = n => n > 1e6 ? (n / 1e6).toFixed(1) + 'MB' : Math.round(n / 1e3) + 'KB';

// ── library ───────────────────────────────────────────────────
async function loadAssets() {
  const r = await api('assets');
  ASSETS = {};
  const box = $('assets');
  box.innerHTML = '';
  for (const a of (r.assets || [])) {
    ASSETS[a.id] = a;
    const el = document.createElement('div');
    el.className = 'asset';
    el.dataset.kind = a.kind;
    el.draggable = true;
    el.innerHTML = `<span class="kind">${a.kind[0].toUpperCase()}</span>` +
      `<span class="name">${a.name}</span><span class="size">${fmtB(a.size)}</span>`;
    el.addEventListener('dragstart', e =>
      e.dataTransfer.setData('text/plain', JSON.stringify({ lib: a.id })));
    box.appendChild(el);
  }
}

async function upload(files) {
  for (const f of files) {
    status('uploading ' + f.name);
    const r = await fetch('api/upload?name=' + encodeURIComponent(f.name),
                          { method: 'POST', body: f });
    const j = await r.json();
    if (j.error) { status(j.error); return; }
  }
  await loadAssets();
  status(files.length + ' file(s) in the library');
}

$('drop').addEventListener('click', () => $('pick').click());
$('pick').addEventListener('change', e => upload([...e.target.files]));
for (const [ev, hot] of [['dragover', 1], ['dragleave', 0], ['drop', 0]])
  $('drop').addEventListener(ev, e => {
    e.preventDefault();
    $('drop').classList.toggle('hot', !!hot);
    if (ev === 'drop' && e.dataTransfer.files.length) upload([...e.dataTransfer.files]);
  });

// ── timeline ──────────────────────────────────────────────────
function laneFor(kind) { return kind === 'audio' ? 'audio' : 'video'; }

function drawTimeline() {
  for (const [lane, elId] of [['video', 'vlane'], ['audio', 'alane']]) {
    const box = $(elId);
    box.innerHTML = '';
    TL[lane].forEach((c, i) => {
      const a = ASSETS[c.asset];
      if (!a) return;
      const el = document.createElement('div');
      el.className = 'clip';
      el.dataset.kind = a.kind;
      el.draggable = true;
      el.textContent = a.name;
      if (a.kind === 'image') {
        const d = document.createElement('span');
        d.className = 'dur';
        d.textContent = (c.dur || 3) + 's';
        d.title = 'click: +1s, double-click: back to 3s';
        d.addEventListener('click', e => {
          e.stopPropagation();
          c.dur = (c.dur || 3) % 10 + 1;  // cycle 1..10 seconds
          drawTimeline();
        });
        el.appendChild(d);
      }
      const x = document.createElement('button');
      x.className = 'x';
      x.textContent = 'x';
      x.addEventListener('click', e => {
        e.stopPropagation();
        TL[lane].splice(i, 1);
        drawTimeline();
      });
      el.appendChild(x);
      el.addEventListener('dragstart', e => {
        el.classList.add('drag');
        e.dataTransfer.setData('text/plain', JSON.stringify({ lane, from: i }));
      });
      el.addEventListener('dragend', () => el.classList.remove('drag'));
      box.appendChild(el);
    });
  }
}

function dropIndex(box, x) {
  const kids = [...box.children];
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (x < r.left + r.width / 2) return i;
  }
  return kids.length;
}

for (const [lane, elId] of [['video', 'vlane'], ['audio', 'alane']]) {
  const box = $(elId);
  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('hot'); });
  box.addEventListener('dragleave', () => box.classList.remove('hot'));
  box.addEventListener('drop', e => {
    e.preventDefault();
    box.classList.remove('hot');
    let msg;
    try { msg = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
    const at = dropIndex(box, e.clientX);
    if (msg.lib) {                             // from the library
      const a = ASSETS[msg.lib];
      if (!a || laneFor(a.kind) !== lane) {
        status(lane === 'video' ? 'that belongs on the AUDIO lane'
                                : 'that belongs on the VIDEO lane');
        return;
      }
      TL[lane].splice(at, 0, { asset: a.id, ...(a.kind === 'image' ? { dur: 3 } : {}) });
    } else if (msg.lane === lane) {            // reorder within the lane
      const [c] = TL[lane].splice(msg.from, 1);
      TL[lane].splice(msg.from < at ? at - 1 : at, 0, c);
    } else return;
    drawTimeline();
  });
}

// ── projects ──────────────────────────────────────────────────
async function loadProjects() {
  const r = await api('projects');
  const box = $('projects');
  box.innerHTML = '';
  for (const p of (r.projects || [])) {
    const el = document.createElement('span');
    el.className = 'pchip' + (p.id === PID ? ' on' : '');
    el.textContent = p.name;
    el.addEventListener('click', async () => {
      const full = await api('project?id=' + p.id);
      if (full.error) { status(full.error); return; }
      PID = full.id;
      $('pname').value = full.name;
      TL = { video: full.timeline.video || [], audio: full.timeline.audio || [] };
      drawTimeline(); loadProjects();
      status('opened ' + full.name);
    });
    box.appendChild(el);
  }
}

$('save').addEventListener('click', async () => {
  const name = $('pname').value.trim() || 'untitled cut';
  const r = await api('save_project', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, timeline: TL, id: PID })
  });
  if (r.error) { status(r.error); return; }
  PID = r.id;
  status('saved ' + r.name);
  loadProjects();
});

// ── the compiler: play the cut into a canvas, optionally record ──
const canvas = $('preview'), ctx2d = canvas.getContext('2d');
const vel = $('vel'), ael = $('ael');
let running = false;

function clipDur(c) {
  const a = ASSETS[c.asset];
  return a && a.kind === 'image' ? (c.dur || 3) : null;  // media length otherwise
}

function playMedia(el, src) {
  return new Promise((res, rej) => {
    el.src = src;
    el.onended = () => res();
    el.onerror = () => rej(new Error('cannot play ' + src));
    el.play().catch(rej);
  });
}

async function runCut(record) {
  if (running) { running = false; return null; }
  if (!TL.video.length && !TL.audio.length) { status('the timeline is empty'); return null; }
  running = true;
  let recorder = null, chunks = [], actx = null;
  if (record) {
    actx = new AudioContext();
    const dest = actx.createMediaStreamDestination();
    actx.createMediaElementSource(vel).connect(dest);
    actx.createMediaElementSource(ael).connect(dest);
    const stream = canvas.captureStream(30);
    for (const t of dest.stream.getAudioTracks()) stream.addTrack(t);
    recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.start(250);
  }
  // audio lane runs alongside, clip after clip
  (async () => {
    for (const c of TL.audio) {
      if (!running) break;
      try { await playMedia(ael, 'media/' + c.asset); } catch { break; }
    }
  })();
  // video lane drives the picture
  let raf;
  const draw = () => {
    if (vel.videoWidth)
      ctx2d.drawImage(vel, 0, 0, canvas.width, canvas.height);
    raf = requestAnimationFrame(draw);
  };
  for (const c of TL.video) {
    if (!running) break;
    const a = ASSETS[c.asset];
    if (!a) continue;
    status((record ? 'compiling ' : 'playing ') + a.name);
    if (a.kind === 'image') {
      const img = new Image();
      await new Promise(res => { img.onload = res; img.onerror = res; img.src = 'media/' + c.asset; });
      const until = performance.now() + (c.dur || 3) * 1000;
      while (running && performance.now() < until) {
        ctx2d.fillStyle = '#000';
        ctx2d.fillRect(0, 0, canvas.width, canvas.height);
        if (img.width) {
          const s = Math.min(canvas.width / img.width, canvas.height / img.height);
          ctx2d.drawImage(img, (canvas.width - img.width * s) / 2,
                          (canvas.height - img.height * s) / 2,
                          img.width * s, img.height * s);
        }
        await new Promise(r => requestAnimationFrame(r));
      }
    } else {
      draw();
      try { await playMedia(vel, 'media/' + c.asset); } catch (e) { status(e.message); }
      cancelAnimationFrame(raf);
    }
  }
  running = false;
  ael.pause(); vel.pause();
  if (recorder) {
    await new Promise(res => { recorder.onstop = res; recorder.stop(); });
    actx.close();
    return new Blob(chunks, { type: 'video/webm' });
  }
  status('done');
  return null;
}

$('play').addEventListener('click', () => runCut(false));

$('export').addEventListener('click', async () => {
  $('export').disabled = true;
  try {
    const blob = await runCut(true);
    if (blob) {
      const aEl = document.createElement('a');
      aEl.href = URL.createObjectURL(blob);
      aEl.download = ($('pname').value.trim() || 'cut') + '.webm';
      aEl.click();
      status('exported ' + fmtB(blob.size) + ' webm — compiled right here, no cloud');
    }
  } finally { $('export').disabled = false; }
});

$('render').addEventListener('click', async () => {
  if (!PID) { status('SAVE first — the server renders a saved project'); return; }
  status('rendering on the server (ffmpeg)');
  const r = await api('render', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: PID })
  });
  status(r.error ? r.error : 'rendered ' + fmtB(r.bytes) + ' mp4 at ' + r.file);
});

// ── boot ──────────────────────────────────────────────────────
(async () => {
  try {
    const h = await api('health');
    FFMPEG = !!h.ffmpeg;
    $('render').hidden = !FFMPEG;
    await loadAssets();
    await loadProjects();
    drawTimeline();
    status('ready — ' + h.assets + ' asset(s), ' + h.projects + ' project(s)');
  } catch (e) { status('api unreachable: ' + e.message); }
})();
</script>
</body>
</html>
