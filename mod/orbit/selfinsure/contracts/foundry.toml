[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
offline = true
# Every number the contract publishes is meant to be read by people, so the
# tests are also the documentation: `forge test -vv` narrates a whole pool.
verbosity = 2
fs_permissions = [{ access = "read", path = "./" }]
