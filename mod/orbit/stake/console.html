<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAKE — BLOC on apps</title>
<style>
  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#161b2a; --line:#232a3d;
    --ink:#e8ecf5; --mute:#8b94ab; --faint:#5a6379;
    --accent:#7c8cf8; --up:#4ade80; --gold:#fbbf24; --down:#f87171;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 18px;
         border-bottom:1px solid var(--line);margin-bottom:18px}
  h1{font:700 20px var(--mono);letter-spacing:2px;margin:0}
  h1 span{color:var(--accent)}
  .sub{color:var(--mute);font-size:12.5px}
  .spacer{flex:1}
  .chip{font:12.5px var(--mono);background:var(--panel);border:1px solid var(--line);
        border-radius:999px;padding:5px 12px;color:var(--mute);white-space:nowrap}
  .chip b{color:var(--ink)}
  .btn{font:600 12.5px var(--mono);letter-spacing:.5px;background:var(--panel2);
       color:var(--ink);border:1px solid var(--line);border-radius:8px;
       padding:8px 14px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0a0d14}
  .btn.quiet{color:var(--mute);padding:6px 10px}
  .btn:disabled{opacity:.45;cursor:default}
  .mine{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
  .card .top{display:flex;align-items:baseline;gap:10px}
  .card .name{font:700 16px var(--mono);letter-spacing:1px}
  .card .ver{color:var(--faint);font:12px var(--mono)}
  .card .desc{color:var(--mute);font-size:12.8px;min-height:38px;
              display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;font:12px var(--mono);color:var(--mute)}
  .meta .stat b{color:var(--ink)}
  .meta .gold b{color:var(--gold)}
  .meta .mine-amt b{color:var(--up)}
  .row{display:flex;gap:8px;align-items:center}
  .amt{font:13px var(--mono);background:var(--panel2);border:1px solid var(--line);
       color:var(--ink);border-radius:8px;padding:8px 10px;width:110px}
  .amt:focus{outline:none;border-color:var(--accent)}
  .more{border-top:1px dashed var(--line);padding-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .note{font:12px var(--mono);color:var(--faint)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
         background:var(--panel2);border:1px solid var(--line);border-radius:10px;
         padding:10px 18px;font:13px var(--mono);max-width:90vw;display:none;z-index:9}
  .toast.err{border-color:var(--down);color:var(--down)}
  .toast.ok{border-color:var(--up)}
  .empty{color:var(--faint);font:13px var(--mono);padding:40px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>STAKE <span>/</span> BLOC ON APPS</h1>
      <div class="sub">back the apps in the registry with BlocTime &middot; unstake any time &middot; rewards split pro-rata</div>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="fleet">total staked <b>&mdash;</b></span>
    <span class="chip" id="bal" style="display:none">balance <b>&mdash;</b> BLOC</span>
    <button class="btn primary" id="connect">CONNECT WALLET</button>
  </header>

  <div class="mine" id="mine"></div>
  <div class="grid" id="grid"><div class="empty">loading apps&hellip;</div></div>
  <p class="note" style="margin-top:26px">
    AppStaking on Base Sepolia &middot; <a id="explorer" target="_blank" rel="noopener">contract &nearr;</a>
    &middot; staking pulls BLOC into the contract (one-time approve first); unstake is never locked.
  </p>
</div>
<div class="toast" id="toast"></div>

<script>
const API = location.pathname.startsWith('/stake') ? '/stake' : '';
// vendored ethers must load from the same base the page was served under
document.write('<scr'+'ipt src="'+API+'/static/ethers.umd.min.js"><\/scr'+'ipt>');
</script>
<script>
const $ = id => document.getElementById(id);
const fmt = n => (+n).toLocaleString('en-US', {maximumFractionDigits: 2});
let CONTRACT = null, APPS = [], POS = null, ADDR = null;

function toast(msg, cls) {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast ' + (cls || ''); t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 6000);
}

async function jget(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  return r.json();
}

async function loadAll() {
  const [c, a] = await Promise.all([jget('/contract'), jget('/apps')]);
  CONTRACT = c; APPS = a.apps;
  $('explorer').href = c.explorer;
  $('fleet').innerHTML = 'total staked <b>' + fmt(a.total_staked) + '</b> BLOC';
  if (ADDR) POS = await jget('/positions?address=' + ADDR).catch(() => null);
  render();
}

function posFor(id) {
  return (POS && POS.positions.find(p => p.id === id)) || null;
}

function render() {
  const max = Math.max(1, ...APPS.map(a => a.staked || 0));
  const grid = $('grid');
  if (!APPS.length) { grid.innerHTML = '<div class="empty">no apps registered yet</div>'; return; }
  grid.innerHTML = APPS.map(a => {
    const p = posFor(a.id);
    return `
    <div class="card" data-id="${a.id}">
      <div class="top">
        <span class="name">${a.name}</span>
        <span class="ver">#${a.id}${a.version ? ' · v' + a.version : ''}</span>
      </div>
      <div class="desc">${a.description || 'registered by ' + a.owner.slice(0, 6) + '…' + a.owner.slice(-4)}</div>
      <div class="bar"><i style="width:${Math.max(2, 100 * (a.staked || 0) / max)}%"></i></div>
      <div class="meta">
        <span class="stat"><b>${fmt(a.staked || 0)}</b> BLOC staked</span>
        <span class="stat"><b>${a.stakers || 0}</b> backer${a.stakers === 1 ? '' : 's'}</span>
        ${a.rewarded ? `<span class="stat gold"><b>${fmt(a.rewarded)}</b> rewarded</span>` : ''}
        ${p && p.staked ? `<span class="stat mine-amt">yours <b>${fmt(p.staked)}</b></span>` : ''}
        ${p && p.claimable ? `<span class="stat gold">claimable <b>${fmt(p.claimable)}</b></span>` : ''}
      </div>
      <div class="row">
        <input class="amt" type="number" min="0" step="any" placeholder="BLOC" data-amt="${a.id}">
        <button class="btn primary" data-stake="${a.id}">STAKE</button>
        <span class="spacer" style="flex:1"></span>
        <button class="btn quiet" data-more="${a.id}">MORE</button>
      </div>
      <div class="more" data-panel="${a.id}" style="display:none">
        <button class="btn" data-unstake="${a.id}" ${p && p.staked ? '' : 'disabled'}>UNSTAKE ALL</button>
        <button class="btn" data-claim="${a.id}" ${p && p.claimable ? '' : 'disabled'}>CLAIM</button>
        <button class="btn" data-reward="${a.id}">REWARD STAKERS</button>
      </div>
    </div>`;
  }).join('');

  const mine = $('mine');
  if (POS && POS.positions.length) {
    mine.innerHTML = '<span class="chip">my stakes <b>' + fmt(POS.total_staked) + '</b> BLOC</span>'
      + (POS.total_claimable ? '<span class="chip">claimable <b style="color:var(--gold)">'
         + fmt(POS.total_claimable) + '</b> BLOC</span>' : '')
      + POS.positions.map(p => '<span class="chip">' + p.name + ' <b>' + fmt(p.staked) + '</b></span>').join('');
  } else mine.innerHTML = '';
}

// ------------------------------------------------------------------- wallet
async function ensureChain(eth) {
  const hex = '0x' + (84532).toString(16);
  try {
    await eth.request({method: 'wallet_switchEthereumChain', params: [{chainId: hex}]});
  } catch (e) {
    if (e.code === 4902) {
      await eth.request({method: 'wallet_addEthereumChain', params: [{
        chainId: hex, chainName: 'Base Sepolia',
        nativeCurrency: {name: 'ETH', symbol: 'ETH', decimals: 18},
        rpcUrls: ['https://sepolia.base.org'],
        blockExplorerUrls: ['https://sepolia.basescan.org']}]});
    } else throw e;
  }
}

async function connect() {
  if (!window.ethereum) { toast('no wallet found — install MetaMask or open in a wallet browser', 'err'); return; }
  await ensureChain(window.ethereum);
  const accounts = await window.ethereum.request({method: 'eth_requestAccounts'});
  ADDR = ethers.getAddress(accounts[0]);
  $('connect').textContent = ADDR.slice(0, 6) + '…' + ADDR.slice(-4);
  POS = await jget('/positions?address=' + ADDR).catch(() => null);
  if (POS) { $('bal').style.display = ''; $('bal').innerHTML = 'balance <b>' + fmt(POS.bloc_balance) + '</b> BLOC'; }
  render();
}

async function signer() {
  if (!ADDR) { await connect(); if (!ADDR) throw new Error('connect a wallet first'); }
  await ensureChain(window.ethereum);
  return new ethers.BrowserProvider(window.ethereum).getSigner(ADDR);
}

async function withStaking(fn) {
  const s = await signer();
  const stakingC = new ethers.Contract(CONTRACT.AppStaking.address, CONTRACT.AppStaking.abi, s);
  const blocC = new ethers.Contract(CONTRACT.BlocTime.address, CONTRACT.BlocTime.abi, s);
  return fn(stakingC, blocC);
}

async function act(label, fn) {
  try {
    toast(label + '… confirm in wallet');
    await withStaking(fn);
    toast(label + ' confirmed', 'ok');
    setTimeout(loadAll, 1500);
  } catch (e) {
    toast((e.shortMessage || e.reason || e.message || 'failed').slice(0, 160), 'err');
  }
}

async function ensureAllowance(stakingC, blocC, wei) {
  const cur = await blocC.allowance(ADDR, CONTRACT.AppStaking.address);
  if (cur < wei) {
    toast('approving BLOC… confirm in wallet');
    await (await blocC.approve(CONTRACT.AppStaking.address, ethers.MaxUint256)).wait();
  }
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  const amtOf = id => {
    const v = parseFloat(document.querySelector(`[data-amt="${id}"]`).value);
    if (!(v > 0)) { toast('enter a BLOC amount first', 'err'); return null; }
    return ethers.parseEther(String(v));
  };
  if (b.dataset.more) {
    const p = document.querySelector(`[data-panel="${b.dataset.more}"]`);
    p.style.display = p.style.display === 'none' ? 'flex' : 'none';
  } else if (b.dataset.stake) {
    const id = +b.dataset.stake, wei = amtOf(id);
    if (wei) act('stake', async (s, t) => { await ensureAllowance(s, t, wei); await (await s.stake(id, wei)).wait(); });
  } else if (b.dataset.unstake) {
    const id = +b.dataset.unstake;
    act('unstake', async s => { await (await s.unstake(id, 0)).wait(); });
  } else if (b.dataset.claim) {
    const id = +b.dataset.claim;
    act('claim', async s => { await (await s.claim(id)).wait(); });
  } else if (b.dataset.reward) {
    const id = +b.dataset.reward, wei = amtOf(id);
    if (wei) act('reward', async (s, t) => { await ensureAllowance(s, t, wei); await (await s.reward(id, wei)).wait(); });
  }
});
$('connect').onclick = () => connect().catch(e => toast(e.message, 'err'));
loadAll().catch(e => { $('grid').innerHTML = '<div class="empty">API not answering: ' + e.message + '</div>'; });
</script>
</body>
</html>
