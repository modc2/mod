<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>contract</title>
<style>
  :root{
    --bg:#050807; --panel:#0a120eee; --line:#16291f; --line2:#1f3a2c;
    --ink:#dcefe3; --dim:#5f8a72; --dimmer:#3d5c4a;
    --hot:#00ec97; --hot2:#6ef0be; --hot3:#00c27d; --ink2:#b6d8c4;
    --good:#3fd68c; --warn:#fbbf24; --bad:#f87171; --violet:#8b7bf0;
  }
  *{box-sizing:border-box}
  html{scrollbar-color:#1f3a2c #050807}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
       font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(600px 400px at 85% -10%, #00ec9714, transparent 70%),
               radial-gradient(700px 500px at -10% 30%, #00ec970d, transparent 70%)}
  header{display:flex;align-items:center;gap:12px;padding:11px 18px;
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9;
         background:#050807e6;backdrop-filter:blur(8px);flex-wrap:wrap}
  h1{font-size:15px;margin:0;letter-spacing:.06em;display:flex;align-items:center;gap:8px;
     overflow-wrap:anywhere}
  h1 .tri{color:var(--hot);text-shadow:0 0 14px #00ec9780}
  h1 b{color:var(--hot2);font-weight:600}
  h1 a{color:var(--dim);text-decoration:none;font-size:11px;letter-spacing:.14em}
  h1 a:hover{color:var(--hot)}
  .sub{color:var(--dim);font-size:11px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--hot);box-shadow:0 0 8px var(--hot);
       animation:pulse 2.2s infinite}
  .dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad);animation:none}
  .dot.wait{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--dim);padding:5px 12px;cursor:pointer;
              font:inherit;font-size:10px;letter-spacing:.12em}
  .seg button.on{background:var(--hot);color:#02120a;font-weight:700}
  .seg button.on.tn{background:var(--warn)}
  .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #signer{border:1px solid var(--line2);border-radius:3px;padding:5px 11px;font-size:10px;
    letter-spacing:.08em;color:var(--hot2);background:#0a120e;display:inline-flex;gap:7px;
    align-items:center}
  #signer .k{color:var(--dimmer)} #signer.none{color:var(--dim);border-style:dashed}
  main{padding:16px 18px 80px;max-width:1500px;margin:0 auto;display:grid;
       grid-template-columns:260px minmax(0,1fr);gap:18px}
  @media(max-width:860px){main{grid-template-columns:minmax(0,1fr)} aside{position:static!important}}
  aside{position:sticky;top:62px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
  input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--ink);
      padding:7px 10px;font:inherit;border-radius:2px;width:100%;
      transition:border-color .15s, box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--hot);
      box-shadow:0 0 0 1px #00ec9740, 0 0 18px #00ec971a}
  ::placeholder{color:var(--dimmer)}
  textarea{min-height:58px;resize:vertical}
  button.go{background:linear-gradient(180deg,var(--hot),var(--hot3));color:#02120a;border:0;
      padding:8px 18px;cursor:pointer;font:inherit;font-weight:700;letter-spacing:.1em;
      border-radius:2px;box-shadow:0 0 16px #00ec9730;transition:box-shadow .15s}
  button.go:hover{box-shadow:0 0 26px #00ec9760}
  button.go:disabled{opacity:.45;cursor:wait;box-shadow:none}
  button.go.warn{background:linear-gradient(180deg,var(--warn),#d19a08);box-shadow:0 0 16px #fbbf2430}
  button.go.vio{background:linear-gradient(180deg,var(--violet),#5f4fd0);color:#fff;box-shadow:0 0 16px #8b7bf030}
  button.ghost{background:none;border:1px solid var(--line);color:var(--ink);padding:4px 10px;
      cursor:pointer;font:inherit;font-size:11px;border-radius:2px}
  button.ghost:hover{border-color:var(--hot);color:var(--hot)}
  .p{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:10px;
     font-size:10px;color:var(--dim);margin:1px 3px 1px 0;white-space:nowrap}
  .p.view{color:var(--good);border-color:#164a33}
  .p.change{color:var(--warn);border-color:#4a3c14}
  .p.init{color:var(--violet);border-color:#332d5e}
  .p.unknown{color:var(--dim);border-style:dashed}
  .p.hot{color:var(--hot);border-color:#12503a}
  .p.bad{color:var(--bad);border-color:#4a1d1d}
  .dimtxt{color:var(--dim)}
  .note{color:var(--dim);font-size:11px;margin:6px 0}
  .flash{color:var(--warn);font-size:11px;min-height:16px}
  pre{background:var(--panel);border:1px solid var(--line);padding:10px;overflow:auto;
      font-size:11px;max-height:50vh;white-space:pre-wrap;word-break:break-word;margin:0;border-radius:3px}

  /* sidebar */
  .side h2{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;
           margin:14px 0 6px;display:flex;gap:8px;align-items:baseline}
  .side h2::before{content:'◆';color:var(--hot);font-size:8px}
  .side h2 b{color:var(--ink2);font-weight:400;letter-spacing:0}
  .mlist{display:flex;flex-direction:column;gap:1px}
  .mlist a{color:var(--ink2);text-decoration:none;padding:3px 8px;border-radius:2px;
           font-size:11px;display:flex;gap:6px;align-items:center;cursor:pointer;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mlist a:hover{background:#0c1712;color:var(--hot)}
  .mlist a i{width:5px;height:5px;border-radius:50%;flex:none;background:var(--dim)}
  .mlist a.view i{background:var(--good)} .mlist a.change i{background:var(--warn)}
  .mlist a.init i{background:var(--violet)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
  .stat{background:var(--panel);border:1px solid var(--line);padding:7px 9px;border-radius:3px}
  .stat h3{margin:0;font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  .stat .v{font-size:15px;color:var(--ink2)}

  /* method cards */
  .mcard{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:13px 15px;
         margin-bottom:12px;position:relative;scroll-margin-top:70px;
         transition:border-color .15s,box-shadow .15s}
  .mcard::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
         background:var(--cat,var(--dim));opacity:.8;border-radius:5px 0 0 5px}
  .mcard.view{--cat:var(--good)} .mcard.change{--cat:var(--warn)} .mcard.init{--cat:var(--violet)}
  .mcard:target,.mcard.lit{border-color:var(--hot);box-shadow:0 0 22px #00ec9720}
  .mhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .mhead .nm{font-size:14px;color:var(--ink);font-weight:600;letter-spacing:.02em}
  .mhead .nm .paren{color:var(--dimmer);font-weight:400}
  .mhead .conf{color:var(--dimmer);font-size:10px;margin-left:auto}
  .mdoc{color:var(--dim);font-size:11px;margin:0 0 8px;white-space:pre-wrap}
  .args{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:8px 0}
  .arg label{display:block;font-size:10px;color:var(--dim);letter-spacing:.08em;margin-bottom:3px}
  .arg label b{color:var(--ink2);font-weight:400}
  .arg label .ty{color:var(--dimmer)}
  .arg label .opt{color:var(--dimmer);font-style:italic}
  .arg.wide{grid-column:1/-1}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .row input{width:auto}
  .row .confirmwrap{display:none;color:var(--warn);font-size:11px;align-items:center;gap:5px}
  .row .confirmwrap input{width:auto}
  .noargs{color:var(--dimmer);font-size:11px;margin:4px 0 6px}
  .mout{margin-top:10px;display:none}
  .mout .r{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px;font-size:11px}
  .mout .r a{color:var(--hot2)}
  .hide{display:none!important}
  .kbd{color:var(--hot2);font-size:11px}
  #rawspec{margin-top:10px}
  .tokenbox{display:flex;gap:6px;align-items:center}
  .tokenbox input{width:200px}
  .empty{color:var(--dim);padding:28px 0;font-size:12px}
  .skel{height:84px;background:linear-gradient(90deg,#0a120e,#0f1b15,#0a120e);
        background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:5px;margin-bottom:12px}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <h1><span class="tri">▲</span> <b id="cid">contract</b></h1>
  <span class="sub"><span class="dot wait" id="dot"></span><span id="state">loading</span></span>
  <div class="right">
    <div class="seg" id="netseg">
      <button data-net="mainnet">MAINNET</button>
      <button data-net="testnet">TESTNET</button>
    </div>
    <span id="signer" class="none"><span class="k">signer</span><span id="signer-id">none</span></span>
    <button class="ghost" id="reinfer" title="ignore the cache and probe again">RE-INFER</button>
    <button class="ghost" id="showjson">JSON</button>
    <a id="console-link" class="ghost" style="text-decoration:none;padding:4px 10px;font-size:11px;border:1px solid var(--line);border-radius:2px;color:var(--ink)">CONSOLE</a>
  </div>
</header>

<main>
<aside class="side">
  <div class="stats" id="stats"></div>
  <div id="stdpills"></div>
  <div class="note" id="srcnote"></div>
  <input id="filter" placeholder="filter methods…" style="margin:8px 0">
  <div id="side"></div>
</aside>

<div>
  <div id="tokenrow" class="note hide">
    <div class="tokenbox">change calls need the remote-write token from
      <span class="kbd">~/.mod/near/token</span>:
      <input id="token" type="password" placeholder="token">
      <button class="ghost" id="tokensave">SAVE</button>
    </div>
  </div>
  <div class="flash" id="flash"></div>
  <pre id="rawspec" class="hide"></pre>
  <div id="cards"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</div>
</main>

<script>
'use strict';
// URL shape: <base>/c/<contract>[?network=testnet]. The API is <base>/_api,
// so this page works mounted at /near behind the gateway or bare on :50910.
const path = location.pathname.replace(/\/$/, '');
const m = path.match(/^(.*)\/c(?:\/([^/]+))?$/);
const BASE = m ? m[1] : path;
const API = BASE + '/_api';
const CONTRACT = decodeURIComponent((m && m[2]) || new URLSearchParams(location.search).get('contract') || '').toLowerCase();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let NET = new URLSearchParams(location.search).get('network') || localStorage.getItem('near_net') || 'mainnet';
if (!['mainnet','testnet'].includes(NET)) NET = 'mainnet';
let SPEC = null;
const EXPLORER = {mainnet:'https://nearblocks.io', testnet:'https://testnet.nearblocks.io'};

async function j(p) {
  const r = await fetch(API + p);
  const b = await r.json().catch(() => ({error:'bad JSON from ' + p}));
  if (!r.ok) throw Object.assign(new Error(b.error || r.status), {detail: b.detail});
  return b;
}
async function jp(p, body) {
  const token = localStorage.getItem('near_token') || '';
  const r = await fetch(API + p, {method:'POST', headers:{'content-type':'application/json'},
                                  body: JSON.stringify({token, ...body})});
  const b = await r.json().catch(() => ({error:'bad JSON from ' + p}));
  if (!r.ok) throw Object.assign(new Error(b.error || r.status), {detail: b.detail});
  return b;
}

function paintNet() {
  document.querySelectorAll('#netseg button').forEach(b => {
    b.classList.toggle('on', b.dataset.net === NET);
    b.classList.toggle('tn', b.dataset.net === NET && NET === 'testnet');
  });
}
document.querySelectorAll('#netseg button').forEach(b => b.onclick = () => {
  NET = b.dataset.net; localStorage.setItem('near_net', NET); paintNet();
  const u = new URL(location.href); u.searchParams.set('network', NET); history.replaceState(null, '', u);
  load(); loadSigner();
});

async function loadSigner() {
  try {
    const w = await j('/wallet?op=status');
    const me = (w.accounts || []).find(a => a.network === NET && a.default) ||
               (w.accounts || []).find(a => a.network === NET);
    $('signer-id').textContent = me ? me.account_id : 'none on ' + NET;
    $('signer').classList.toggle('none', !me);
  } catch (e) { $('signer-id').textContent = 'none'; }
}

function tokenState() {
  $('tokenrow').classList.toggle('hide', !!localStorage.getItem('near_token'));
}
$('tokensave').onclick = () => {
  localStorage.setItem('near_token', $('token').value.trim()); $('token').value = ''; tokenState();
};

$('cid').textContent = CONTRACT || 'no contract in the URL';
document.title = (CONTRACT || 'contract') + ' · near';
$('console-link').href = BASE + '/';
paintNet(); tokenState(); loadSigner();

async function load(refresh) {
  if (!CONTRACT) { $('cards').innerHTML = '<div class="empty">open this page as /c/&lt;contract&gt;</div>'; return; }
  $('dot').className = 'dot wait'; $('state').textContent = refresh ? 'probing every method…' : 'inferring interface…';
  $('cards').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  $('flash').textContent = ''; $('side').innerHTML = ''; $('stats').innerHTML = '';
  try {
    SPEC = await j('/abi?account_id=' + encodeURIComponent(CONTRACT) + '&network=' + NET + (refresh ? '&refresh=true' : ''));
    if (!SPEC.is_contract && SPEC.is_contract !== undefined) {
      $('dot').className = 'dot off'; $('state').textContent = 'no contract';
      $('cards').innerHTML = `<div class="empty">${esc(CONTRACT)} has no code on ${esc(NET)} — an account, not a contract.</div>`;
      return;
    }
    render();
  } catch (e) {
    $('dot').className = 'dot off'; $('state').textContent = 'error';
    $('cards').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

const KIND_ORDER = ['view', 'change', 'init', 'unknown'];
const kindOf = m => KIND_ORDER.includes(m.kind) ? m.kind : 'unknown';
const conf = c => c >= 1 ? 'exact' : c >= 0.9 ? 'probed' : c >= 0.8 ? 'standard' : c >= 0.6 ? 'likely' : 'guess';

function render() {
  const s = SPEC;
  const k = s.kinds || {};
  $('dot').className = 'dot';
  $('state').textContent = `${s.method_count} methods · ${s.sources.includes('abi') ? 'embedded ABI' : 'inferred'}` +
    (s.cached ? ' · cached' : ` · ${s.took_s}s`);
  $('stats').innerHTML =
    stat('view', k.view || 0) + stat('change', k.change || 0) +
    stat('init', k.init || 0) + stat('unsure', k.unknown || 0);
  $('stdpills').innerHTML = (s.standards || []).map(x => `<span class="p hot">${esc(x)}</span>`).join('') +
    (s.metadata && s.metadata.version ? `<span class="p">v${esc(s.metadata.version)}</span>` : '') +
    (s.metadata && s.metadata.link ? `<a class="p" href="${esc(s.metadata.link)}" target="_blank" rel="noopener" style="text-decoration:none">source ↗</a>` : '');
  $('srcnote').innerHTML = s.sources.includes('abi')
    ? 'This contract ships its ABI (cargo-near). Every method, argument and type below is exact.'
    : 'No ABI on chain. Each method was called as a view and the panic read back: ' +
      '<span class="p view">view</span> answered, <span class="p change">change</span> refused to run ' +
      'read-only or demanded a deposit, "missing field" named the arguments. ' +
      (s.sources.includes('history') ? 'Examples come from real recent calls.' : '') +
      (s.abi_error ? `<br>${esc(s.abi_error)}` : '');
  $('rawspec').textContent = JSON.stringify(s, null, 2);
  paintSide(); paintCards();
}
const stat = (t, v) => `<div class="stat"><h3>${t}</h3><div class="v">${v}</div></div>`;

function visible() {
  const q = $('filter').value.trim().toLowerCase();
  return (SPEC.methods || []).filter(m => !q || m.name.includes(q) || (m.standard || '').includes(q) || m.kind.includes(q));
}
function paintSide() {
  const ms = visible();
  let h = '';
  for (const kind of KIND_ORDER) {
    const rows = ms.filter(m => kindOf(m) === kind);
    if (!rows.length) continue;
    h += `<h2>${kind} <b>${rows.length}</b></h2><div class="mlist">` +
      rows.map(m => `<a class="${kind}" href="#m-${esc(m.name)}" onclick="lit('${esc(m.name)}')"><i></i>${esc(m.name)}</a>`).join('') + '</div>';
  }
  $('side').innerHTML = h || '<div class="note">nothing matches</div>';
}
function lit(name) {
  document.querySelectorAll('.mcard.lit').forEach(x => x.classList.remove('lit'));
  const el = document.getElementById('m-' + name); if (el) el.classList.add('lit');
}
$('filter').oninput = () => { paintSide(); paintCards(); };

function paintCards() {
  const ms = visible();
  $('cards').innerHTML = ms.map(card).join('') || '<div class="empty">nothing matches</div>';
  ms.forEach(m => {
    const go = document.getElementById('go-' + m.name); if (go) go.onclick = () => run(m.name);
    const raw = document.getElementById('raw-' + m.name); if (raw) raw.onclick = () => toggleRaw(m.name);
    const sw = document.getElementById('sw-' + m.name); if (sw) sw.onclick = () => switchKind(m.name);
  });
}

const depositDefault = m => m.deposit === '1 yocto' ? '0.000000000000000000000001' : '';
const ph = a => a.example !== undefined && a.example !== null && a.example !== '' ? (typeof a.example === 'object' ? JSON.stringify(a.example) : String(a.example)) : '';

function argField(mname, a) {
  const id = `a-${mname}-${a.name}`;
  const opt = a.required === false ? '<span class="opt">optional</span>' : '';
  const ty = `<span class="ty">${esc(a.named_type || a.type)}</span>`;
  const label = `<label for="${id}"><b>${esc(a.name)}</b> ${ty} ${opt}${a.from === 'history' ? ' <span class="opt">seen in calls</span>' : ''}</label>`;
  let input;
  if (a.options && a.options.length) {
    input = `<select id="${id}" data-type="string">${a.required === false ? '<option value="">—</option>' : ''}` +
      a.options.map(o => `<option>${esc(o)}</option>`).join('') + '</select>';
  } else if (a.type === 'boolean') {
    input = `<select id="${id}" data-type="boolean"><option value="">—</option><option value="true">true</option><option value="false">false</option></select>`;
  } else if (a.type === 'number') {
    input = `<input id="${id}" data-type="number" type="number" step="any" placeholder="${esc(ph(a) || '0')}">`;
  } else if (a.type === 'array' || a.type === 'object' || a.type === 'json') {
    const ex = a.example && typeof a.example === 'object' ? JSON.stringify(a.example, null, 1) : (ph(a) || (a.type === 'array' ? '[]' : '{}'));
    return `<div class="arg wide">${label}<textarea id="${id}" data-type="json" placeholder="${esc(ex)}"></textarea></div>`;
  } else {
    const hint = a.type === 'u128' ? (ph(a) || '0') + '  (yocto units, as a string)' : a.type === 'account_id' ? (ph(a) || 'alice.near') : ph(a);
    input = `<input id="${id}" data-type="${esc(a.type)}" placeholder="${esc(hint)}">`;
  }
  return `<div class="arg">${label}${input}</div>`;
}

function card(m) {
  const kind = kindOf(m);
  const isChange = kind === 'change' || kind === 'init';
  const pills =
    `<span class="p ${kind}">${esc(m.kind)}</span>` +
    (m.standard ? `<span class="p hot">${esc(m.standard)}</span>` : '') +
    (m.deposit ? `<span class="p change">deposit · ${esc(m.deposit)}</span>` : '') +
    (m.private ? '<span class="p bad">private · callback</span>' : '') +
    (m.restricted ? '<span class="p bad">restricted</span>' : '') +
    (m.result ? `<span class="p">→ ${esc(m.result)}</span>` : '') +
    (m.seen ? `<span class="p">${m.seen} recent call${m.seen > 1 ? 's' : ''}</span>` : '');
  const sig = `(${(m.args || []).map(a => a.name + (a.required === false ? '?' : '')).join(', ')})`;
  const doc = m.doc ? `<div class="mdoc">${esc(m.doc)}</div>` : '';
  const note = m.note ? `<div class="note">${esc(m.note)}</div>` : '';
  const args = (m.args || []).length
    ? `<div class="args" id="args-${esc(m.name)}">${m.args.map(a => argField(m.name, a)).join('')}</div>`
    : '<div class="noargs">no arguments</div>';
  const rawArgs = `<div class="arg wide hide" id="rawwrap-${esc(m.name)}"><label>args as JSON</label>` +
    `<textarea id="rawargs-${esc(m.name)}" placeholder='{}'></textarea></div>`;
  const changeOpts = isChange ? `
      <input id="dep-${esc(m.name)}" placeholder="deposit N${m.deposit === 'positive' ? ' — required' : ' (0)'}" value="${depositDefault(m)}" style="width:${m.deposit === '1 yocto' ? 230 : 150}px">
      <input id="gas-${esc(m.name)}" placeholder="gas Tgas (100)" style="width:120px">
      <label class="confirmwrap" id="cw-${esc(m.name)}" style="display:${NET === 'mainnet' ? 'inline-flex' : 'none'}"><input type="checkbox" id="ck-${esc(m.name)}"> mainnet — spend real NEAR</label>` : '';
  const btn = isChange
    ? `<button class="go ${kind === 'init' ? 'vio' : 'warn'}" id="go-${esc(m.name)}">${kind === 'init' ? 'INIT' : 'SIGN + CALL'}</button>`
    : `<button class="go" id="go-${esc(m.name)}">${kind === 'unknown' ? 'TRY AS VIEW' : 'VIEW'}</button>`;
  const sw = `<button class="ghost" id="sw-${esc(m.name)}" title="the inference can be wrong — flip this method">${isChange ? 'as view' : 'as change'}</button>`;
  return `<div class="mcard ${kind}" id="m-${esc(m.name)}">
    <div class="mhead"><span class="nm">${esc(m.name)}<span class="paren">${esc(sig)}</span></span>${pills}
      <span class="conf" title="confidence ${m.confidence}">${conf(m.confidence)} · ${esc((m.source || []).join('+'))}</span></div>
    ${doc}${note}${args}${rawArgs}
    <div class="row">${btn}${changeOpts}<button class="ghost" id="raw-${esc(m.name)}">{ }</button>${sw}
      <span class="flash" id="fl-${esc(m.name)}"></span></div>
    <div class="mout" id="out-${esc(m.name)}"><div class="r" id="outr-${esc(m.name)}"></div><pre id="pre-${esc(m.name)}"></pre></div>
  </div>`;
}

function toggleRaw(name) {
  const w = $('rawwrap-' + name), f = $('args-' + name);
  const show = w.classList.contains('hide');
  if (show) { try { $('rawargs-' + name).value = JSON.stringify(collectArgs(name, true), null, 1); } catch (e) {} }
  w.classList.toggle('hide', !show);
  if (f) f.classList.toggle('hide', show);
}
function switchKind(name) {
  const m = SPEC.methods.find(x => x.name === name); if (!m) return;
  m.kind = (m.kind === 'change' || m.kind === 'init') ? 'view' : 'change';
  m.confidence = 0.3; m.source = ['you'];
  paintSide(); paintCards(); lit(name);
}

function collectArgs(name, lenient) {
  const m = SPEC.methods.find(x => x.name === name);
  const raw = $('rawwrap-' + name);
  if (raw && !raw.classList.contains('hide')) {
    const t = $('rawargs-' + name).value.trim();
    return t ? JSON.parse(t) : {};
  }
  const out = {};
  for (const a of m.args || []) {
    const el = $(`a-${name}-${a.name}`); if (!el) continue;
    const v = el.value;
    if (v === '' || v == null) {
      if (a.required !== false && !lenient) throw new Error(`${a.name} is required`);
      continue;
    }
    const t = el.dataset.type;
    if (t === 'number') out[a.name] = Number(v);
    else if (t === 'boolean') out[a.name] = v === 'true';
    else if (t === 'json') { try { out[a.name] = JSON.parse(v); } catch (e) { throw new Error(`${a.name}: not valid JSON`); } }
    else out[a.name] = v;
  }
  return out;
}

const big = s => typeof s === 'string' && /^\d{13,}$/.test(s);
function hints(result) {
  // a bare digit string is almost always yocto or a token amount — show it scaled
  if (big(result)) {
    const n = Number(result);
    return `<span class="dimtxt">≈ ${(n / 1e24).toLocaleString('en-US', {maximumFractionDigits: 6})} if ÷10²⁴ · ${(n / 1e6).toLocaleString('en-US', {maximumFractionDigits: 2})} if ÷10⁶ · ${(n / 1e18).toLocaleString('en-US', {maximumFractionDigits: 6})} if ÷10¹⁸</span>`;
  }
  return '';
}

async function run(name) {
  const m = SPEC.methods.find(x => x.name === name);
  const kind = kindOf(m), isChange = kind === 'change' || kind === 'init';
  const fl = $('fl-' + name), out = $('out-' + name), pre = $('pre-' + name), r = $('outr-' + name);
  fl.textContent = '';
  let args;
  try { args = collectArgs(name); } catch (e) { fl.textContent = e.message; return; }
  if (isChange && NET === 'mainnet' && !$('ck-' + name).checked) { fl.textContent = 'tick the mainnet box to spend real NEAR'; return; }
  if (isChange && !localStorage.getItem('near_token')) { fl.textContent = 'save the remote-write token first (top of the page)'; tokenState(); $('tokenrow').classList.remove('hide'); return; }
  const go = $('go-' + name); go.disabled = true;
  out.style.display = 'block'; r.innerHTML = ''; pre.textContent = isChange ? 'signing + sending…' : 'calling…';
  try {
    let res;
    if (isChange) {
      const dep = $('dep-' + name).value.trim(), gas = $('gas-' + name).value.trim();
      res = await jp('/call', {contract: CONTRACT, method: name, args, network: NET,
                               deposit_near: dep ? Number(dep) === 0 ? 0 : dep : 0,
                               gas_tgas: gas ? Number(gas) : undefined, confirm: NET !== 'testnet'});
      r.innerHTML = `<span class="p ${res.status === 'ok' || res.success ? 'view' : 'bad'}">${esc(res.status || (res.success ? 'ok' : 'sent'))}</span>` +
        (res.hash ? `<a href="${esc(EXPLORER[NET])}/txns/${esc(res.hash)}" target="_blank" rel="noopener">${esc(res.hash.slice(0, 12))}… ↗</a>` : '') +
        (res.fee_near != null ? `<span class="dimtxt">fee ${esc(res.fee_near)} N</span>` : '') +
        (res.signer ? `<span class="dimtxt">as ${esc(res.signer)}</span>` : '');
      pre.textContent = JSON.stringify(res.result !== undefined ? {result: res.result, logs: res.logs || []} : res, null, 2);
      if (res.error) fl.textContent = res.error;
    } else {
      res = await jp('/view', {contract: CONTRACT, method: name, args, network: NET});
      r.innerHTML = `<span class="p view">ok</span><span class="dimtxt">block ${esc(res.block_height)}</span>` + hints(res.result) +
        ((res.logs || []).length ? `<span class="dimtxt">${res.logs.length} log${res.logs.length > 1 ? 's' : ''}</span>` : '');
      pre.textContent = JSON.stringify(res.result, null, 2) + ((res.logs || []).length ? '\n\nlogs:\n' + res.logs.join('\n') : '');
    }
  } catch (e) {
    r.innerHTML = '<span class="p bad">panicked</span>';
    pre.textContent = e.message + (e.detail && e.detail.logs && e.detail.logs.length ? '\n\nlogs:\n' + e.detail.logs.join('\n') : '');
    if (/change method|ProhibitedInView/.test(e.message) && !isChange) {
      fl.textContent = 'this is a change method — flip it with "as change"';
    }
  } finally { go.disabled = false; }
}

$('reinfer').onclick = () => load(true);
$('showjson').onclick = () => $('rawspec').classList.toggle('hide');
load();
</script>
</body>
</html>
