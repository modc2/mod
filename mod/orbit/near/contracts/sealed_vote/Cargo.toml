[package]
name = "sealed_vote"
version = "0.1.0"
edition = "2021"
description = "Everyone submits a sealed number, nobody can read it, nobody can copy it (the seal is bound to the sender), then everyone opens theirs and the contract checks each seal"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
