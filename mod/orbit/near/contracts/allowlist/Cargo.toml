[package]
name = "allowlist"
version = "0.1.0"
edition = "2021"
description = "The owner publishes one 32-byte root for a list of thousands of accounts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
