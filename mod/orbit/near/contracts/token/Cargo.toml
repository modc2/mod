[package]
name = "token"
version = "0.1.0"
edition = "2021"
description = "A fungible token written out in full, no library: balances in a LookupMap, owner-only mint, burn, and ft_transfer with the one-yoctoNEAR safety deposit every NEAR wallet expects"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
