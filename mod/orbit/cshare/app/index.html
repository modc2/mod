<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cshare — Agent Protocol</title>
<style>
  :root {
    --bg: #0b0e13; --panel: #11151d; --panel2: #161b25; --line: #232a38;
    --text: #dbe2ee; --dim: #7d8899; --accent: #5eead4; --accent2: #93c5fd;
    --bad: #f87171; --ok: #4ade80;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 var(--mono); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 1px; }
  .proto { color: var(--accent); border: 1px solid var(--line);
           border-radius: 4px; padding: 1px 8px; font-size: 12px; }
  .sub { color: var(--dim); margin: 8px 0 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  .pill { border: 1px solid var(--line); background: var(--panel); color: var(--dim);
          border-radius: 999px; padding: 4px 14px; cursor: pointer; font: inherit; }
  .pill.on { color: #041014; background: var(--accent); border-color: var(--accent); }
  input[type=text] { flex: 1; min-width: 200px; background: var(--panel);
    border: 1px solid var(--line); color: var(--text); border-radius: 6px;
    padding: 8px 12px; font: inherit; outline: none; }
  input[type=text]:focus { border-color: var(--accent2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
          gap: 12px; margin-top: 16px; }
  .cardi { background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 14px; display: flex;
           flex-direction: column; gap: 8px; }
  .cardi .top { display: flex; justify-content: space-between; gap: 8px; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
          color: var(--accent2); }
  .kind.prompt { color: var(--accent); } .kind.agent { color: #f0abfc; }
  .kind.toolbox { color: #fbbf24; } .kind.memory { color: #93c5fd; }
  .name { font-weight: 700; }
  .desc { color: var(--dim); font-size: 13px; flex: 1; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; color: var(--dim); border: 1px solid var(--line);
         border-radius: 4px; padding: 0 6px; }
  .cid { display: flex; gap: 6px; align-items: center; font-size: 11px;
         color: var(--dim); overflow: hidden; }
  .cid code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cid button, .imp button { background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); border-radius: 5px; padding: 3px 10px; cursor: pointer;
    font: inherit; font-size: 11px; }
  .cid button:hover, .imp button:hover { border-color: var(--accent); }
  .builtin { font-size: 10px; color: var(--dim); }
  .imp { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
         padding: 14px; margin-top: 26px; }
  .imp h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase;
            letter-spacing: 1px; color: var(--dim); }
  .imp .row { margin: 0; }
  #impOut { margin-top: 10px; font-size: 12px; white-space: pre-wrap;
            word-break: break-all; }
  #impOut.ok { color: var(--ok); } #impOut.bad { color: var(--bad); }
  .foot { margin-top: 30px; color: var(--dim); font-size: 12px; }
  .foot a { color: var(--accent2); text-decoration: none; }
  .empty { color: var(--dim); padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>cshare</h1>
    <span class="proto" id="proto">agent/1.0</span>
  </header>
  <div class="sub" id="desc">Agent Protocol hub — every agent artifact, one index, shareable by CID.</div>

  <div class="row" id="pills"></div>
  <div class="row">
    <input type="text" id="q" placeholder="search name, description, tags…" />
  </div>
  <div class="grid" id="grid"></div>

  <div class="imp">
    <h2>Install by CID</h2>
    <div class="row">
      <input type="text" id="impCid" placeholder="Qm… (prompt, agent, toolbox, or memory bundle)" />
      <button id="impResolve">RESOLVE</button>
      <button id="impGo">INSTALL</button>
    </div>
    <div id="impOut"></div>
  </div>

  <div class="foot">
    protocol card: <a href="/cshare/api/card" target="_blank">/card</a> ·
    <a href="/cshare/api/.well-known/agent.json" target="_blank">/.well-known/agent.json</a> ·
    index: <a href="/cshare/api/index" target="_blank">/index</a>
  </div>
</div>
<script>
const API = "/cshare/api";
const KINDS = ["all", "prompt", "agent", "toolbox", "memory"];
let kind = "all", q = "", items = [];

const $ = (id) => document.getElementById(id);

async function api(path, opts) {
  const r = await fetch(`${API}${path}`, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || body.error || r.statusText);
  return body;
}

function pills() {
  $("pills").innerHTML = "";
  for (const k of KINDS) {
    const b = document.createElement("button");
    b.className = "pill" + (k === kind ? " on" : "");
    b.textContent = k.toUpperCase();
    b.onclick = () => { kind = k; pills(); load(); };
    $("pills").appendChild(b);
  }
}

function render() {
  const g = $("grid");
  g.innerHTML = "";
  const ql = q.toLowerCase();
  const shown = items.filter((it) =>
    !ql || it.name.toLowerCase().includes(ql) ||
    (it.description || "").toLowerCase().includes(ql) ||
    (it.tags || []).some((t) => t.toLowerCase().includes(ql)));
  if (!shown.length) {
    g.innerHTML = '<div class="empty">no artifacts match</div>';
    return;
  }
  for (const it of shown) {
    const d = document.createElement("div");
    d.className = "cardi";
    const tags = (it.tags || [])
      .map((t) => `<span class="tag">${esc(t)}</span>`).join("");
    const tools = (it.tools || []).length
      ? `<div class="tags">${it.tools.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : "";
    const cid = it.cid
      ? `<div class="cid"><code title="${esc(it.cid)}">${esc(it.cid)}</code>
           <button data-cid="${esc(it.cid)}">COPY</button></div>`
      : `<div class="cid"><button data-share="${esc(it.kind)}:${esc(it.id)}">MINT CID</button></div>`;
    d.innerHTML = `
      <div class="top"><span class="kind ${esc(it.kind)}">${esc(it.kind)}</span>
        ${it.builtin ? '<span class="builtin">builtin</span>' : ""}</div>
      <div class="name">${esc(it.name)}</div>
      <div class="desc">${esc(it.description || "")}</div>
      ${tags ? `<div class="tags">${tags}</div>` : ""}${tools}${cid}`;
    g.appendChild(d);
  }
  g.querySelectorAll("button[data-cid]").forEach((b) => {
    b.onclick = () => {
      navigator.clipboard.writeText(b.dataset.cid);
      b.textContent = "COPIED"; setTimeout(() => (b.textContent = "COPY"), 1200);
    };
  });
  g.querySelectorAll("button[data-share]").forEach((b) => {
    b.onclick = async () => {
      const [k, id] = b.dataset.share.split(/:(.*)/s);
      b.textContent = "…";
      try {
        await api("/share", { method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ kind: k, id }) });
        load();
      } catch (e) { b.textContent = "FAILED"; }
    };
  });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function load() {
  try {
    const card = await api("/card");
    $("proto").textContent = card.protocol;
    $("desc").textContent = card.description;
  } catch (e) { /* card is cosmetic */ }
  try {
    items = await api(`/index${kind === "all" ? "" : `?kind=${kind}`}`);
  } catch (e) {
    $("grid").innerHTML = `<div class="empty">api unreachable: ${esc(e.message)}</div>`;
    return;
  }
  render();
}

$("q").addEventListener("input", (e) => { q = e.target.value; render(); });

function impOut(msg, ok) {
  const el = $("impOut");
  el.textContent = msg;
  el.className = ok ? "ok" : "bad";
}
$("impResolve").onclick = async () => {
  const cid = $("impCid").value.trim();
  if (!cid) return;
  impOut("resolving…", true);
  try {
    const r = await api(`/resolve/${encodeURIComponent(cid)}`);
    impOut(`${r.valid ? "valid" : "INVALID"} ${r.kind || "?"} bundle\n` +
      JSON.stringify(r.bundle, null, 2).slice(0, 800), r.valid);
  } catch (e) { impOut(e.message, false); }
};
$("impGo").onclick = async () => {
  const cid = $("impCid").value.trim();
  if (!cid) return;
  impOut("installing…", true);
  try {
    const r = await api("/install", { method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ cid }) });
    impOut(`installed ${r.kind}: ${r.installed.name || r.installed.id || ""}`, true);
    load();
  } catch (e) { impOut(e.message, false); }
};

pills();
load();
</script>
</body>
</html>
